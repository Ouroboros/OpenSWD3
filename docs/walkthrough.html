<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>流程攻略</title>
<style>
:root {
  --gold: #c9a24a;
  --gold-dark: #7a5a1c;
  --gold-light: #f2d27a;
  --text: #e9dcb8;
  --dim: #b9a67a;
  --panel: rgba(14, 10, 4, 0.94);
  --ink: #7a1f12;
  --jade-light: #9fd4bb;
  --kai: "BiauKai", "DFKai-SB", "標楷體", "KaiTi", "STKaiti", "Kaiti TC", serif;
  --ming: "PMingLiU", "MingLiU", "新細明體", "Songti TC", "Noto Serif TC", "Noto Serif CJK TC", serif;
}

* { box-sizing: border-box; }

html, body { margin: 0; height: 100%; overflow: hidden; }

body {
  font-family: var(--ming);
  color: var(--text);
  background:
    radial-gradient(ellipse at 20% 10%, rgba(255, 250, 230, 0.55), transparent 55%),
    radial-gradient(ellipse at 80% 85%, rgba(120, 90, 50, 0.35), transparent 60%),
    radial-gradient(ellipse at 60% 40%, rgba(90, 70, 40, 0.25), transparent 50%),
    repeating-linear-gradient(90deg, rgba(110, 60, 20, 0.08) 0 1px, transparent 1px 72px),
    linear-gradient(160deg, #e8dcc0 0%, #d6c39c 45%, #c4ab7d 100%);
}

.book {
  position: absolute;
  left: 0;
  top: 0;
  width: 1180px;
  height: 870px;
  padding: 12px 12px 8px;
  display: flex;
  flex-direction: column;
  transform-origin: 0 0;
}

.top {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  border-top: 2px solid rgba(122, 60, 20, 0.45);
  background: repeating-linear-gradient(90deg, rgba(122, 60, 20, 0.35) 0 1px, transparent 1px 54px);
  height: 64px;
  flex: none;
  padding: 0 12px 4px 6px;
}

h1 {
  margin: 0;
  font-family: var(--kai);
  font-size: 44px;
  letter-spacing: 6px;
  color: var(--ink);
  text-shadow: 2px 2px 0 rgba(255, 240, 210, 0.6), 0 0 6px rgba(122, 31, 18, 0.25);
  font-weight: bold;
}

.search {
  width: 360px;
  height: 34px;
  margin: 0 0 6px 6px;
  padding: 0 10px;
  font: inherit;
  font-size: 18px;
  color: #3b2a12;
  background: rgba(255, 248, 228, 0.8);
  border: 1px solid rgba(122, 60, 20, 0.6);
  border-radius: 3px;
  outline: none;
}

.search:focus { border-color: var(--ink); background: #fffaf0; }

.layout {
  display: grid;
  grid-template-columns: 110px 250px 1fr;
  gap: 0 14px;
  margin-top: 8px;
  flex: 1;
  min-height: 0;
}

.frame {
  background: var(--panel);
  border: 3px double var(--gold);
  box-shadow: inset 0 0 0 1px var(--gold-dark), 0 0 0 1px #3a2a10, 2px 3px 8px rgba(40, 25, 5, 0.55);
}

.tabs {
  display: flex;
  flex-direction: column;
  gap: 3px;
  padding-top: 10px;
  margin-right: -14px;
  overflow-y: auto;
  scrollbar-width: none;
  z-index: 1;
}

.tab {
  font-family: var(--kai);
  font-size: 19px;
  padding: 5px 12px 5px 10px;
  color: #6d5a3c;
  background: linear-gradient(90deg, #b8a27a, #d9c9a3);
  border: 1px solid #8a6d3b;
  border-right: none;
  border-radius: 6px 0 0 6px;
  cursor: pointer;
  user-select: none;
  text-align: center;
  white-space: nowrap;
}

.tab.chosen { color: #1e1406; background: linear-gradient(90deg, #d6b45e, #f6e3a6); border-color: var(--gold-dark);
  font-weight: bold; }
.tab.found { color: #3a2a10; background: linear-gradient(90deg, #cdb88a, #eadcb6); border-color: var(--gold-dark);
  box-shadow: inset 4px 0 0 var(--gold-dark); }

.list {
  min-height: 0;
  overflow-x: hidden;
  overflow-y: auto;
  scrollbar-gutter: stable;
  padding: 12px 6px 12px 10px;
  scrollbar-color: var(--gold-dark) #120e06;
}

.row {
  font-family: var(--kai);
  font-size: 22px;
  line-height: 36px;
  padding: 0 8px 0 6px;
  cursor: pointer;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  text-shadow: 1px 1px 0 #000;
}

.row.chosen { color: #fff6d6;
  background: linear-gradient(90deg, rgba(232, 168, 56, 0.95), rgba(170, 110, 20, 0.75) 45%, rgba(90, 55, 5, 0.1)); }
.empty { font-family: var(--kai); font-size: 20px; color: var(--dim); padding: 8px 6px; }

.page {
  display: flex;
  flex-direction: column;
  min-height: 0;
  padding: 14px 8px 12px 24px;
}

.page .title { flex: none; font-family: var(--kai); font-size: 32px; line-height: 44px; color: #fff2c8;
  border-bottom: 1px solid var(--gold-dark); margin-right: 16px; padding-bottom: 4px; }
.page .title small { font-size: 18px; color: var(--dim); margin-left: 14px; }
.page .body { flex: 1; min-height: 0; overflow-y: auto; scrollbar-gutter: stable; padding: 4px 14px 10px 0;
  scrollbar-color: var(--gold-dark) #120e06; font-size: 18px; line-height: 31px; }
.page h3 { font-family: var(--kai); font-size: 23px; font-weight: normal; color: var(--gold-light); margin: 14px 0 2px; }
.page p { margin: 2px 0 6px; }
.page ul { margin: 0 0 6px; padding-left: 22px; }
.page li { margin: 0; }
.page li::marker { color: var(--gold); }

.jump { color: #fff2c8; cursor: pointer; border-bottom: 1px dotted rgba(242, 210, 122, 0.55); }
.jump.bestiary { color: #f6d9a8; }
.jump:hover { color: var(--gold-light); border-bottom-style: solid; }
.goto { color: var(--jade-light); cursor: pointer; border-bottom: 1px dotted rgba(159, 212, 187, 0.6); }
.goto:hover { border-bottom-style: solid; }

.tag { display: inline-block; font-family: var(--kai); font-size: 15px; line-height: 21px; padding: 0 7px;
  margin: 0 3px; border-radius: 9px; vertical-align: 1px; white-space: nowrap; }
.tag.domo { color: #fff2c8; background: linear-gradient(180deg, #3e7a63, #1f3d33); border: 1px solid var(--jade-light); }
.tag.sarda { color: #fff2c8; background: linear-gradient(180deg, #8a5a1c, #4a2e08); border: 1px solid var(--gold); }
.tag.edition { color: #e9dcb8; background: #3a3020; border: 1px solid #8a7550; }
.tag.time { color: #ffd6c8; background: #4a1e14; border: 1px solid #a05a40; }

mark { background: rgba(232, 168, 56, 0.45); color: inherit; }

.hint { flex: none; margin-top: 6px; font-size: 13px; color: #5a4524; text-align: right; }
</style>
</head>
<body>
<div class="book">
  <div class="top">
    <input class="search" id="search" type="search" placeholder="搜尋地點、物品、支線" autocomplete="off">
    <h1>流程攻略</h1>
  </div>
  <div class="layout">
    <div class="tabs" id="tabs"></div>
    <div class="frame list" id="list"></div>
    <div class="frame page"><div class="title" id="title"></div><div class="body" id="body"></div></div>
  </div>
  <div class="hint">↑↓ 選擇　←→ 切換篇章　點物品或怪物的名字可打開物品大全、神魔異事錄，點綠色的項目可跳到該頁　搜尋可空格分隔多個關鍵字，Esc 清除</div>
</div>
<script>
const DATA = {"chapters": ["歐洲", "移動島", "阿拉伯", "西域", "大唐", "安史之亂後", "系列任務"], "sections": [{"chapter": "歐洲", "title": "威尼斯", "text": "威尼斯\n# 流程\n酒館打倒兩名法蘭克騎士梅羅文加軍人 → 得知阿拉伯商人關在教堂 → 教堂進不去，教堂旁樹林的小路克說墓園有通往教堂的地道 → 墓園調查左上角無字墓碑。\n# 大廣場\n- 地上：結纍葡萄（去教堂的路左側）、解毒草、博落迴之根（左下路兩側）。\n- 寶箱：頭巾（武器店外）、無酵餅（右上河邊）。\n- 隱藏：連續敲廣場中央的鐘 20 下，得絕情貓袖箭（攻擊 +70，妮可前期最強武器）。\n# 護民官的家（廣場右上）\n- 一樓寶箱：頭巾、魔法葉。\n- 二樓：無酵餅（樓梯對面罈子右側，隱藏）、靈界指標（床頭櫃，隱藏）、還神果（最右側圓桌上的瓶子）。\n# 河邊民房（廣場右下，沿小巷走到河邊，派恩家左側）\n- 一樓：魯特琴（進門左側箱子，隱藏）DOMO。\n- 二樓：魔法葉（白色罈子，隱藏）、藥草（最右側圓桌）。\n# 教堂前\n- 地上：藥草×2（過橋兩側）。\n- 隱藏：銅戒指（井裡）。\n# 住宅區（左廣場）\n- 地上：山蛇莓（旅館左側樹叢）DOMO。\n- 隱藏：解毒草（左下過橋後路左側的桶）。\n# 法蘭克關隘（威尼斯東北）\n- 地上：魔法葉（士兵右下）。\n- 最後軒轅劍開封後，調查士兵右側的木桶，會顯示遊戲最後修改的日期。\n# 支線\n- 花語：幫廣場西邊的尤金問住宅區的蒙妮卡，黃色鬱金香是什麼意思，回來告訴他，得結纍葡萄。\n- 紅寶石戒指：廣場左下的珠寶商布爾諾缺紅寶石。從護民官家右側的小巷進去找阿拉伯商人西魯士（旁邊還有無酵餅），花 80 銀幣買紅寶石戒指，交給布爾諾，退回 80 銀幣並得棉布衣。\n- 生日禮物：住宅區橋邊的陶德托你買珍珠。先和廣場下邊的漁夫派恩說話，再到河邊派恩家向他妻子潘朵拉買珍珠，交給陶德，得 50 銀幣和藥草。\n- 賈西的姪子：運河邊屋中的賈西擔心姪子亨利。到法蘭克關隘找亨利，回來告訴賈西得 100 銀幣；再去找亨利得無酵餅。\n- 獵人的算術 典藏版：住宅區左下橋頭的獵人亞雷，答「1 分 15 秒」，得十果粉。", "html": "<h3>流程</h3><p>酒館打倒兩名法蘭克騎士<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"梅羅文加軍人@400\" title=\"在神魔異事錄中打開\">梅羅文加軍人</span> → 得知阿拉伯商人關在教堂 → 教堂進不去，教堂旁樹林的小路克說墓園有通往教堂的地道 → 墓園調查左上角無字墓碑。</p><h3>大廣場</h3><ul><li>地上：<span class=\"jump items\" data-view=\"items\" data-detail=\"結纍葡萄@622\" title=\"在物品大全中打開\">結纍葡萄</span>（去教堂的路左側）、<span class=\"jump items\" data-view=\"items\" data-detail=\"解毒草@647\" title=\"在物品大全中打開\">解毒草</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"博落迴之根@719\" title=\"在物品大全中打開\">博落迴之根</span>（左下路兩側）。</li><li>寶箱：<span class=\"jump items\" data-view=\"items\" data-detail=\"頭巾@1019\" title=\"在物品大全中打開\">頭巾</span>（武器店外）、<span class=\"jump items\" data-view=\"items\" data-detail=\"無酵餅@624\" title=\"在物品大全中打開\">無酵餅</span>（右上河邊）。</li><li>隱藏：連續敲廣場中央的鐘 20 下，得<span class=\"jump items\" data-view=\"items\" data-detail=\"絕情貓袖箭@533\" title=\"在物品大全中打開\">絕情貓袖箭</span>（攻擊 +70，妮可前期最強武器）。</li></ul><h3>護民官的家（廣場右上）</h3><ul><li>一樓寶箱：<span class=\"jump items\" data-view=\"items\" data-detail=\"頭巾@1019\" title=\"在物品大全中打開\">頭巾</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"魔法葉@636\" title=\"在物品大全中打開\">魔法葉</span>。</li><li>二樓：<span class=\"jump items\" data-view=\"items\" data-detail=\"無酵餅@624\" title=\"在物品大全中打開\">無酵餅</span>（樓梯對面罈子右側，隱藏）、<span class=\"jump items\" data-view=\"items\" data-detail=\"靈界指標@769\" title=\"在物品大全中打開\">靈界指標</span>（床頭櫃，隱藏）、<span class=\"jump items\" data-view=\"items\" data-detail=\"還神果@653\" title=\"在物品大全中打開\">還神果</span>（最右側圓桌上的瓶子）。</li></ul><h3>河邊民房（廣場右下，沿小巷走到河邊，派恩家左側）</h3><ul><li>一樓：<span class=\"jump items\" data-view=\"items\" data-detail=\"魯特琴@829\" title=\"在物品大全中打開\">魯特琴</span>（進門左側箱子，隱藏）<span class=\"tag domo\">DOMO</span>。</li><li>二樓：<span class=\"jump items\" data-view=\"items\" data-detail=\"魔法葉@636\" title=\"在物品大全中打開\">魔法葉</span>（白色罈子，隱藏）、<span class=\"jump items\" data-view=\"items\" data-detail=\"藥草@621\" title=\"在物品大全中打開\">藥草</span>（最右側圓桌）。</li></ul><h3>教堂前</h3><ul><li>地上：<span class=\"jump items\" data-view=\"items\" data-detail=\"藥草@621\" title=\"在物品大全中打開\">藥草</span>×2（過橋兩側）。</li><li>隱藏：<span class=\"jump items\" data-view=\"items\" data-detail=\"銅戒指@971\" title=\"在物品大全中打開\">銅戒指</span>（井裡）。</li></ul><h3>住宅區（左廣場）</h3><ul><li>地上：<span class=\"jump items\" data-view=\"items\" data-detail=\"山蛇莓@722\" title=\"在物品大全中打開\">山蛇莓</span>（旅館左側樹叢）<span class=\"tag domo\">DOMO</span>。</li><li>隱藏：<span class=\"jump items\" data-view=\"items\" data-detail=\"解毒草@647\" title=\"在物品大全中打開\">解毒草</span>（左下過橋後路左側的桶）。</li></ul><h3>法蘭克關隘（威尼斯東北）</h3><ul><li>地上：<span class=\"jump items\" data-view=\"items\" data-detail=\"魔法葉@636\" title=\"在物品大全中打開\">魔法葉</span>（士兵右下）。</li><li>最後軒轅劍開封後，調查士兵右側的木桶，會顯示遊戲最後修改的日期。</li></ul><h3>支線</h3><ul><li>花語：幫廣場西邊的尤金問住宅區的蒙妮卡，黃色鬱金香是什麼意思，回來告訴他，得<span class=\"jump items\" data-view=\"items\" data-detail=\"結纍葡萄@622\" title=\"在物品大全中打開\">結纍葡萄</span>。</li><li>紅寶石戒指：廣場左下的珠寶商布爾諾缺紅寶石。從護民官家右側的小巷進去找阿拉伯商人西魯士（旁邊還有<span class=\"jump items\" data-view=\"items\" data-detail=\"無酵餅@624\" title=\"在物品大全中打開\">無酵餅</span>），花 80 銀幣買<span class=\"jump items\" data-view=\"items\" data-detail=\"紅寶石戒指@766\" title=\"在物品大全中打開\">紅寶石戒指</span>，交給布爾諾，退回 80 銀幣並得<span class=\"jump items\" data-view=\"items\" data-detail=\"棉布衣@1003\" title=\"在物品大全中打開\">棉布衣</span>。</li><li>生日禮物：住宅區橋邊的陶德托你買珍珠。先和廣場下邊的漁夫派恩說話，再到河邊派恩家向他妻子潘朵拉買<span class=\"jump items\" data-view=\"items\" data-detail=\"珍珠@767\" title=\"在物品大全中打開\">珍珠</span>，交給陶德，得 50 銀幣和<span class=\"jump items\" data-view=\"items\" data-detail=\"藥草@621\" title=\"在物品大全中打開\">藥草</span>。</li><li>賈西的姪子：運河邊屋中的賈西擔心姪子亨利。到法蘭克關隘找亨利，回來告訴賈西得 100 銀幣；再去找亨利得<span class=\"jump items\" data-view=\"items\" data-detail=\"無酵餅@624\" title=\"在物品大全中打開\">無酵餅</span>。</li><li>獵人的算術 <span class=\"tag edition\">典藏版</span>：住宅區左下橋頭的獵人亞雷，答「1 分 15 秒」，得<span class=\"jump items\" data-view=\"items\" data-detail=\"十果粉@626\" title=\"在物品大全中打開\">十果粉</span>。</li></ul>"}, {"chapter": "歐洲", "title": "墓園與地道", "text": "墓園與地道\n# 墓園\n- 調查左上角無字墓碑，拉起拉環進入地道。\n- 財產分配：和婦人說話，答「分 7 份，兒子 4、妻子 2、女兒 1」，得藥草×2 和 100 銀幣。\n- 數學家的年齡：調查上面數學家的墓碑，答「84」，得知教堂壁畫裡有寶物；再靠近墓碑一次得玫瑰DOMO。\n- 小狗開會（妮可加入後）：帶妮可到住宅區路燈下和三隻狗說話，得知墓園石頭上有寶物，到墓園右上的石頭調查得空白符紙。\n# 地道\n- 寶箱：20 銀幣、藥草、諸方神石、結纍葡萄。\n- 地上：藥草（第八幕中間）。\n- 隱藏：解毒草（第二幕下方小門裡上面的草叢）、長劍（第五幕瀑布後面）。\n- 封印之光：封印之劍（1）。\n- BOSS：獢。", "html": "<h3>墓園</h3><ul><li>調查左上角無字墓碑，拉起拉環進入地道。</li><li>財產分配：和婦人說話，答「分 7 份，兒子 4、妻子 2、女兒 1」，得<span class=\"jump items\" data-view=\"items\" data-detail=\"藥草@621\" title=\"在物品大全中打開\">藥草</span>×2 和 100 銀幣。</li><li>數學家的年齡：調查上面數學家的墓碑，答「84」，得知教堂壁畫裡有寶物；再靠近墓碑一次得<span class=\"jump items\" data-view=\"items\" data-detail=\"玫瑰@824\" title=\"在物品大全中打開\">玫瑰</span><span class=\"tag domo\">DOMO</span>。</li><li>小狗開會（妮可加入後）：帶妮可到住宅區路燈下和三隻狗說話，得知墓園石頭上有寶物，到墓園右上的石頭調查得<span class=\"jump items\" data-view=\"items\" data-detail=\"空白符紙@768\" title=\"在物品大全中打開\">空白符紙</span>。</li></ul><h3>地道</h3><ul><li>寶箱：20 銀幣、<span class=\"jump items\" data-view=\"items\" data-detail=\"藥草@621\" title=\"在物品大全中打開\">藥草</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"諸方神石@698\" title=\"在物品大全中打開\">諸方神石</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"結纍葡萄@622\" title=\"在物品大全中打開\">結纍葡萄</span>。</li><li>地上：<span class=\"jump items\" data-view=\"items\" data-detail=\"藥草@621\" title=\"在物品大全中打開\">藥草</span>（第八幕中間）。</li><li>隱藏：<span class=\"jump items\" data-view=\"items\" data-detail=\"解毒草@647\" title=\"在物品大全中打開\">解毒草</span>（第二幕下方小門裡上面的草叢）、<span class=\"jump items\" data-view=\"items\" data-detail=\"長劍@502\" title=\"在物品大全中打開\">長劍</span>（第五幕瀑布後面）。</li><li>封印之光：<span class=\"jump items\" data-view=\"items\" data-detail=\"封印之劍@793\" title=\"在物品大全中打開\">封印之劍</span>（1）。</li><li>BOSS：<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"獢@130\" title=\"在神魔異事錄中打開\">獢</span>。</li></ul>"}, {"chapter": "歐洲", "title": "教堂", "text": "教堂\n# 流程\n出地道到教堂後院，和約瑟修士說話（可補滿體力），得知要先打開教堂左右兩座塔頂的開關 → 祭壇下出現秘門 → 地牢救出囚犯 → 給左側牢房的老人清水，他在祭壇畫六芒星召喚出妮可 → 到廣場救阿拉伯商人，打敗麥爾斯 → 去威尼斯右下的海洞，得知航海圖被送到修道院；中國瓷壺變成煉妖壺，學會靈契。\n# 教堂後院\n- 地上：魔法葉（地道口上方）、結纍葡萄、解毒草（左下、右下）、藥草（過橋右側）。\n- 隱藏：銅戒指（約瑟修士右上的樹）。\n# 教堂內\n- 寶箱：結纍葡萄（右塔二樓）、回復劑（左塔一樓）、魔法葉（大廳右上）。\n- 解出墓園數學題後，可調查：無酵餅（祭壇左側壁畫，隱藏）、結纍葡萄（右側壁畫，隱藏）、鐵鎖手套（中間燭台，隱藏）。\n# 地牢\n- 寶箱：50 銀幣、皮手套。\n- 隱藏：無酵餅（桌上）。", "html": "<h3>流程</h3><p>出地道到教堂後院，和約瑟修士說話（可補滿體力），得知要先打開教堂左右兩座塔頂的開關 → 祭壇下出現秘門 → 地牢救出囚犯 → 給左側牢房的老人<span class=\"jump items\" data-view=\"items\" data-detail=\"清水@732\" title=\"在物品大全中打開\">清水</span>，他在祭壇畫六芒星召喚出妮可 → 到廣場救阿拉伯商人，打敗<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"麥爾斯@4\" title=\"在神魔異事錄中打開\">麥爾斯</span> → 去威尼斯右下的海洞，得知航海圖被送到修道院；中國瓷壺變成<span class=\"jump items\" data-view=\"items\" data-detail=\"煉妖壺@731\" title=\"在物品大全中打開\">煉妖壺</span>，學會靈契。</p><h3>教堂後院</h3><ul><li>地上：<span class=\"jump items\" data-view=\"items\" data-detail=\"魔法葉@636\" title=\"在物品大全中打開\">魔法葉</span>（地道口上方）、<span class=\"jump items\" data-view=\"items\" data-detail=\"結纍葡萄@622\" title=\"在物品大全中打開\">結纍葡萄</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"解毒草@647\" title=\"在物品大全中打開\">解毒草</span>（左下、右下）、<span class=\"jump items\" data-view=\"items\" data-detail=\"藥草@621\" title=\"在物品大全中打開\">藥草</span>（過橋右側）。</li><li>隱藏：<span class=\"jump items\" data-view=\"items\" data-detail=\"銅戒指@971\" title=\"在物品大全中打開\">銅戒指</span>（約瑟修士右上的樹）。</li></ul><h3>教堂內</h3><ul><li>寶箱：<span class=\"jump items\" data-view=\"items\" data-detail=\"結纍葡萄@622\" title=\"在物品大全中打開\">結纍葡萄</span>（右塔二樓）、<span class=\"jump items\" data-view=\"items\" data-detail=\"回復劑@625\" title=\"在物品大全中打開\">回復劑</span>（左塔一樓）、<span class=\"jump items\" data-view=\"items\" data-detail=\"魔法葉@636\" title=\"在物品大全中打開\">魔法葉</span>（大廳右上）。</li><li>解出墓園數學題後，可調查：<span class=\"jump items\" data-view=\"items\" data-detail=\"無酵餅@624\" title=\"在物品大全中打開\">無酵餅</span>（祭壇左側壁畫，隱藏）、<span class=\"jump items\" data-view=\"items\" data-detail=\"結纍葡萄@622\" title=\"在物品大全中打開\">結纍葡萄</span>（右側壁畫，隱藏）、<span class=\"jump items\" data-view=\"items\" data-detail=\"鐵鎖手套@873\" title=\"在物品大全中打開\">鐵鎖手套</span>（中間燭台，隱藏）。</li></ul><h3>地牢</h3><ul><li>寶箱：50 銀幣、<span class=\"jump items\" data-view=\"items\" data-detail=\"皮手套@872\" title=\"在物品大全中打開\">皮手套</span>。</li><li>隱藏：<span class=\"jump items\" data-view=\"items\" data-detail=\"無酵餅@624\" title=\"在物品大全中打開\">無酵餅</span>（桌上）。</li></ul>"}, {"chapter": "歐洲", "title": "修道院", "text": "修道院\n# 流程\n威尼斯左上方。從大廳右側門下地道 → 和左側牢房的女犯人蓓姬說話 → 回去調查右上的石獅，答「VI VI VI」（666）放出囚犯，潔西卡給密道鑰匙 → 打敗修道院院長，得航海圖、六芒星陣（學會煉妖） → 出門遇麥爾斯，妮可召喚姆斯比爾，眾人被打敗。\n# 院外\n- 地上：龍舌蘭（院子右側樹叢）。\n- 支線 典藏版：右邊樹林裡的小教士，答「猶大」，得回復劑×2。\n# 大廳\n- 左側地板是音階（左上到右下 7 8／5 6／3 4／1 2）。第一個寶箱按 5334221234555（小蜜蜂）得還魄丹；之後出現第二個寶箱，按 11556654433221（小星星前兩句）得空白符紙。\n# 地道\n- 左下的石獅是魔界商人，買過東西後送靈界指標×5。\n- 寶箱：50 銀幣×2、20 銀幣、藥草×4、解毒草、回復劑、諸方神石、結纍葡萄、鋼靴、魔法葉、還魄丹。\n- 密室：獵弓（開箱要打一場）。\n- 封印之光下面小路盡頭：羽翼劍、100 銀幣。\n- 封印之光：封印之劍（2）。\n- 地道上方打敗阿加希歐得虎皮衣。", "html": "<h3>流程</h3><p>威尼斯左上方。從大廳右側門下地道 → 和左側牢房的女犯人蓓姬說話 → 回去調查右上的石獅，答「VI VI VI」（666）放出囚犯，潔西卡給<span class=\"jump items\" data-view=\"items\" data-detail=\"密道鑰匙@764\" title=\"在物品大全中打開\">密道鑰匙</span> → 打敗<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"修道院院長@399\" title=\"在神魔異事錄中打開\">修道院院長</span>，得<span class=\"jump items\" data-view=\"items\" data-detail=\"航海圖@765\" title=\"在物品大全中打開\">航海圖</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"六芒星陣@770\" title=\"在物品大全中打開\">六芒星陣</span>（學會煉妖） → 出門遇麥爾斯，妮可召喚<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"姆斯比爾@6\" title=\"在神魔異事錄中打開\">姆斯比爾</span>，眾人被打敗。</p><h3>院外</h3><ul><li>地上：<span class=\"jump items\" data-view=\"items\" data-detail=\"龍舌蘭@718\" title=\"在物品大全中打開\">龍舌蘭</span>（院子右側樹叢）。</li><li>支線 <span class=\"tag edition\">典藏版</span>：右邊樹林裡的小教士，答「猶大」，得<span class=\"jump items\" data-view=\"items\" data-detail=\"回復劑@625\" title=\"在物品大全中打開\">回復劑</span>×2。</li></ul><h3>大廳</h3><ul><li>左側地板是音階（左上到右下 7 8／5 6／3 4／1 2）。第一個寶箱按 5334221234555（小蜜蜂）得<span class=\"jump items\" data-view=\"items\" data-detail=\"還魄丹@644\" title=\"在物品大全中打開\">還魄丹</span>；之後出現第二個寶箱，按 11556654433221（小星星前兩句）得<span class=\"jump items\" data-view=\"items\" data-detail=\"空白符紙@768\" title=\"在物品大全中打開\">空白符紙</span>。</li></ul><h3>地道</h3><ul><li>左下的石獅是魔界商人，買過東西後送<span class=\"jump items\" data-view=\"items\" data-detail=\"靈界指標@769\" title=\"在物品大全中打開\">靈界指標</span>×5。</li><li>寶箱：50 銀幣×2、20 銀幣、<span class=\"jump items\" data-view=\"items\" data-detail=\"藥草@621\" title=\"在物品大全中打開\">藥草</span>×4、<span class=\"jump items\" data-view=\"items\" data-detail=\"解毒草@647\" title=\"在物品大全中打開\">解毒草</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"回復劑@625\" title=\"在物品大全中打開\">回復劑</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"諸方神石@698\" title=\"在物品大全中打開\">諸方神石</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"結纍葡萄@622\" title=\"在物品大全中打開\">結纍葡萄</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"鋼靴@907\" title=\"在物品大全中打開\">鋼靴</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"魔法葉@636\" title=\"在物品大全中打開\">魔法葉</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"還魄丹@644\" title=\"在物品大全中打開\">還魄丹</span>。</li><li>密室：<span class=\"jump items\" data-view=\"items\" data-detail=\"獵弓@523\" title=\"在物品大全中打開\">獵弓</span>（開箱要打一場）。</li><li>封印之光下面小路盡頭：<span class=\"jump items\" data-view=\"items\" data-detail=\"羽翼劍@503\" title=\"在物品大全中打開\">羽翼劍</span>、100 銀幣。</li><li>封印之光：<span class=\"jump items\" data-view=\"items\" data-detail=\"封印之劍@793\" title=\"在物品大全中打開\">封印之劍</span>（2）。</li><li>地道上方打敗<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"阿加希歐@129\" title=\"在神魔異事錄中打開\">阿加希歐</span>得<span class=\"jump items\" data-view=\"items\" data-detail=\"虎皮衣@1005\" title=\"在物品大全中打開\">虎皮衣</span>。</li></ul>"}, {"chapter": "歐洲", "title": "潔西卡家地窖", "text": "潔西卡家地窖\n# 位置\n從修道院出來後，回威尼斯住宅區下邊潔西卡與貝絲的家，用密道鑰匙開門。\n# 物品\n- 寶箱：薩登荊環（攻擊最多加五成）、聖皇手套、靈界指標與空白符紙、回復劑、銀項鍊。\n# 這時順便\n- 威尼斯酒屋後面的一堆桶裡：聖皇靴（隱藏）資料片。", "html": "<h3>位置</h3><p>從修道院出來後，回威尼斯住宅區下邊潔西卡與貝絲的家，用<span class=\"jump items\" data-view=\"items\" data-detail=\"密道鑰匙@764\" title=\"在物品大全中打開\">密道鑰匙</span>開門。</p><h3>物品</h3><ul><li>寶箱：<span class=\"jump items\" data-view=\"items\" data-detail=\"薩登荊環@931\" title=\"在物品大全中打開\">薩登荊環</span>（攻擊最多加五成）、<span class=\"jump items\" data-view=\"items\" data-detail=\"聖皇手套@876\" title=\"在物品大全中打開\">聖皇手套</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"靈界指標@769\" title=\"在物品大全中打開\">靈界指標</span>與<span class=\"jump items\" data-view=\"items\" data-detail=\"空白符紙@768\" title=\"在物品大全中打開\">空白符紙</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"回復劑@625\" title=\"在物品大全中打開\">回復劑</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"銀項鍊@987\" title=\"在物品大全中打開\">銀項鍊</span>。</li></ul><h3>這時順便</h3><ul><li>威尼斯酒屋後面的一堆桶裡：<span class=\"jump items\" data-view=\"items\" data-detail=\"聖皇靴@908\" title=\"在物品大全中打開\">聖皇靴</span>（隱藏）<span class=\"tag edition\">資料片</span>。</li></ul>"}, {"chapter": "歐洲", "title": "青苔石迷宮", "text": "青苔石迷宮\n# 流程\n回海洞，得知兩個阿拉伯人去威尼斯西南的海盜秘密洞穴找食物和水 → 第二層找到他們 → 打敗弒肉妖，得硃砂神筆（煉符指令）。\n# 物品\n- 第一層寶箱：結纍葡萄、無酵餅、魔法葉、40 銀幣、地炎玉（抗火 60%）。\n- 第二層寶箱：藥草、還魄丹、魔法葉、諸方神石。", "html": "<h3>流程</h3><p>回海洞，得知兩個阿拉伯人去威尼斯西南的海盜秘密洞穴找食物和水 → 第二層找到他們 → 打敗<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"弒肉妖@396\" title=\"在神魔異事錄中打開\">弒肉妖</span>，得<span class=\"jump items\" data-view=\"items\" data-detail=\"硃砂神筆@933\" title=\"在物品大全中打開\">硃砂神筆</span>（煉符指令）。</p><h3>物品</h3><ul><li>第一層寶箱：<span class=\"jump items\" data-view=\"items\" data-detail=\"結纍葡萄@622\" title=\"在物品大全中打開\">結纍葡萄</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"無酵餅@624\" title=\"在物品大全中打開\">無酵餅</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"魔法葉@636\" title=\"在物品大全中打開\">魔法葉</span>、40 銀幣、<span class=\"jump items\" data-view=\"items\" data-detail=\"地炎玉@929\" title=\"在物品大全中打開\">地炎玉</span>（抗火 60%）。</li><li>第二層寶箱：<span class=\"jump items\" data-view=\"items\" data-detail=\"藥草@621\" title=\"在物品大全中打開\">藥草</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"還魄丹@644\" title=\"在物品大全中打開\">還魄丹</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"魔法葉@636\" title=\"在物品大全中打開\">魔法葉</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"諸方神石@698\" title=\"在物品大全中打開\">諸方神石</span>。</li></ul>"}, {"chapter": "歐洲", "title": "海戰", "text": "海戰\n# 流程\n出海後遇法蘭克人與威尼斯水軍交戰 → 先往西和護民官說話（幫不幫都行，不幫的話船上的敵人會多一種），之後和他說話可補滿體力 → 往東最左邊的船上遇康那里士，召喚出一座島，法蘭克人逃上島。\n# 物品\n- 寶箱：回復劑。", "html": "<h3>流程</h3><p>出海後遇法蘭克人與威尼斯水軍交戰 → 先往西和護民官說話（幫不幫都行，不幫的話船上的敵人會多一種），之後和他說話可補滿體力 → 往東最左邊的船上遇<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"康那里士@7\" title=\"在神魔異事錄中打開\">康那里士</span>，召喚出一座島，法蘭克人逃上島。</p><h3>物品</h3><ul><li>寶箱：<span class=\"jump items\" data-view=\"items\" data-detail=\"回復劑@625\" title=\"在物品大全中打開\">回復劑</span>。</li></ul>"}, {"chapter": "移動島", "title": "擱淺船與東北密洞", "text": "擱淺船與東北密洞\n# 擱淺船（島右邊）\n- 寶箱：鐵戒指。\n- 隱藏：武聖手鐲（隱藏船艙裡樓梯對面的罈子，連擊指令）、蛇鱗衣（櫃子）。\n# 東北密洞\n要在石像轟擊冰山之前去，之後洞口會被封住。\n- 寶箱：諸方神石、300 銀幣、銀笛。\n- 最裡面的寶箱：身上帶著靈契收服的妖貓和牛頭魚（洞裡就有），可換得阿高司（目前最好的護駕）。", "html": "<h3>擱淺船（島右邊）</h3><ul><li>寶箱：<span class=\"jump items\" data-view=\"items\" data-detail=\"鐵戒指@972\" title=\"在物品大全中打開\">鐵戒指</span>。</li><li>隱藏：<span class=\"jump items\" data-view=\"items\" data-detail=\"武聖手鐲@932\" title=\"在物品大全中打開\">武聖手鐲</span>（隱藏船艙裡樓梯對面的罈子，連擊指令）、<span class=\"jump items\" data-view=\"items\" data-detail=\"蛇鱗衣@1006\" title=\"在物品大全中打開\">蛇鱗衣</span>（櫃子）。</li></ul><h3>東北密洞</h3><p>要在石像轟擊冰山之前去，之後洞口會被封住。</p><ul><li>寶箱：<span class=\"jump items\" data-view=\"items\" data-detail=\"諸方神石@698\" title=\"在物品大全中打開\">諸方神石</span>、300 銀幣、<span class=\"jump items\" data-view=\"items\" data-detail=\"銀笛@983\" title=\"在物品大全中打開\">銀笛</span>。</li><li>最裡面的寶箱：身上帶著靈契收服的<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"妖貓@140\" title=\"在神魔異事錄中打開\">妖貓</span>和<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"牛頭魚@141\" title=\"在神魔異事錄中打開\">牛頭魚</span>（洞裡就有），可換得<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"阿高司@174\" title=\"在神魔異事錄中打開\">阿高司</span>（目前最好的護駕）。</li></ul>"}, {"chapter": "移動島", "title": "移動島城堡", "text": "移動島城堡\n# 流程\n進城堡（大廳有旅館和商店） → 二樓、三樓、四樓扳機關開橋 → 頂樓打敗康那里士，得吸血鬼指環 → 撿起地上的羽翼劍 → 向門外護民官報告，島開始移動 → 庭院的石像出兩個考驗：到瞭望台中間的門裡打敗高地骷髏妖得冥海神石；再回到過去打敗姆斯比爾。\n# 物品\n- 大廳：封印之劍（3）。\n- 城堡外圍寶箱：魔貝粉。\n- 二樓：安碧特麗之冠、結纍葡萄、藥草×4、延胡索之花、封印之劍（4）。\n- 三樓寶箱：溶石藥劑、魔晶粉×2、還魄丹×2、魔貝粉、300 銀幣、回復劑。\n- 三樓左上：三個寶箱只能開一個，內容隨機，是烏紋弓、聖石榴，或打一場邪靈。\n- 四樓（浮島機關）：聖皇之鎧、諸方神石、300 銀幣（右數第二列最上面的開關是拿它的關鍵）、封印之劍（5）。\n- 頂樓地上：羽翼劍。\n# 提示\n- 和格萊艾的戰鬥中，可以用諸方神石換回復藥。\n- 大廳的阿丹借你水晶鏡；多和他說幾次話，得知水晶鏡的另一個用法，再去瞭望台可看到一段動畫。", "html": "<h3>流程</h3><p>進城堡（大廳有旅館和商店） → 二樓、三樓、四樓扳機關開橋 → 頂樓打敗<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"康那里士@7\" title=\"在神魔異事錄中打開\">康那里士</span>，得<span class=\"jump items\" data-view=\"items\" data-detail=\"吸血鬼指環@934\" title=\"在物品大全中打開\">吸血鬼指環</span> → 撿起地上的<span class=\"jump items\" data-view=\"items\" data-detail=\"羽翼劍@503\" title=\"在物品大全中打開\">羽翼劍</span> → 向門外護民官報告，島開始移動 → 庭院的石像出兩個考驗：到瞭望台中間的門裡打敗<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"高地骷髏妖@395\" title=\"在神魔異事錄中打開\">高地骷髏妖</span>得<span class=\"jump items\" data-view=\"items\" data-detail=\"冥海神石@787\" title=\"在物品大全中打開\">冥海神石</span>；再回到過去打敗<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"姆斯比爾@6\" title=\"在神魔異事錄中打開\">姆斯比爾</span>。</p><h3>物品</h3><ul><li>大廳：<span class=\"jump items\" data-view=\"items\" data-detail=\"封印之劍@793\" title=\"在物品大全中打開\">封印之劍</span>（3）。</li><li>城堡外圍寶箱：<span class=\"jump items\" data-view=\"items\" data-detail=\"魔貝粉@627\" title=\"在物品大全中打開\">魔貝粉</span>。</li><li>二樓：<span class=\"jump items\" data-view=\"items\" data-detail=\"安碧特麗之冠@1022\" title=\"在物品大全中打開\">安碧特麗之冠</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"結纍葡萄@622\" title=\"在物品大全中打開\">結纍葡萄</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"藥草@621\" title=\"在物品大全中打開\">藥草</span>×4、<span class=\"jump items\" data-view=\"items\" data-detail=\"延胡索之花@726\" title=\"在物品大全中打開\">延胡索之花</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"封印之劍@793\" title=\"在物品大全中打開\">封印之劍</span>（4）。</li><li>三樓寶箱：<span class=\"jump items\" data-view=\"items\" data-detail=\"溶石藥劑@651\" title=\"在物品大全中打開\">溶石藥劑</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"魔晶粉@637\" title=\"在物品大全中打開\">魔晶粉</span>×2、<span class=\"jump items\" data-view=\"items\" data-detail=\"還魄丹@644\" title=\"在物品大全中打開\">還魄丹</span>×2、<span class=\"jump items\" data-view=\"items\" data-detail=\"魔貝粉@627\" title=\"在物品大全中打開\">魔貝粉</span>、300 銀幣、<span class=\"jump items\" data-view=\"items\" data-detail=\"回復劑@625\" title=\"在物品大全中打開\">回復劑</span>。</li><li>三樓左上：三個寶箱只能開一個，內容隨機，是<span class=\"jump items\" data-view=\"items\" data-detail=\"烏紋弓@528\" title=\"在物品大全中打開\">烏紋弓</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"聖石榴@623\" title=\"在物品大全中打開\">聖石榴</span>，或打一場邪靈。</li><li>四樓（浮島機關）：<span class=\"jump items\" data-view=\"items\" data-detail=\"聖皇之鎧@853\" title=\"在物品大全中打開\">聖皇之鎧</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"諸方神石@698\" title=\"在物品大全中打開\">諸方神石</span>、300 銀幣（右數第二列最上面的開關是拿它的關鍵）、<span class=\"jump items\" data-view=\"items\" data-detail=\"封印之劍@793\" title=\"在物品大全中打開\">封印之劍</span>（5）。</li><li>頂樓地上：<span class=\"jump items\" data-view=\"items\" data-detail=\"羽翼劍@503\" title=\"在物品大全中打開\">羽翼劍</span>。</li></ul><h3>提示</h3><ul><li>和<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"格萊艾@136\" title=\"在神魔異事錄中打開\">格萊艾</span>的戰鬥中，可以用<span class=\"jump items\" data-view=\"items\" data-detail=\"諸方神石@698\" title=\"在物品大全中打開\">諸方神石</span>換回復藥。</li><li>大廳的阿丹借你<span class=\"jump items\" data-view=\"items\" data-detail=\"水晶鏡@788\" title=\"在物品大全中打開\">水晶鏡</span>；多和他說幾次話，得知水晶鏡的另一個用法，再去瞭望台可看到一段動畫。</li></ul>"}, {"chapter": "移動島", "title": "冰山島", "text": "冰山島\n# 流程\n海上冰山撞上移動島，藍人凍住眾人 → 跟去冰山島 → 洞裡找到波希頓石像帶回庭院，石像讓火山爆發炸開冰山 → 從炸開的門進去打敗藍魔神，救出眾人和女船長薇達 → 石像又轟了一塊熔岩，5 分鐘內（含戰鬥）逃出冰山 → 庭院打敗冰魔薇達、藍魔神本體 → 搭薇達的船到貝魯特。\n# 洞穴\n- 寶箱：空白符紙、靈界指標、回復劑×2、藥草×10、諸方神石。\n- 寶箱：神奇麵包（要先投入 10 個藥草）。\n- 隱藏：水靈珠（進洞後往右的場景上方冰柱，抗冰 60%）。\n- 注意：途中有瓶女假扮的莉蓮，選「救」賽特會陷入瀕死，選「不救」則和瓶女戰鬥。\n# 炸開之後\n- 寶箱：魔貝粉、還魄丹、妖精麥粉（要 300 銀幣）。\n- 地上：紫藤葉。", "html": "<h3>流程</h3><p>海上冰山撞上移動島，藍人凍住眾人 → 跟去冰山島 → 洞裡找到<span class=\"jump items\" data-view=\"items\" data-detail=\"波希頓石像@791\" title=\"在物品大全中打開\">波希頓石像</span>帶回庭院，石像讓火山爆發炸開冰山 → 從炸開的門進去打敗<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"藍魔神@13\" title=\"在神魔異事錄中打開\">藍魔神</span>，救出眾人和女船長薇達 → 石像又轟了一塊熔岩，5 分鐘內（含戰鬥）逃出冰山 → 庭院打敗<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"冰魔薇達@60\" title=\"在神魔異事錄中打開\">冰魔薇達</span>、<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"藍魔神@13\" title=\"在神魔異事錄中打開\">藍魔神</span>本體 → 搭薇達的船到貝魯特。</p><h3>洞穴</h3><ul><li>寶箱：<span class=\"jump items\" data-view=\"items\" data-detail=\"空白符紙@768\" title=\"在物品大全中打開\">空白符紙</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"靈界指標@769\" title=\"在物品大全中打開\">靈界指標</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"回復劑@625\" title=\"在物品大全中打開\">回復劑</span>×2、<span class=\"jump items\" data-view=\"items\" data-detail=\"藥草@621\" title=\"在物品大全中打開\">藥草</span>×10、<span class=\"jump items\" data-view=\"items\" data-detail=\"諸方神石@698\" title=\"在物品大全中打開\">諸方神石</span>。</li><li>寶箱：<span class=\"jump items\" data-view=\"items\" data-detail=\"神奇麵包@672\" title=\"在物品大全中打開\">神奇麵包</span>（要先投入 10 個<span class=\"jump items\" data-view=\"items\" data-detail=\"藥草@621\" title=\"在物品大全中打開\">藥草</span>）。</li><li>隱藏：<span class=\"jump items\" data-view=\"items\" data-detail=\"水靈珠@936\" title=\"在物品大全中打開\">水靈珠</span>（進洞後往右的場景上方冰柱，抗冰 60%）。</li><li>注意：途中有瓶女假扮的莉蓮，選「救」賽特會陷入瀕死，選「不救」則和<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"瓶女@139\" title=\"在神魔異事錄中打開\">瓶女</span>戰鬥。</li></ul><h3>炸開之後</h3><ul><li>寶箱：<span class=\"jump items\" data-view=\"items\" data-detail=\"魔貝粉@627\" title=\"在物品大全中打開\">魔貝粉</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"還魄丹@644\" title=\"在物品大全中打開\">還魄丹</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"妖精麥粉@674\" title=\"在物品大全中打開\">妖精麥粉</span>（要 300 銀幣）。</li><li>地上：<span class=\"jump items\" data-view=\"items\" data-detail=\"紫藤葉@725\" title=\"在物品大全中打開\">紫藤葉</span>。</li></ul>"}, {"chapter": "阿拉伯", "title": "貝魯特", "text": "貝魯特\n# 物品\n- 穆南比家左上的罈子：魔法葉（隱藏）。\n# 支線\n- 典藏版 小商店的商人艾德，答「兩天兩小時」，得玉戒指（宗楚客要的玉器）。", "html": "<h3>物品</h3><ul><li>穆南比家左上的罈子：<span class=\"jump items\" data-view=\"items\" data-detail=\"魔法葉@636\" title=\"在物品大全中打開\">魔法葉</span>（隱藏）。</li></ul><h3>支線</h3><ul><li><span class=\"tag edition\">典藏版</span> 小商店的商人艾德，答「兩天兩小時」，得<span class=\"jump items\" data-view=\"items\" data-detail=\"玉戒指@975\" title=\"在物品大全中打開\">玉戒指</span>（宗楚客要的玉器）。</li></ul>"}, {"chapter": "阿拉伯", "title": "大馬士革", "text": "大馬士革\n# 流程\n在占卜屋和洛克仙妮說話，得知肯迪大師住城外 → 穿過敘利亞森林去肯迪之家。建議先做完城裡的支線，再去森林。\n# 支線\n- 中國劍 薩爾達：和街上走動的胖商人安薩里拉齊說話兩次，花 1500 銀幣買中國劍。\n- 奧斯曼的靈魂 薩爾達：在奧斯曼家不斷和葉塔說話，直到奧斯曼進來，妮可把他的靈魂收進煉妖壺。進壺之前趁他昏迷可從他身上拿到魔法精羽；進壺打敗奧斯曼帶他回來。\n- 辜露公主 薩爾達：在清真寺前和辜露說話後，她被帶去拍賣。先去敘利亞森林給祖旺回復劑，得魔晶礦Ａ；再到拍賣場，祖旺買下辜露，之後和祖旺說話得神駝靴。不要讓列拉買下她（要用封印之劍換）。\n- 分珍珠 DOMO：珠寶商家三個女人分珍珠，答「9、6、2」，得薰衣草、山蛇莓。\n- 阿里看家 薩爾達：答應幫阿里看家，不碰寶箱也不要中途離開。阿里回來後任選一個寶箱，從左到右是聖皇盔、不老之泉水、精華藥水、神奇麵包、輪迴盤。做薩爾達和聖皇裝備要選聖皇盔。\n- 紅酒：對武器店老闆選「喝點小酒」，進裡面房間的地下室，向老闆娘買紅酒（250 銀幣）。", "html": "<h3>流程</h3><p>在占卜屋和洛克仙妮說話，得知肯迪大師住城外 → 穿過敘利亞森林去肯迪之家。建議先做完城裡的支線，再去森林。</p><h3>支線</h3><ul><li>中國劍 <span class=\"tag sarda\">薩爾達</span>：和街上走動的胖商人安薩里拉齊說話兩次，花 1500 銀幣買<span class=\"jump items\" data-view=\"items\" data-detail=\"中國劍@578\" title=\"在物品大全中打開\">中國劍</span>。</li><li>奧斯曼的靈魂 <span class=\"tag sarda\">薩爾達</span>：在奧斯曼家不斷和葉塔說話，直到奧斯曼進來，妮可把他的靈魂收進煉妖壺。進壺之前趁他昏迷可從他身上拿到<span class=\"jump items\" data-view=\"items\" data-detail=\"魔法精羽@678\" title=\"在物品大全中打開\">魔法精羽</span>；進壺打敗奧斯曼帶他回來。</li><li>辜露公主 <span class=\"tag sarda\">薩爾達</span>：在清真寺前和辜露說話後，她被帶去拍賣。先去敘利亞森林給祖旺<span class=\"jump items\" data-view=\"items\" data-detail=\"回復劑@625\" title=\"在物品大全中打開\">回復劑</span>，得<span class=\"jump items\" data-view=\"items\" data-detail=\"魔晶礦Ａ@772\" title=\"在物品大全中打開\">魔晶礦Ａ</span>；再到拍賣場，祖旺買下辜露，之後和祖旺說話得<span class=\"jump items\" data-view=\"items\" data-detail=\"神駝靴@912\" title=\"在物品大全中打開\">神駝靴</span>。不要讓列拉買下她（要用封印之劍換）。</li><li>分珍珠 <span class=\"tag domo\">DOMO</span>：珠寶商家三個女人分珍珠，答「9、6、2」，得<span class=\"jump items\" data-view=\"items\" data-detail=\"薰衣草@826\" title=\"在物品大全中打開\">薰衣草</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"山蛇莓@722\" title=\"在物品大全中打開\">山蛇莓</span>。</li><li>阿里看家 <span class=\"tag sarda\">薩爾達</span>：答應幫阿里看家，不碰寶箱也不要中途離開。阿里回來後任選一個寶箱，從左到右是<span class=\"jump items\" data-view=\"items\" data-detail=\"聖皇盔@896\" title=\"在物品大全中打開\">聖皇盔</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"不老之泉水@681\" title=\"在物品大全中打開\">不老之泉水</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"精華藥水@629\" title=\"在物品大全中打開\">精華藥水</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"神奇麵包@672\" title=\"在物品大全中打開\">神奇麵包</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"輪迴盤@645\" title=\"在物品大全中打開\">輪迴盤</span>。做薩爾達和聖皇裝備要選聖皇盔。</li><li>紅酒：對武器店老闆選「喝點小酒」，進裡面房間的地下室，向老闆娘買<span class=\"jump items\" data-view=\"items\" data-detail=\"紅酒@794\" title=\"在物品大全中打開\">紅酒</span>（250 銀幣）。</li></ul>"}, {"chapter": "阿拉伯", "title": "敘利亞森林與肯迪之家", "text": "敘利亞森林與肯迪之家\n# 敘利亞森林\n- 寶箱：魔貝粉、空白符紙（下方比較隱蔽的寶箱）、魔法葉。\n- 祖旺：給回復劑得魔晶礦Ａ（見大馬士革）。\n# 肯迪之家\n- 隱藏：海檬果（院子左邊草叢）。\n- 流程：大師已過世，留下來向小肯迪學習 → 執政官麥爾丹搶走記載魔鬼封印之地的地圖，賽特和小肯迪追往塔德莫爾。", "html": "<h3>敘利亞森林</h3><ul><li>寶箱：<span class=\"jump items\" data-view=\"items\" data-detail=\"魔貝粉@627\" title=\"在物品大全中打開\">魔貝粉</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"空白符紙@768\" title=\"在物品大全中打開\">空白符紙</span>（下方比較隱蔽的寶箱）、<span class=\"jump items\" data-view=\"items\" data-detail=\"魔法葉@636\" title=\"在物品大全中打開\">魔法葉</span>。</li><li>祖旺：給<span class=\"jump items\" data-view=\"items\" data-detail=\"回復劑@625\" title=\"在物品大全中打開\">回復劑</span>得<span class=\"jump items\" data-view=\"items\" data-detail=\"魔晶礦Ａ@772\" title=\"在物品大全中打開\">魔晶礦Ａ</span>（見大馬士革）。</li></ul><h3>肯迪之家</h3><ul><li>隱藏：<span class=\"jump items\" data-view=\"items\" data-detail=\"海檬果@721\" title=\"在物品大全中打開\">海檬果</span>（院子左邊草叢）。</li><li>流程：大師已過世，留下來向小肯迪學習 → 執政官麥爾丹搶走記載魔鬼封印之地的地圖，賽特和小肯迪追往塔德莫爾。</li></ul>"}, {"chapter": "阿拉伯", "title": "塔德莫爾", "text": "塔德莫爾\n# 流程\n騎駱駝往東南 → 用計讓守衛自相殘殺 → 進古墓扳右下機關，遇麥爾丹 → 按牆上黃磚開秘門 → 十二宮機關：由右向左每三宮一組，分別打開水、火、地、風四門，按門內黃磚 → 天之門打開 → 東邊門裡按三塊黃磚，打開下邊門路上的地板 → 推石棺見到卡瑪與安卡 → 出口打敗鬼猴，卡瑪加入。\n# 物品\n- 古墓入口右後方角落：魔晶粉（隱藏）。\n- 入口通道：神祕果（隱藏）。\n- 水之門：精華藥水、定心丸。火之門：山蛇莓。地之門：諸方神石。風之門：飛去來器。\n- 東邊門：魔貝粉、神偷面具（偷竊指令）、翠玉金釵（宗楚客要的玉器）。\n- 下邊門密室：鷹矢盔。\n- 左邊門：魔貝粉、400 銀幣；魔貝粉寶箱左側（西南牆）的隱藏通道盡頭有蜂王露。\n- 墓室出口：封印之劍（6）；這一幕左上的隱藏通道裡有不老之泉水；路上還有還魄丹。\n# 偷竊與靈契\n- 亞坦可偷飛翔魔油（敏捷 +5）。等級高了它會逃，可以卡瑪加入後再回來邊練邊偷。\n- 神燈巨人可偷瑰麗之梨；收服兩隻，可煉出玉戒指。\n- 蝠妖可偷瑪瑙戒指，朱蛤獸可偷角笛。", "html": "<h3>流程</h3><p>騎駱駝往東南 → 用計讓守衛自相殘殺 → 進古墓扳右下機關，遇麥爾丹 → 按牆上黃磚開秘門 → 十二宮機關：由右向左每三宮一組，分別打開水、火、地、風四門，按門內黃磚 → 天之門打開 → 東邊門裡按三塊黃磚，打開下邊門路上的地板 → 推石棺見到卡瑪與安卡 → 出口打敗<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"鬼猴@18\" title=\"在神魔異事錄中打開\">鬼猴</span>，卡瑪加入。</p><h3>物品</h3><ul><li>古墓入口右後方角落：<span class=\"jump items\" data-view=\"items\" data-detail=\"魔晶粉@637\" title=\"在物品大全中打開\">魔晶粉</span>（隱藏）。</li><li>入口通道：<span class=\"jump items\" data-view=\"items\" data-detail=\"神祕果@729\" title=\"在物品大全中打開\">神祕果</span>（隱藏）。</li><li>水之門：<span class=\"jump items\" data-view=\"items\" data-detail=\"精華藥水@629\" title=\"在物品大全中打開\">精華藥水</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"定心丸@655\" title=\"在物品大全中打開\">定心丸</span>。火之門：<span class=\"jump items\" data-view=\"items\" data-detail=\"山蛇莓@722\" title=\"在物品大全中打開\">山蛇莓</span>。地之門：<span class=\"jump items\" data-view=\"items\" data-detail=\"諸方神石@698\" title=\"在物品大全中打開\">諸方神石</span>。風之門：<span class=\"jump items\" data-view=\"items\" data-detail=\"飛去來器@565\" title=\"在物品大全中打開\">飛去來器</span>。</li><li>東邊門：<span class=\"jump items\" data-view=\"items\" data-detail=\"魔貝粉@627\" title=\"在物品大全中打開\">魔貝粉</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"神偷面具@937\" title=\"在物品大全中打開\">神偷面具</span>（偷竊指令）、<span class=\"jump items\" data-view=\"items\" data-detail=\"翠玉金釵@1023\" title=\"在物品大全中打開\">翠玉金釵</span>（宗楚客要的玉器）。</li><li>下邊門密室：<span class=\"jump items\" data-view=\"items\" data-detail=\"鷹矢盔@894\" title=\"在物品大全中打開\">鷹矢盔</span>。</li><li>左邊門：<span class=\"jump items\" data-view=\"items\" data-detail=\"魔貝粉@627\" title=\"在物品大全中打開\">魔貝粉</span>、400 銀幣；魔貝粉寶箱左側（西南牆）的隱藏通道盡頭有<span class=\"jump items\" data-view=\"items\" data-detail=\"蜂王露@688\" title=\"在物品大全中打開\">蜂王露</span>。</li><li>墓室出口：<span class=\"jump items\" data-view=\"items\" data-detail=\"封印之劍@793\" title=\"在物品大全中打開\">封印之劍</span>（6）；這一幕左上的隱藏通道裡有<span class=\"jump items\" data-view=\"items\" data-detail=\"不老之泉水@681\" title=\"在物品大全中打開\">不老之泉水</span>；路上還有<span class=\"jump items\" data-view=\"items\" data-detail=\"還魄丹@644\" title=\"在物品大全中打開\">還魄丹</span>。</li></ul><h3>偷竊與靈契</h3><ul><li><span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"亞坦@161\" title=\"在神魔異事錄中打開\">亞坦</span>可偷<span class=\"jump items\" data-view=\"items\" data-detail=\"飛翔魔油@679\" title=\"在物品大全中打開\">飛翔魔油</span>（敏捷 +5）。等級高了它會逃，可以卡瑪加入後再回來邊練邊偷。</li><li><span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"神燈巨人@164\" title=\"在神魔異事錄中打開\">神燈巨人</span>可偷<span class=\"jump items\" data-view=\"items\" data-detail=\"瑰麗之梨@677\" title=\"在物品大全中打開\">瑰麗之梨</span>；收服兩隻，可煉出<span class=\"jump items\" data-view=\"items\" data-detail=\"玉戒指@975\" title=\"在物品大全中打開\">玉戒指</span>。</li><li><span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"蝠妖@162\" title=\"在神魔異事錄中打開\">蝠妖</span>可偷<span class=\"jump items\" data-view=\"items\" data-detail=\"瑪瑙戒指@978\" title=\"在物品大全中打開\">瑪瑙戒指</span>，<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"朱蛤獸@163\" title=\"在神魔異事錄中打開\">朱蛤獸</span>可偷<span class=\"jump items\" data-view=\"items\" data-detail=\"角笛@984\" title=\"在物品大全中打開\">角笛</span>。</li></ul>"}, {"chapter": "阿拉伯", "title": "血腥地獄", "text": "血腥地獄\n# 流程\n回程發現沙漠中央有血光 → 和莫雷說話，從魔法陣進地獄 → 遇康那里士（恐懼之王），被關進牢房 → 和安卡說話後回到過去見莉蓮 → 薇達救出眾人 → 打敗康那里士、恐懼之王 → 傳送到大馬士革清真寺。\n# 物品\n- 地獄廣場：血殷長袍（六角星左側的骷髏堆，隱藏）。\n- 進入火堆後的門，一直往前的牙叢：惡魔風笛（隱藏）。\n- 寶箱：300 銀幣、魔晶粉、魔貝粉×2、菟絲魔子、象牙耳環。\n- 有一個陷阱寶箱，賽特損血 100。\n- 出獄後寶箱：流雲針、魔力水、200 銀幣、還魄丹。\n- 地府商店街：封印之劍（7）；可買閰氣靴備用。", "html": "<h3>流程</h3><p>回程發現沙漠中央有血光 → 和莫雷說話，從魔法陣進地獄 → 遇<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"康那里士@7\" title=\"在神魔異事錄中打開\">康那里士</span>（恐懼之王），被關進牢房 → 和安卡說話後回到過去見莉蓮 → 薇達救出眾人 → 打敗康那里士、<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"恐懼之王@12\" title=\"在神魔異事錄中打開\">恐懼之王</span> → 傳送到大馬士革清真寺。</p><h3>物品</h3><ul><li>地獄廣場：<span class=\"jump items\" data-view=\"items\" data-detail=\"血殷長袍@1016\" title=\"在物品大全中打開\">血殷長袍</span>（六角星左側的骷髏堆，隱藏）。</li><li>進入火堆後的門，一直往前的牙叢：<span class=\"jump items\" data-view=\"items\" data-detail=\"惡魔風笛@986\" title=\"在物品大全中打開\">惡魔風笛</span>（隱藏）。</li><li>寶箱：300 銀幣、<span class=\"jump items\" data-view=\"items\" data-detail=\"魔晶粉@637\" title=\"在物品大全中打開\">魔晶粉</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"魔貝粉@627\" title=\"在物品大全中打開\">魔貝粉</span>×2、<span class=\"jump items\" data-view=\"items\" data-detail=\"菟絲魔子@728\" title=\"在物品大全中打開\">菟絲魔子</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"象牙耳環@1000\" title=\"在物品大全中打開\">象牙耳環</span>。</li><li>有一個陷阱寶箱，賽特損血 100。</li><li>出獄後寶箱：<span class=\"jump items\" data-view=\"items\" data-detail=\"流雲針@566\" title=\"在物品大全中打開\">流雲針</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"魔力水@638\" title=\"在物品大全中打開\">魔力水</span>、200 銀幣、<span class=\"jump items\" data-view=\"items\" data-detail=\"還魄丹@644\" title=\"在物品大全中打開\">還魄丹</span>。</li><li>地府商店街：<span class=\"jump items\" data-view=\"items\" data-detail=\"封印之劍@793\" title=\"在物品大全中打開\">封印之劍</span>（7）；可買<span class=\"jump items\" data-view=\"items\" data-detail=\"閰氣靴@1041\" title=\"在物品大全中打開\">閰氣靴</span>備用。</li></ul>"}, {"chapter": "阿拉伯", "title": "大馬士革皇宮", "text": "大馬士革皇宮\n# 流程\n清真寺遍地屍體 → 進王宮遇唐國僧人慧彥（打不還手） → 打敗影忍妖機 → 大殿打敗機關三魔獸，黃雷逃走 → 追進皇宮通道 → 盡頭打敗黃雷後，向慧彥學武術與中文，學會御劍燎原 → 和薇達比武後，沿絲路往巴格達。\n# 物品\n- 寶箱：魔貝粉、回復劑×3、魔晶礦Ｂ、300 銀幣、流雲針、魔力水、魔晶粉、500 銀幣。\n- 雨雲之腕：魔晶礦Ｂ所在處右面的牆（被牆擋住的寶箱）。\n- 吸魔壺：500 銀幣寶箱過道右上角附近（被牆擋住的寶箱）。\n- 封印之光：封印之劍（8）。\n# 注意\n在通道盡頭找到黃雷、跟慧彥學武術之前，賽特最好已練成「蛟龍翻身」，否則學不到最強絕技「天狼巽閃」，只能練到「霸王崩山勁」。", "html": "<h3>流程</h3><p>清真寺遍地屍體 → 進王宮遇唐國僧人慧彥（打不還手） → 打敗<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"影忍妖機@50\" title=\"在神魔異事錄中打開\">影忍妖機</span> → 大殿打敗<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"機關三魔獸@48\" title=\"在神魔異事錄中打開\">機關三魔獸</span>，黃雷逃走 → 追進皇宮通道 → 盡頭打敗黃雷後，向慧彥學武術與中文，學會御劍燎原 → 和薇達比武後，沿絲路往巴格達。</p><h3>物品</h3><ul><li>寶箱：<span class=\"jump items\" data-view=\"items\" data-detail=\"魔貝粉@627\" title=\"在物品大全中打開\">魔貝粉</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"回復劑@625\" title=\"在物品大全中打開\">回復劑</span>×3、<span class=\"jump items\" data-view=\"items\" data-detail=\"魔晶礦Ｂ@773\" title=\"在物品大全中打開\">魔晶礦Ｂ</span>、300 銀幣、<span class=\"jump items\" data-view=\"items\" data-detail=\"流雲針@566\" title=\"在物品大全中打開\">流雲針</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"魔力水@638\" title=\"在物品大全中打開\">魔力水</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"魔晶粉@637\" title=\"在物品大全中打開\">魔晶粉</span>、500 銀幣。</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"雨雲之腕@1045\" title=\"在物品大全中打開\">雨雲之腕</span>：魔晶礦Ｂ所在處右面的牆（被牆擋住的寶箱）。</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"吸魔壺@954\" title=\"在物品大全中打開\">吸魔壺</span>：500 銀幣寶箱過道右上角附近（被牆擋住的寶箱）。</li><li>封印之光：<span class=\"jump items\" data-view=\"items\" data-detail=\"封印之劍@793\" title=\"在物品大全中打開\">封印之劍</span>（8）。</li></ul><h3>注意</h3><p>在通道盡頭找到黃雷、跟慧彥學武術之前，賽特最好已練成「蛟龍翻身」，否則學不到最強絕技「天狼巽閃」，只能練到「霸王崩山勁」。</p>"}, {"chapter": "阿拉伯", "title": "巴格達", "text": "巴格達\n# 流程\n和城北商店內的陳瑞蓮說話 → 和軍營帳外的士兵說話兩次，之後 5 分鐘內不能存檔，可以先做支線、去東北山洞 → 衛兵要求去東北山洞拿暗黑修羅砧證明是勇士 → 回來打贏四名黑衣大食兵 → 見到石國王子遠恩和麥爾斯，賽特受傷，慧彥挾持遠恩逃到沙漠綠洲。\n# 物品\n- 隱藏：彎刀（入口上方樹叢，小孩藏的）、月牙劍（右數第三個帳篷的兵器架）、彎刀（左數第二個帳篷）。\n# 支線\n- 坦普拉琴 DOMO：雜貨商買坦普拉琴（500 銀幣）。\n- 隴金玉劍：武器商買一把隴金玉劍，宗楚客要的玉器。\n- 士兵的彎刀 薩爾達：武器商左邊第一個帳篷的士兵艾革利丟了彎刀，給你 200 銀幣托你買。把撿到的彎刀交給他，再得 100 銀幣。接下任務就算達成條件。\n- 安薩里拉齊：出 3000 銀幣要買回中國劍。做薩爾達或想開封魚腸就選「否」。\n- 旅店：和老闆娘說話後，住宿從 200 銀幣降到 150。\n- 老學究古伊 典藏版：左數第四個帳篷，答「恆河」，得鷹爪靴。", "html": "<h3>流程</h3><p>和城北商店內的陳瑞蓮說話 → 和軍營帳外的士兵說話兩次，之後 5 分鐘內不能存檔，可以先做支線、去東北山洞 → 衛兵要求去東北山洞拿<span class=\"jump items\" data-view=\"items\" data-detail=\"暗黑修羅砧@717\" title=\"在物品大全中打開\">暗黑修羅砧</span>證明是勇士 → 回來打贏四名<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"黑衣大食兵@411\" title=\"在神魔異事錄中打開\">黑衣大食兵</span> → 見到石國王子遠恩和麥爾斯，賽特受傷，慧彥挾持遠恩逃到沙漠綠洲。</p><h3>物品</h3><ul><li>隱藏：<span class=\"jump items\" data-view=\"items\" data-detail=\"彎刀@537\" title=\"在物品大全中打開\">彎刀</span>（入口上方樹叢，小孩藏的）、<span class=\"jump items\" data-view=\"items\" data-detail=\"月牙劍@508\" title=\"在物品大全中打開\">月牙劍</span>（右數第三個帳篷的兵器架）、<span class=\"jump items\" data-view=\"items\" data-detail=\"彎刀@537\" title=\"在物品大全中打開\">彎刀</span>（左數第二個帳篷）。</li></ul><h3>支線</h3><ul><li>坦普拉琴 <span class=\"tag domo\">DOMO</span>：雜貨商買<span class=\"jump items\" data-view=\"items\" data-detail=\"坦普拉琴@830\" title=\"在物品大全中打開\">坦普拉琴</span>（500 銀幣）。</li><li>隴金玉劍：武器商買一把<span class=\"jump items\" data-view=\"items\" data-detail=\"隴金玉劍@507\" title=\"在物品大全中打開\">隴金玉劍</span>，宗楚客要的玉器。</li><li>士兵的彎刀 <span class=\"tag sarda\">薩爾達</span>：武器商左邊第一個帳篷的士兵艾革利丟了彎刀，給你 200 銀幣托你買。把撿到的<span class=\"jump items\" data-view=\"items\" data-detail=\"彎刀@537\" title=\"在物品大全中打開\">彎刀</span>交給他，再得 100 銀幣。接下任務就算達成條件。</li><li>安薩里拉齊：出 3000 銀幣要買回中國劍。做薩爾達或想開封魚腸就選「否」。</li><li>旅店：和老闆娘說話後，住宿從 200 銀幣降到 150。</li><li>老學究古伊 <span class=\"tag edition\">典藏版</span>：左數第四個帳篷，答「恆河」，得<span class=\"jump items\" data-view=\"items\" data-detail=\"鷹爪靴@1034\" title=\"在物品大全中打開\">鷹爪靴</span>。</li></ul>"}, {"chapter": "阿拉伯", "title": "美索不達米亞山區", "text": "美索不達米亞山區\n# 位置\n巴格達東北的山洞（火炎迷宮）。\n# 物品\n- 寶箱：金創藥、魔力水、魔貝粉×2、十果粉×2、聖石榴、輪迴盤、嘉果。\n- 神奇麵包：暗黑修羅砧左上拐角（被牆擋住的寶箱）。\n- BOSS：格特輪，得暗黑修羅砧；可偷魔晶粉。\n# 偷竊與靈契\n- 靈契瓊霜DOMO，也是很好的護駕。\n- 瓊霜可偷不老之泉水。", "html": "<h3>位置</h3><p>巴格達東北的山洞（火炎迷宮）。</p><h3>物品</h3><ul><li>寶箱：<span class=\"jump items\" data-view=\"items\" data-detail=\"金創藥@628\" title=\"在物品大全中打開\">金創藥</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"魔力水@638\" title=\"在物品大全中打開\">魔力水</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"魔貝粉@627\" title=\"在物品大全中打開\">魔貝粉</span>×2、<span class=\"jump items\" data-view=\"items\" data-detail=\"十果粉@626\" title=\"在物品大全中打開\">十果粉</span>×2、<span class=\"jump items\" data-view=\"items\" data-detail=\"聖石榴@623\" title=\"在物品大全中打開\">聖石榴</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"輪迴盤@645\" title=\"在物品大全中打開\">輪迴盤</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"嘉果@630\" title=\"在物品大全中打開\">嘉果</span>。</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"神奇麵包@672\" title=\"在物品大全中打開\">神奇麵包</span>：暗黑修羅砧左上拐角（被牆擋住的寶箱）。</li><li>BOSS：<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"格特輪@180\" title=\"在神魔異事錄中打開\">格特輪</span>，得<span class=\"jump items\" data-view=\"items\" data-detail=\"暗黑修羅砧@717\" title=\"在物品大全中打開\">暗黑修羅砧</span>；可偷<span class=\"jump items\" data-view=\"items\" data-detail=\"魔晶粉@637\" title=\"在物品大全中打開\">魔晶粉</span>。</li></ul><h3>偷竊與靈契</h3><ul><li>靈契<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"瓊霜@151\" title=\"在神魔異事錄中打開\">瓊霜</span><span class=\"tag domo\">DOMO</span>，也是很好的護駕。</li><li><span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"瓊霜@151\" title=\"在神魔異事錄中打開\">瓊霜</span>可偷<span class=\"jump items\" data-view=\"items\" data-detail=\"不老之泉水@681\" title=\"在物品大全中打開\">不老之泉水</span>。</li></ul>"}, {"chapter": "阿拉伯", "title": "幻影石國", "text": "幻影石國\n# 流程\n綠洲商人說東邊有怪物 → 遠恩衝進幻影石國後失蹤 → 遇段秀實，一起從水井口進去 → 盡頭找到遠恩，打敗蜃樓王，幻影消失 → 段秀實帶路去唐營。這是劇情地圖，結束後不能再進。\n# 石國地下水路\n- 寶箱：十果粉×2、魔力水、魔貝粉×2、金創藥×2、回復劑、神祕果。\n- 漂在水上、隨水流移動的三個寶箱，看到先撿：嘉果、妖精麥粉、魔晶礦Ｃ。\n- 封印之光：封印之劍（9）。\n- 陷阱：兩處，賽特各損血 100、200；另有一處遇到三隻庫塔。", "html": "<h3>流程</h3><p>綠洲商人說東邊有怪物 → 遠恩衝進幻影石國後失蹤 → 遇段秀實，一起從水井口進去 → 盡頭找到遠恩，打敗<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"蜃樓王@16\" title=\"在神魔異事錄中打開\">蜃樓王</span>，幻影消失 → 段秀實帶路去唐營。這是劇情地圖，結束後不能再進。</p><h3>石國地下水路</h3><ul><li>寶箱：<span class=\"jump items\" data-view=\"items\" data-detail=\"十果粉@626\" title=\"在物品大全中打開\">十果粉</span>×2、<span class=\"jump items\" data-view=\"items\" data-detail=\"魔力水@638\" title=\"在物品大全中打開\">魔力水</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"魔貝粉@627\" title=\"在物品大全中打開\">魔貝粉</span>×2、<span class=\"jump items\" data-view=\"items\" data-detail=\"金創藥@628\" title=\"在物品大全中打開\">金創藥</span>×2、<span class=\"jump items\" data-view=\"items\" data-detail=\"回復劑@625\" title=\"在物品大全中打開\">回復劑</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"神祕果@729\" title=\"在物品大全中打開\">神祕果</span>。</li><li>漂在水上、隨水流移動的三個寶箱，看到先撿：<span class=\"jump items\" data-view=\"items\" data-detail=\"嘉果@630\" title=\"在物品大全中打開\">嘉果</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"妖精麥粉@674\" title=\"在物品大全中打開\">妖精麥粉</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"魔晶礦Ｃ@774\" title=\"在物品大全中打開\">魔晶礦Ｃ</span>。</li><li>封印之光：<span class=\"jump items\" data-view=\"items\" data-detail=\"封印之劍@793\" title=\"在物品大全中打開\">封印之劍</span>（9）。</li><li>陷阱：兩處，賽特各損血 100、200；另有一處遇到三隻<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"庫塔@181\" title=\"在神魔異事錄中打開\">庫塔</span>。</li></ul>"}, {"chapter": "阿拉伯", "title": "怛羅斯", "text": "怛羅斯\n# 流程\n峽谷裡遇唐軍先行軍 → 麥爾斯現身，原來是撒旦轉世 → 勸黃雷不成，兩次打敗機關三魔獸 → 唐軍與大食交戰，眾人上山避難 → 扳機關放巨石開路 → 慧彥下山阻止大食進兵，殉身 → 薇達帶走賽特，賽特昏倒。\n# 物品\n- 封印之光：封印之劍（10）；左側草叢有龍骨木（隱藏）。\n- 下層：空白符紙（寶箱）、魔法葉、解毒草、嘉果×2、玉山佛甲草（智慧 +10）、香柏葉（力量 +10）。\n- 上層：嘉果、藥草、龍骨木、魔法葉。\n- 提示：各個角落用空格搜一搜，草藥不少。", "html": "<h3>流程</h3><p>峽谷裡遇唐軍先行軍 → 麥爾斯現身，原來是撒旦轉世 → 勸黃雷不成，兩次打敗<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"機關三魔獸@48\" title=\"在神魔異事錄中打開\">機關三魔獸</span> → 唐軍與大食交戰，眾人上山避難 → 扳機關放巨石開路 → 慧彥下山阻止大食進兵，殉身 → 薇達帶走賽特，賽特昏倒。</p><h3>物品</h3><ul><li>封印之光：<span class=\"jump items\" data-view=\"items\" data-detail=\"封印之劍@793\" title=\"在物品大全中打開\">封印之劍</span>（10）；左側草叢有<span class=\"jump items\" data-view=\"items\" data-detail=\"龍骨木@723\" title=\"在物品大全中打開\">龍骨木</span>（隱藏）。</li><li>下層：<span class=\"jump items\" data-view=\"items\" data-detail=\"空白符紙@768\" title=\"在物品大全中打開\">空白符紙</span>（寶箱）、<span class=\"jump items\" data-view=\"items\" data-detail=\"魔法葉@636\" title=\"在物品大全中打開\">魔法葉</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"解毒草@647\" title=\"在物品大全中打開\">解毒草</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"嘉果@630\" title=\"在物品大全中打開\">嘉果</span>×2、<span class=\"jump items\" data-view=\"items\" data-detail=\"玉山佛甲草@693\" title=\"在物品大全中打開\">玉山佛甲草</span>（智慧 +10）、<span class=\"jump items\" data-view=\"items\" data-detail=\"香柏葉@670\" title=\"在物品大全中打開\">香柏葉</span>（力量 +10）。</li><li>上層：<span class=\"jump items\" data-view=\"items\" data-detail=\"嘉果@630\" title=\"在物品大全中打開\">嘉果</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"藥草@621\" title=\"在物品大全中打開\">藥草</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"龍骨木@723\" title=\"在物品大全中打開\">龍骨木</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"魔法葉@636\" title=\"在物品大全中打開\">魔法葉</span>。</li><li>提示：各個角落用空格搜一搜，草藥不少。</li></ul>"}, {"chapter": "阿拉伯", "title": "五年後（夢境）", "text": "五年後（夢境）\n# 流程\n賽特醒來已是波斯最高執政官，與薇達結婚（得藍魔神、姆斯比爾） → 在豪宅休息室左上的櫃子找回原來的衣服換上 → 大廳見麥爾斯、妮可、黃雷、康那里士 → 發兵東征，途經怛羅斯見到慧彥的魂魄，軍隊潰散 → 和慧彥上天山找仙人，往東進石國。\n# 偷竊\n- 中國西域的阿拔東可偷羅剎食日鈸。", "html": "<h3>流程</h3><p>賽特醒來已是波斯最高執政官，與薇達結婚（得<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"藍魔神@13\" title=\"在神魔異事錄中打開\">藍魔神</span>、<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"姆斯比爾@6\" title=\"在神魔異事錄中打開\">姆斯比爾</span>） → 在豪宅休息室左上的櫃子找回原來的衣服換上 → 大廳見麥爾斯、妮可、黃雷、康那里士 → 發兵東征，途經怛羅斯見到慧彥的魂魄，軍隊潰散 → 和慧彥上天山找仙人，往東進石國。</p><h3>偷竊</h3><ul><li>中國西域的<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"阿拔東@173\" title=\"在神魔異事錄中打開\">阿拔東</span>可偷<span class=\"jump items\" data-view=\"items\" data-detail=\"羅剎食日鈸@712\" title=\"在物品大全中打開\">羅剎食日鈸</span>。</li></ul>"}, {"chapter": "西域", "title": "石國", "text": "石國\n# 支線\n- 薩爾達 進第一間民房和宇文大地一家說話（去天山之前）。回到現實後再來一次，見到新婚的宇文天夫婦，幫他們的兒子取名「宇文答滴」。\n# 建議\n- 買兩件千葉，給妮可和卡瑪。\n- 到天山拿到封神壇之後，就不能再用東方祭壇的煉化秘技，想煉神龍等要在這之前煉。", "html": "<h3>支線</h3><ul><li><span class=\"tag sarda\">薩爾達</span> 進第一間民房和宇文大地一家說話（去天山之前）。回到現實後再來一次，見到新婚的宇文天夫婦，幫他們的兒子取名「宇文答滴」。</li></ul><h3>建議</h3><ul><li>買兩件<span class=\"jump items\" data-view=\"items\" data-detail=\"千葉@1031\" title=\"在物品大全中打開\">千葉</span>，給妮可和卡瑪。</li><li>到天山拿到<span class=\"jump items\" data-view=\"items\" data-detail=\"封神壇@771\" title=\"在物品大全中打開\">封神壇</span>之後，就不能再用東方祭壇的煉化秘技，想煉神龍等要在這之前煉。</li></ul>"}, {"chapter": "西域", "title": "天山山道與山洞", "text": "天山山道與山洞\n# 流程\n出石國往南過木橋再往東進天山 → 山道打敗黃雷的機關三魔獸兩次，再打敗康那里士 → 存檔進山洞 → 出洞遇妮可，她不忍動手哭著離開 → 卡瑪不願和薇達打，賽特單挑薇達 → 到山頂。\n# 物品\n- 山腳山門下：太皇刀─藍牙（隱藏）。\n- 山道：嘉果；封印之光：封印之劍（11）。\n- 山洞寶箱：空白符紙、諸方神石、金創藥、暗殺寶錄（投擲指令）、溶石藥劑、聖言石、崙凰劍、翔羽葉、輪迴盤、魔晶礦Ｄ、金塊、機關設計圖１（出洞前左側）。\n- 出洞後左側山崖下：天山雪蓮。\n- 遇妮可後，下一個場景最右邊上方的雲堆：鬼雲（隱藏）。\n# 偷竊與靈契\n- 靈契水仙、上元夫人DOMO，各至少一隻。\n- 上元夫人可偷天山雪蓮。", "html": "<h3>流程</h3><p>出石國往南過木橋再往東進天山 → 山道打敗黃雷的<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"機關三魔獸@48\" title=\"在神魔異事錄中打開\">機關三魔獸</span>兩次，再打敗<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"康那里士@7\" title=\"在神魔異事錄中打開\">康那里士</span> → 存檔進山洞 → 出洞遇妮可，她不忍動手哭著離開 → 卡瑪不願和薇達打，賽特單挑<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"薇達@3\" title=\"在神魔異事錄中打開\">薇達</span> → 到山頂。</p><h3>物品</h3><ul><li>山腳山門下：<span class=\"jump items\" data-view=\"items\" data-detail=\"太皇刀─藍牙@544\" title=\"在物品大全中打開\">太皇刀─藍牙</span>（隱藏）。</li><li>山道：<span class=\"jump items\" data-view=\"items\" data-detail=\"嘉果@630\" title=\"在物品大全中打開\">嘉果</span>；封印之光：<span class=\"jump items\" data-view=\"items\" data-detail=\"封印之劍@793\" title=\"在物品大全中打開\">封印之劍</span>（11）。</li><li>山洞寶箱：<span class=\"jump items\" data-view=\"items\" data-detail=\"空白符紙@768\" title=\"在物品大全中打開\">空白符紙</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"諸方神石@698\" title=\"在物品大全中打開\">諸方神石</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"金創藥@628\" title=\"在物品大全中打開\">金創藥</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"暗殺寶錄@950\" title=\"在物品大全中打開\">暗殺寶錄</span>（投擲指令）、<span class=\"jump items\" data-view=\"items\" data-detail=\"溶石藥劑@651\" title=\"在物品大全中打開\">溶石藥劑</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"聖言石@657\" title=\"在物品大全中打開\">聖言石</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"崙凰劍@510\" title=\"在物品大全中打開\">崙凰劍</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"翔羽葉@568\" title=\"在物品大全中打開\">翔羽葉</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"輪迴盤@645\" title=\"在物品大全中打開\">輪迴盤</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"魔晶礦Ｄ@775\" title=\"在物品大全中打開\">魔晶礦Ｄ</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"金塊@817\" title=\"在物品大全中打開\">金塊</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"機關設計圖１@776\" title=\"在物品大全中打開\">機關設計圖１</span>（出洞前左側）。</li><li>出洞後左側山崖下：<span class=\"jump items\" data-view=\"items\" data-detail=\"天山雪蓮@643\" title=\"在物品大全中打開\">天山雪蓮</span>。</li><li>遇妮可後，下一個場景最右邊上方的雲堆：<span class=\"jump items\" data-view=\"items\" data-detail=\"鬼雲@1028\" title=\"在物品大全中打開\">鬼雲</span>（隱藏）。</li></ul><h3>偷竊與靈契</h3><ul><li>靈契<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"水仙@147\" title=\"在神魔異事錄中打開\">水仙</span>、<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"上元夫人@154\" title=\"在神魔異事錄中打開\">上元夫人</span><span class=\"tag domo\">DOMO</span>，各至少一隻。</li><li><span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"上元夫人@154\" title=\"在神魔異事錄中打開\">上元夫人</span>可偷<span class=\"jump items\" data-view=\"items\" data-detail=\"天山雪蓮@643\" title=\"在物品大全中打開\">天山雪蓮</span>。</li></ul>"}, {"chapter": "西域", "title": "天山山頂", "text": "天山山頂\n# 流程\n石室見軒轅劍仙 → 打敗撒旦麥爾斯 → 劍仙破解蜃樓王的幻術，回到現實，五年都是幻夢 → 劍仙把蜃樓王收進煉妖壺 → 再進軒轅劍石室，慧彥化為舍利子，以前世李靖的身分加入，得舍利子、封神壇（開啟東方祭壇） → 出洞和妮可說話，妮可歸隊 → 洞口和軒轅劍僮說話，得知要 17 把封印之劍 → 再和薇達說話，卡瑪與安卡歸隊 → 下山去長安。\n# 物品\n- 楊通幽所在山洞的左邊牆壁：仙蓮子（隱藏）。\n- 笑和尚右側櫥子：羅漢袈裟（隱藏）。\n# 支線\n- 薩爾達 見軒轅劍仙之前和楊通幽說話；回到現實後馬上再來一次（他預言大唐將有兵變）。之後回石國找宇文天夫婦。\n- 典藏版 下山後，迷宮出口山道上的訪仙者王子喬，答「太行山」，得翠玉金釵。", "html": "<h3>流程</h3><p>石室見軒轅劍仙 → 打敗<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"撒旦麥爾斯@68\" title=\"在神魔異事錄中打開\">撒旦麥爾斯</span> → 劍仙破解蜃樓王的幻術，回到現實，五年都是幻夢 → 劍仙把<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"蜃樓王@16\" title=\"在神魔異事錄中打開\">蜃樓王</span>收進煉妖壺 → 再進軒轅劍石室，慧彥化為舍利子，以前世李靖的身分加入，得<span class=\"jump items\" data-view=\"items\" data-detail=\"舍利子@690\" title=\"在物品大全中打開\">舍利子</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"封神壇@771\" title=\"在物品大全中打開\">封神壇</span>（開啟東方祭壇） → 出洞和妮可說話，妮可歸隊 → 洞口和軒轅劍僮說話，得知要 17 把封印之劍 → 再和薇達說話，卡瑪與安卡歸隊 → 下山去長安。</p><h3>物品</h3><ul><li>楊通幽所在山洞的左邊牆壁：<span class=\"jump items\" data-view=\"items\" data-detail=\"仙蓮子@646\" title=\"在物品大全中打開\">仙蓮子</span>（隱藏）。</li><li>笑和尚右側櫥子：<span class=\"jump items\" data-view=\"items\" data-detail=\"羅漢袈裟@708\" title=\"在物品大全中打開\">羅漢袈裟</span>（隱藏）。</li></ul><h3>支線</h3><ul><li><span class=\"tag sarda\">薩爾達</span> 見軒轅劍仙之前和楊通幽說話；回到現實後馬上再來一次（他預言大唐將有兵變）。之後回石國找宇文天夫婦。</li><li><span class=\"tag edition\">典藏版</span> 下山後，迷宮出口山道上的訪仙者王子喬，答「太行山」，得<span class=\"jump items\" data-view=\"items\" data-detail=\"翠玉金釵@1023\" title=\"在物品大全中打開\">翠玉金釵</span>。</li></ul>"}, {"chapter": "大唐", "title": "長安", "text": "長安\n# 流程\n進西南的白連儀家暫住，學習大唐文化 → 決定把慧彥的舍利子送回少林寺。之後追黃八時會回來找老古做炸藥。\n# 白連儀家\n- 隱藏：金創藥（大廳左上）、風神符（書房書架）、飛翔魔油（書房右上角院子的石燈，需用滑鼠點）。\n- 典藏版 府外右邊的官府衙役，「不是節度使」答「嶺南」、「在京城」答「劍南」，得金塊×3。\n# 西市街道\n- 地上：延胡索之花（雜貨鋪門前左側）。\n- 隱藏：珍珠戒指（何慧紋左側的罈子）、神奇麵包（從東數第三個雜貨攤）。\n- 朱雀門右側：茉莉花DOMO。\n- 武器攤商人：花錢把中國劍開封成魚腸，只有一次機會。做薩爾達不要開封。\n- 小官韋青 資料片：比武場旁，答「賈南風」「武則天」，得舍利子（靈力 +100）。\n- 老郭的寶物 資料片：聽三姑六婆說話 → 比武場找到提示紙 → 東平郡王府大門前右側石燈 → 白連儀家門前左側石獅 → 潛入東平郡王府時，在二門左側石龍腹中得青龍水珠（抗冰 100%）。\n- 薩爾達：條件達成後在西市交易，只有一次，安史之亂前。\n# 悅來客棧\n- 隱藏：神祕果（入口右側罈子）、增肥劑與魚酥（一樓房間左側櫃子）、水果（二樓杜甫房間的櫃子）DOMO。\n- 典藏版 樓梯上的小太監，答「金城公主」「咸宜公主」，得金塊×3。\n# 雜貨鋪\n- 隱藏：靈界指標（右邊幾層草墊）。\n# 長生藥房\n- 寶箱：蜂王露（左側）。\n- 隱藏：山蛇莓（右上書架）DOMO。\n# 蘭律閣\n- 寶箱：機關設計圖２（左側）、諸方神石。\n- 隱藏：炎陽靈珠（白老闆身後的櫃子）。\n- 資料片 老人公孫鞅問年號，答「3」「14」，得雅典之靴。\n- 交換見«魔晶礦»、«機關設計圖»。\n# 杜康居\n- 隱藏：天仙酒（二樓王祥宇右側的酒罈）。\n- 資料片 二樓右下角的少東，答「馬日行 780 里」，得流光鞋。", "html": "<h3>流程</h3><p>進西南的白連儀家暫住，學習大唐文化 → 決定把慧彥的舍利子送回少林寺。之後追黃八時會回來找老古做炸藥。</p><h3>白連儀家</h3><ul><li>隱藏：<span class=\"jump items\" data-view=\"items\" data-detail=\"金創藥@628\" title=\"在物品大全中打開\">金創藥</span>（大廳左上）、<span class=\"jump items\" data-view=\"items\" data-detail=\"風神符@704\" title=\"在物品大全中打開\">風神符</span>（書房書架）、<span class=\"jump items\" data-view=\"items\" data-detail=\"飛翔魔油@679\" title=\"在物品大全中打開\">飛翔魔油</span>（書房右上角院子的石燈，需用滑鼠點）。</li><li><span class=\"tag edition\">典藏版</span> 府外右邊的官府衙役，「不是節度使」答「嶺南」、「在京城」答「劍南」，得<span class=\"jump items\" data-view=\"items\" data-detail=\"金塊@817\" title=\"在物品大全中打開\">金塊</span>×3。</li></ul><h3>西市街道</h3><ul><li>地上：<span class=\"jump items\" data-view=\"items\" data-detail=\"延胡索之花@726\" title=\"在物品大全中打開\">延胡索之花</span>（雜貨鋪門前左側）。</li><li>隱藏：<span class=\"jump items\" data-view=\"items\" data-detail=\"珍珠戒指@976\" title=\"在物品大全中打開\">珍珠戒指</span>（何慧紋左側的罈子）、<span class=\"jump items\" data-view=\"items\" data-detail=\"神奇麵包@672\" title=\"在物品大全中打開\">神奇麵包</span>（從東數第三個雜貨攤）。</li><li>朱雀門右側：<span class=\"jump items\" data-view=\"items\" data-detail=\"茉莉花@825\" title=\"在物品大全中打開\">茉莉花</span><span class=\"tag domo\">DOMO</span>。</li><li>武器攤商人：花錢把<span class=\"jump items\" data-view=\"items\" data-detail=\"中國劍@578\" title=\"在物品大全中打開\">中國劍</span>開封成<span class=\"jump items\" data-view=\"items\" data-detail=\"魚腸@514\" title=\"在物品大全中打開\">魚腸</span>，只有一次機會。做薩爾達不要開封。</li><li>小官韋青 <span class=\"tag edition\">資料片</span>：比武場旁，答「賈南風」「武則天」，得<span class=\"jump items\" data-view=\"items\" data-detail=\"舍利子@690\" title=\"在物品大全中打開\">舍利子</span>（靈力 +100）。</li><li>老郭的寶物 <span class=\"tag edition\">資料片</span>：聽三姑六婆說話 → 比武場找到提示紙 → 東平郡王府大門前右側石燈 → 白連儀家門前左側石獅 → 潛入東平郡王府時，在二門左側石龍腹中得<span class=\"jump items\" data-view=\"items\" data-detail=\"青龍水珠@944\" title=\"在物品大全中打開\">青龍水珠</span>（抗冰 100%）。</li><li>薩爾達：條件達成後在西市交易，只有一次，<span class=\"tag time\">安史之亂前</span>。</li></ul><h3>悅來客棧</h3><ul><li>隱藏：<span class=\"jump items\" data-view=\"items\" data-detail=\"神祕果@729\" title=\"在物品大全中打開\">神祕果</span>（入口右側罈子）、<span class=\"jump items\" data-view=\"items\" data-detail=\"增肥劑@820\" title=\"在物品大全中打開\">增肥劑</span>與<span class=\"jump items\" data-view=\"items\" data-detail=\"魚酥@818\" title=\"在物品大全中打開\">魚酥</span>（一樓房間左側櫃子）、<span class=\"jump items\" data-view=\"items\" data-detail=\"水果@828\" title=\"在物品大全中打開\">水果</span>（二樓杜甫房間的櫃子）<span class=\"tag domo\">DOMO</span>。</li><li><span class=\"tag edition\">典藏版</span> 樓梯上的小太監，答「金城公主」「咸宜公主」，得<span class=\"jump items\" data-view=\"items\" data-detail=\"金塊@817\" title=\"在物品大全中打開\">金塊</span>×3。</li></ul><h3>雜貨鋪</h3><ul><li>隱藏：<span class=\"jump items\" data-view=\"items\" data-detail=\"靈界指標@769\" title=\"在物品大全中打開\">靈界指標</span>（右邊幾層草墊）。</li></ul><h3>長生藥房</h3><ul><li>寶箱：<span class=\"jump items\" data-view=\"items\" data-detail=\"蜂王露@688\" title=\"在物品大全中打開\">蜂王露</span>（左側）。</li><li>隱藏：<span class=\"jump items\" data-view=\"items\" data-detail=\"山蛇莓@722\" title=\"在物品大全中打開\">山蛇莓</span>（右上書架）<span class=\"tag domo\">DOMO</span>。</li></ul><h3>蘭律閣</h3><ul><li>寶箱：<span class=\"jump items\" data-view=\"items\" data-detail=\"機關設計圖２@777\" title=\"在物品大全中打開\">機關設計圖２</span>（左側）、<span class=\"jump items\" data-view=\"items\" data-detail=\"諸方神石@698\" title=\"在物品大全中打開\">諸方神石</span>。</li><li>隱藏：<span class=\"jump items\" data-view=\"items\" data-detail=\"炎陽靈珠@710\" title=\"在物品大全中打開\">炎陽靈珠</span>（白老闆身後的櫃子）。</li><li><span class=\"tag edition\">資料片</span> 老人公孫鞅問年號，答「3」「14」，得<span class=\"jump items\" data-view=\"items\" data-detail=\"雅典之靴@909\" title=\"在物品大全中打開\">雅典之靴</span>。</li><li>交換見<span class=\"goto\" data-title=\"魔晶礦\">魔晶礦</span>、<span class=\"goto\" data-title=\"機關設計圖\">機關設計圖</span>。</li></ul><h3>杜康居</h3><ul><li>隱藏：<span class=\"jump items\" data-view=\"items\" data-detail=\"天仙酒@701\" title=\"在物品大全中打開\">天仙酒</span>（二樓王祥宇右側的酒罈）。</li><li><span class=\"tag edition\">資料片</span> 二樓右下角的少東，答「馬日行 780 里」，得<span class=\"jump items\" data-view=\"items\" data-detail=\"流光鞋@1040\" title=\"在物品大全中打開\">流光鞋</span>。</li></ul>"}, {"chapter": "大唐", "title": "少林寺", "text": "少林寺\n# 流程\n長安城外東南。門口和悟緣說話，被要求從木人巷上山 → 搬動右邊石塔進木人巷 → 出巷後安放慧彥的舍利子 → 悟緣提到洛陽有邪教，一起去洛陽抓黃八。\n# 木人巷\n- 一進門就和木鐵人戰鬥，可偷神木之精（耐力 +10）。\n- 隱藏：仙爐灰（香爐）。\n- 寶箱：輪迴盤、機關設計圖４、金創藥、還靈丹、還神果。\n- 封印之光：封印之劍（12）。\n- 封印之光後有三條路，只能選一條：\n- 上：金剛斗笠、千年何首烏、玄武土器（抗土 80%）、還靈丹。\n- 中：金創藥、白虎風牙（抗風 80%）、海神盔、千年何首烏。\n- 下：神光寶塔（抗光 80%）、神木之精。\n- 出口前有一大群機關和尚，直接走過去，是幻影，不會觸發戰鬥。", "html": "<h3>流程</h3><p>長安城外東南。門口和悟緣說話，被要求從木人巷上山 → 搬動右邊石塔進木人巷 → 出巷後安放慧彥的舍利子 → 悟緣提到洛陽有邪教，一起去洛陽抓黃八。</p><h3>木人巷</h3><ul><li>一進門就和<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"木鐵人@71\" title=\"在神魔異事錄中打開\">木鐵人</span>戰鬥，可偷<span class=\"jump items\" data-view=\"items\" data-detail=\"神木之精@692\" title=\"在物品大全中打開\">神木之精</span>（耐力 +10）。</li><li>隱藏：<span class=\"jump items\" data-view=\"items\" data-detail=\"仙爐灰@641\" title=\"在物品大全中打開\">仙爐灰</span>（香爐）。</li><li>寶箱：<span class=\"jump items\" data-view=\"items\" data-detail=\"輪迴盤@645\" title=\"在物品大全中打開\">輪迴盤</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"機關設計圖４@779\" title=\"在物品大全中打開\">機關設計圖４</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"金創藥@628\" title=\"在物品大全中打開\">金創藥</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"還靈丹@639\" title=\"在物品大全中打開\">還靈丹</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"還神果@653\" title=\"在物品大全中打開\">還神果</span>。</li><li>封印之光：<span class=\"jump items\" data-view=\"items\" data-detail=\"封印之劍@793\" title=\"在物品大全中打開\">封印之劍</span>（12）。</li><li>封印之光後有三條路，只能選一條：</li><li>上：<span class=\"jump items\" data-view=\"items\" data-detail=\"金剛斗笠@899\" title=\"在物品大全中打開\">金剛斗笠</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"千年何首烏@633\" title=\"在物品大全中打開\">千年何首烏</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"玄武土器@946\" title=\"在物品大全中打開\">玄武土器</span>（抗土 80%）、<span class=\"jump items\" data-view=\"items\" data-detail=\"還靈丹@639\" title=\"在物品大全中打開\">還靈丹</span>。</li><li>中：<span class=\"jump items\" data-view=\"items\" data-detail=\"金創藥@628\" title=\"在物品大全中打開\">金創藥</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"白虎風牙@945\" title=\"在物品大全中打開\">白虎風牙</span>（抗風 80%）、<span class=\"jump items\" data-view=\"items\" data-detail=\"海神盔@895\" title=\"在物品大全中打開\">海神盔</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"千年何首烏@633\" title=\"在物品大全中打開\">千年何首烏</span>。</li><li>下：<span class=\"jump items\" data-view=\"items\" data-detail=\"神光寶塔@948\" title=\"在物品大全中打開\">神光寶塔</span>（抗光 80%）、<span class=\"jump items\" data-view=\"items\" data-detail=\"神木之精@692\" title=\"在物品大全中打開\">神木之精</span>。</li><li>出口前有一大群機關和尚，直接走過去，是幻影，不會觸發戰鬥。</li></ul>"}, {"chapter": "大唐", "title": "洛陽", "text": "洛陽\n# 流程\n進怡春院和龜公、老鴇說話，得知黃八逃到長安西市 → 西市杜康居外有命案 → 黃八逃進漢長安廢墟。\n# 城內\n- 地上：菟絲魔子（城門外）、博落迴之根（客棧外）。\n- 隱藏：神津珍譜─壹（乞丐小狗子右側兩房子夾縫的水缸）、神津珍譜─參（麵攤旁的罈子）、庖丁菜刀（松韻居和回春堂之間的筐，分解指令）。\n- 乞丐小狗子：給 300 銀幣告訴你黑壇總教的位置；給 600 銀幣得三葉雪桑果（生命 +100）。\n- 資料片 怡春院外的宗楚客：見«宗楚客的玉器»。\n# 雜貨鋪\n- 隱藏：神草結（木桶處）、三教霞光鏡（櫃子）。\n- 資料片 大食商人阿穆：交聖皇四件，得麒麟緞帶。\n# 上御客棧\n- 隱藏：紅酒（入口左側罈子）、神津珍譜─貳（二樓樓梯上方的罈子）。\n- 資料片 二樓的波斯商人艾布數明珠，答「107」，得法藏。\n# 松韻居\n- 寶箱：鼠槌（左側，鼠槌指令）。\n- 交換見«魔晶礦»、«機關設計圖»。\n# 回春堂\n- 隱藏：河車丸（右側櫃子）、七葉蓮（左側櫃子）。\n- 資料片 書生孫思年，答「樂經」，得子雷手套。\n# 麵攤與武器販\n- 麵攤潘老闆：五本神津珍譜換味仙認可證DOMO，安史之亂前。\n- 武器販王老五：救出王思月之後出現，四把太皇刀換四極皇霸刀，之後可買萬鈞神弩。", "html": "<h3>流程</h3><p>進怡春院和龜公、老鴇說話，得知黃八逃到長安西市 → 西市杜康居外有命案 → 黃八逃進漢長安廢墟。</p><h3>城內</h3><ul><li>地上：<span class=\"jump items\" data-view=\"items\" data-detail=\"菟絲魔子@728\" title=\"在物品大全中打開\">菟絲魔子</span>（城門外）、<span class=\"jump items\" data-view=\"items\" data-detail=\"博落迴之根@719\" title=\"在物品大全中打開\">博落迴之根</span>（客棧外）。</li><li>隱藏：<span class=\"jump items\" data-view=\"items\" data-detail=\"神津珍譜─壹@782\" title=\"在物品大全中打開\">神津珍譜─壹</span>（乞丐小狗子右側兩房子夾縫的水缸）、<span class=\"jump items\" data-view=\"items\" data-detail=\"神津珍譜─參@784\" title=\"在物品大全中打開\">神津珍譜─參</span>（麵攤旁的罈子）、<span class=\"jump items\" data-view=\"items\" data-detail=\"庖丁菜刀@953\" title=\"在物品大全中打開\">庖丁菜刀</span>（松韻居和回春堂之間的筐，分解指令）。</li><li>乞丐小狗子：給 300 銀幣告訴你黑壇總教的位置；給 600 銀幣得<span class=\"jump items\" data-view=\"items\" data-detail=\"三葉雪桑果@687\" title=\"在物品大全中打開\">三葉雪桑果</span>（生命 +100）。</li><li><span class=\"tag edition\">資料片</span> 怡春院外的宗楚客：見<span class=\"goto\" data-title=\"宗楚客的玉器\">宗楚客的玉器</span>。</li></ul><h3>雜貨鋪</h3><ul><li>隱藏：<span class=\"jump items\" data-view=\"items\" data-detail=\"神草結@995\" title=\"在物品大全中打開\">神草結</span>（木桶處）、<span class=\"jump items\" data-view=\"items\" data-detail=\"三教霞光鏡@713\" title=\"在物品大全中打開\">三教霞光鏡</span>（櫃子）。</li><li><span class=\"tag edition\">資料片</span> 大食商人阿穆：交聖皇四件，得<span class=\"jump items\" data-view=\"items\" data-detail=\"麒麟緞帶@1027\" title=\"在物品大全中打開\">麒麟緞帶</span>。</li></ul><h3>上御客棧</h3><ul><li>隱藏：<span class=\"jump items\" data-view=\"items\" data-detail=\"紅酒@794\" title=\"在物品大全中打開\">紅酒</span>（入口左側罈子）、<span class=\"jump items\" data-view=\"items\" data-detail=\"神津珍譜─貳@783\" title=\"在物品大全中打開\">神津珍譜─貳</span>（二樓樓梯上方的罈子）。</li><li><span class=\"tag edition\">資料片</span> 二樓的波斯商人艾布數明珠，答「107」，得<span class=\"jump items\" data-view=\"items\" data-detail=\"法藏@1029\" title=\"在物品大全中打開\">法藏</span>。</li></ul><h3>松韻居</h3><ul><li>寶箱：<span class=\"jump items\" data-view=\"items\" data-detail=\"鼠槌@938\" title=\"在物品大全中打開\">鼠槌</span>（左側，鼠槌指令）。</li><li>交換見<span class=\"goto\" data-title=\"魔晶礦\">魔晶礦</span>、<span class=\"goto\" data-title=\"機關設計圖\">機關設計圖</span>。</li></ul><h3>回春堂</h3><ul><li>隱藏：<span class=\"jump items\" data-view=\"items\" data-detail=\"河車丸@662\" title=\"在物品大全中打開\">河車丸</span>（右側櫃子）、<span class=\"jump items\" data-view=\"items\" data-detail=\"七葉蓮@661\" title=\"在物品大全中打開\">七葉蓮</span>（左側櫃子）。</li><li><span class=\"tag edition\">資料片</span> 書生孫思年，答「樂經」，得<span class=\"jump items\" data-view=\"items\" data-detail=\"子雷手套@889\" title=\"在物品大全中打開\">子雷手套</span>。</li></ul><h3>麵攤與武器販</h3><ul><li>麵攤潘老闆：五本神津珍譜換<span class=\"jump items\" data-view=\"items\" data-detail=\"味仙認可證@832\" title=\"在物品大全中打開\">味仙認可證</span><span class=\"tag domo\">DOMO</span>，<span class=\"tag time\">安史之亂前</span>。</li><li>武器販王老五：救出王思月之後出現，四把太皇刀換<span class=\"jump items\" data-view=\"items\" data-detail=\"四極皇霸刀@553\" title=\"在物品大全中打開\">四極皇霸刀</span>，之後可買<span class=\"jump items\" data-view=\"items\" data-detail=\"萬鈞神弩@536\" title=\"在物品大全中打開\">萬鈞神弩</span>。</li></ul>"}, {"chapter": "大唐", "title": "漢長安廢墟（一）", "text": "漢長安廢墟（一）\n# 流程\n長安西南的山洞 → 見一名女子往深處走，跟上去 → 打敗黃八 → 搜完整個廢墟，找到女子王思月 → 回長安西市雜貨鋪找老古做炸藥（等三分鐘） → 回來炸開山壁 → 遇康那里士，悟緣變成夜叉悟緣，打敗後恢復 → 王思月邀眾人去她家。\n這一趟有三樣安史之亂前才拿得到：俱樂部會員卡、名歌星ＣＤ、神津珍譜─伍。\n# 第一區\n- 入口左側草叢：靈界指標（隱藏）。\n- 黃八後面屋子左側櫃子：白皙葫蘆（隱藏）。\n- 黃八後面左上第二間屋子的桌子：機關設計圖３（隱藏）。\n- 豐饒之角上面那間屋子右側的櫃子：神津珍譜─伍（隱藏）。\n- 寶箱：金創藥、名歌星ＣＤ（總入口一直往右）DOMO、還魄丹、硝石（右行往上的屋子）、豐饒之角（體力 +50）、聖石榴、炭粉（總入口上行右邊）。\n- 地上：七葉蓮、柴胡乾葛草。\n# 第二區\n- 進去後左邊很大的白色破罈子：姜公膽（隱藏，連擊指令）。\n- 入口左上屋子右邊瓶子：鬼眼法刀（隱藏）。\n- 入口右上屋子左邊罈子：星君眼（隱藏，攻擊加 50%）。\n- 賽特和悟緣說話的屋子：俱樂部會員卡（隱藏）DOMO；出來後的寶箱有竹筒。\n- 再往右上的屋子右邊桌子：機關設計圖６（隱藏）；門前破櫃子：乾坤袋（隱藏，偷竊指令）。\n- 寶箱：金創藥、硫磺（入口正中往上的屋子）、海檬果、啻浪奇甲、土地神符。\n- 地上：香柏葉。\n# 炸開的山壁\n- 靈虛扇（淨化所有異常狀態）。\n- 封印之光：封印之劍（13）。\n# 偷竊\n- 冥府獄卒可偷河車丸，瘟鬼可偷七葉蓮。\n- 救下食屍鬼會出現白無常。", "html": "<h3>流程</h3><p>長安西南的山洞 → 見一名女子往深處走，跟上去 → 打敗<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"黃八@381\" title=\"在神魔異事錄中打開\">黃八</span> → 搜完整個廢墟，找到女子王思月 → 回長安西市雜貨鋪找老古做炸藥（等三分鐘） → 回來炸開山壁 → 遇<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"康那里士@7\" title=\"在神魔異事錄中打開\">康那里士</span>，悟緣變成<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"夜叉悟緣@52\" title=\"在神魔異事錄中打開\">夜叉悟緣</span>，打敗後恢復 → 王思月邀眾人去她家。</p><p>這一趟有三樣<span class=\"tag time\">安史之亂前</span>才拿得到：<span class=\"jump items\" data-view=\"items\" data-detail=\"俱樂部會員卡@821\" title=\"在物品大全中打開\">俱樂部會員卡</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"名歌星ＣＤ@819\" title=\"在物品大全中打開\">名歌星ＣＤ</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"神津珍譜─伍@786\" title=\"在物品大全中打開\">神津珍譜─伍</span>。</p><h3>第一區</h3><ul><li>入口左側草叢：<span class=\"jump items\" data-view=\"items\" data-detail=\"靈界指標@769\" title=\"在物品大全中打開\">靈界指標</span>（隱藏）。</li><li>黃八後面屋子左側櫃子：<span class=\"jump items\" data-view=\"items\" data-detail=\"白皙葫蘆@711\" title=\"在物品大全中打開\">白皙葫蘆</span>（隱藏）。</li><li>黃八後面左上第二間屋子的桌子：<span class=\"jump items\" data-view=\"items\" data-detail=\"機關設計圖３@778\" title=\"在物品大全中打開\">機關設計圖３</span>（隱藏）。</li><li>豐饒之角上面那間屋子右側的櫃子：<span class=\"jump items\" data-view=\"items\" data-detail=\"神津珍譜─伍@786\" title=\"在物品大全中打開\">神津珍譜─伍</span>（隱藏）。</li><li>寶箱：<span class=\"jump items\" data-view=\"items\" data-detail=\"金創藥@628\" title=\"在物品大全中打開\">金創藥</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"名歌星ＣＤ@819\" title=\"在物品大全中打開\">名歌星ＣＤ</span>（總入口一直往右）<span class=\"tag domo\">DOMO</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"還魄丹@644\" title=\"在物品大全中打開\">還魄丹</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"硝石@812\" title=\"在物品大全中打開\">硝石</span>（右行往上的屋子）、<span class=\"jump items\" data-view=\"items\" data-detail=\"豐饒之角@671\" title=\"在物品大全中打開\">豐饒之角</span>（體力 +50）、<span class=\"jump items\" data-view=\"items\" data-detail=\"聖石榴@623\" title=\"在物品大全中打開\">聖石榴</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"炭粉@814\" title=\"在物品大全中打開\">炭粉</span>（總入口上行右邊）。</li><li>地上：<span class=\"jump items\" data-view=\"items\" data-detail=\"七葉蓮@661\" title=\"在物品大全中打開\">七葉蓮</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"柴胡乾葛草@650\" title=\"在物品大全中打開\">柴胡乾葛草</span>。</li></ul><h3>第二區</h3><ul><li>進去後左邊很大的白色破罈子：<span class=\"jump items\" data-view=\"items\" data-detail=\"姜公膽@940\" title=\"在物品大全中打開\">姜公膽</span>（隱藏，連擊指令）。</li><li>入口左上屋子右邊瓶子：<span class=\"jump items\" data-view=\"items\" data-detail=\"鬼眼法刀@540\" title=\"在物品大全中打開\">鬼眼法刀</span>（隱藏）。</li><li>入口右上屋子左邊罈子：<span class=\"jump items\" data-view=\"items\" data-detail=\"星君眼@939\" title=\"在物品大全中打開\">星君眼</span>（隱藏，攻擊加 50%）。</li><li>賽特和悟緣說話的屋子：<span class=\"jump items\" data-view=\"items\" data-detail=\"俱樂部會員卡@821\" title=\"在物品大全中打開\">俱樂部會員卡</span>（隱藏）<span class=\"tag domo\">DOMO</span>；出來後的寶箱有<span class=\"jump items\" data-view=\"items\" data-detail=\"竹筒@816\" title=\"在物品大全中打開\">竹筒</span>。</li><li>再往右上的屋子右邊桌子：<span class=\"jump items\" data-view=\"items\" data-detail=\"機關設計圖６@781\" title=\"在物品大全中打開\">機關設計圖６</span>（隱藏）；門前破櫃子：<span class=\"jump items\" data-view=\"items\" data-detail=\"乾坤袋@943\" title=\"在物品大全中打開\">乾坤袋</span>（隱藏，偷竊指令）。</li><li>寶箱：<span class=\"jump items\" data-view=\"items\" data-detail=\"金創藥@628\" title=\"在物品大全中打開\">金創藥</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"硫磺@813\" title=\"在物品大全中打開\">硫磺</span>（入口正中往上的屋子）、<span class=\"jump items\" data-view=\"items\" data-detail=\"海檬果@721\" title=\"在物品大全中打開\">海檬果</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"啻浪奇甲@859\" title=\"在物品大全中打開\">啻浪奇甲</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"土地神符@696\" title=\"在物品大全中打開\">土地神符</span>。</li><li>地上：<span class=\"jump items\" data-view=\"items\" data-detail=\"香柏葉@670\" title=\"在物品大全中打開\">香柏葉</span>。</li></ul><h3>炸開的山壁</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"靈虛扇@930\" title=\"在物品大全中打開\">靈虛扇</span>（淨化所有異常狀態）。</li><li>封印之光：<span class=\"jump items\" data-view=\"items\" data-detail=\"封印之劍@793\" title=\"在物品大全中打開\">封印之劍</span>（13）。</li></ul><h3>偷竊</h3><ul><li><span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"冥府獄卒@267\" title=\"在神魔異事錄中打開\">冥府獄卒</span>可偷<span class=\"jump items\" data-view=\"items\" data-detail=\"河車丸@662\" title=\"在物品大全中打開\">河車丸</span>，<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"瘟鬼@273\" title=\"在神魔異事錄中打開\">瘟鬼</span>可偷<span class=\"jump items\" data-view=\"items\" data-detail=\"七葉蓮@661\" title=\"在物品大全中打開\">七葉蓮</span>。</li><li>救下食屍鬼會出現<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"白無常@194\" title=\"在神魔異事錄中打開\">白無常</span>。</li></ul>"}, {"chapter": "大唐", "title": "王大善人家", "text": "王大善人家\n# 流程\n長安城內第二排右側。慧榮治好悟緣 → 和王善人說話 → 夜裡和王思月賞月，她送賽特白玉飛天珮 → 打敗黃雷的羯羊妖機，得機關設計圖５ → 黃雷炸毀王家，王思月逃出，送她到白連儀家 → 次日和白連儀進宮，皇上去了驪山。\n# 偷竊\n- 羯羊妖機可偷活靈芝（體力 +100）。\n# DOMO工作室\n王家被炸毀後，廢墟右下角的涼亭就是 DOMO 工作室，見«DOMO工作室»。", "html": "<h3>流程</h3><p>長安城內第二排右側。慧榮治好悟緣 → 和王善人說話 → 夜裡和王思月賞月，她送賽特<span class=\"jump items\" data-view=\"items\" data-detail=\"白玉飛天珮@992\" title=\"在物品大全中打開\">白玉飛天珮</span> → 打敗黃雷的<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"羯羊妖機@51\" title=\"在神魔異事錄中打開\">羯羊妖機</span>，得<span class=\"jump items\" data-view=\"items\" data-detail=\"機關設計圖５@780\" title=\"在物品大全中打開\">機關設計圖５</span> → 黃雷炸毀王家，王思月逃出，送她到白連儀家 → 次日和白連儀進宮，皇上去了驪山。</p><h3>偷竊</h3><ul><li><span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"羯羊妖機@51\" title=\"在神魔異事錄中打開\">羯羊妖機</span>可偷<span class=\"jump items\" data-view=\"items\" data-detail=\"活靈芝@689\" title=\"在物品大全中打開\">活靈芝</span>（體力 +100）。</li></ul><h3>DOMO工作室</h3><p>王家被炸毀後，廢墟右下角的涼亭就是 DOMO 工作室，見<span class=\"goto\" data-title=\"DOMO工作室\">DOMO工作室</span>。</p>"}, {"chapter": "大唐", "title": "驪山", "text": "驪山\n# 流程\n長安城東南。白連儀先去參加宴會 → 上台階後從左側進山間（驪山樹林） → 祭壇打敗雨丹子五鬼，得天山通行符（白連儀家的天山壁畫成為傳送點）、暗黑魔樽（抗暗 80%） → 闖入皇帝的宴會，結識林明 → 回白府，和林明密議夜探東平郡王府 → 悟緣傳話白府出事，王思月被黑壇教抓走 → 趕往洛陽道觀。\n# 驪山樹林\n- 寶箱：人像圖冊（下面）DOMO、鉤鐮槍。\n- 隱藏：金創藥（江采蘋詩碑下方的樹叢）、神祕果（左下樹叢）、象綿盔（封印之劍右側空地下方的樹叢）、還靈丹（右上過道中間右側）。\n- 封印之光：封印之劍（14）。\n# 偷竊與靈契\n- 靈契蠶女DOMO，可偷嘉果。\n- 雪芙可偷還靈丹，雨丹子五鬼可偷暗黑修羅砧。\n- 迷魂霧妖只吃光系和火系攻擊，可用來練封印之劍的熟練度。\n# 這時順便\n- 去洛陽回春堂買破元仙露（救嫦娥用）和新藥材。\n- 魔晶礦、機關設計圖、神津珍譜的交換，最晚要在洛陽道觀之後、夜探安祿山府之前做完。", "html": "<h3>流程</h3><p>長安城東南。白連儀先去參加宴會 → 上台階後從左側進山間（驪山樹林） → 祭壇打敗<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"雨丹子五鬼@53\" title=\"在神魔異事錄中打開\">雨丹子五鬼</span>，得<span class=\"jump items\" data-view=\"items\" data-detail=\"天山通行符@807\" title=\"在物品大全中打開\">天山通行符</span>（白連儀家的天山壁畫成為傳送點）、<span class=\"jump items\" data-view=\"items\" data-detail=\"暗黑魔樽@949\" title=\"在物品大全中打開\">暗黑魔樽</span>（抗暗 80%） → 闖入皇帝的宴會，結識林明 → 回白府，和林明密議夜探東平郡王府 → 悟緣傳話白府出事，王思月被黑壇教抓走 → 趕往洛陽道觀。</p><h3>驪山樹林</h3><ul><li>寶箱：<span class=\"jump items\" data-view=\"items\" data-detail=\"人像圖冊@827\" title=\"在物品大全中打開\">人像圖冊</span>（下面）<span class=\"tag domo\">DOMO</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"鉤鐮槍@558\" title=\"在物品大全中打開\">鉤鐮槍</span>。</li><li>隱藏：<span class=\"jump items\" data-view=\"items\" data-detail=\"金創藥@628\" title=\"在物品大全中打開\">金創藥</span>（江采蘋詩碑下方的樹叢）、<span class=\"jump items\" data-view=\"items\" data-detail=\"神祕果@729\" title=\"在物品大全中打開\">神祕果</span>（左下樹叢）、<span class=\"jump items\" data-view=\"items\" data-detail=\"象綿盔@897\" title=\"在物品大全中打開\">象綿盔</span>（封印之劍右側空地下方的樹叢）、<span class=\"jump items\" data-view=\"items\" data-detail=\"還靈丹@639\" title=\"在物品大全中打開\">還靈丹</span>（右上過道中間右側）。</li><li>封印之光：<span class=\"jump items\" data-view=\"items\" data-detail=\"封印之劍@793\" title=\"在物品大全中打開\">封印之劍</span>（14）。</li></ul><h3>偷竊與靈契</h3><ul><li>靈契<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"蠶女@155\" title=\"在神魔異事錄中打開\">蠶女</span><span class=\"tag domo\">DOMO</span>，可偷<span class=\"jump items\" data-view=\"items\" data-detail=\"嘉果@630\" title=\"在物品大全中打開\">嘉果</span>。</li><li><span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"雪芙@253\" title=\"在神魔異事錄中打開\">雪芙</span>可偷<span class=\"jump items\" data-view=\"items\" data-detail=\"還靈丹@639\" title=\"在物品大全中打開\">還靈丹</span>，<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"雨丹子五鬼@53\" title=\"在神魔異事錄中打開\">雨丹子五鬼</span>可偷<span class=\"jump items\" data-view=\"items\" data-detail=\"暗黑修羅砧@717\" title=\"在物品大全中打開\">暗黑修羅砧</span>。</li><li><span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"迷魂霧妖@317\" title=\"在神魔異事錄中打開\">迷魂霧妖</span>只吃光系和火系攻擊，可用來練封印之劍的熟練度。</li></ul><h3>這時順便</h3><ul><li>去洛陽回春堂買<span class=\"jump items\" data-view=\"items\" data-detail=\"破元仙露@658\" title=\"在物品大全中打開\">破元仙露</span>（救嫦娥用）和新藥材。</li><li>魔晶礦、機關設計圖、神津珍譜的交換，最晚要在洛陽道觀之後、夜探安祿山府之前做完。</li></ul>"}, {"chapter": "大唐", "title": "洛陽道觀", "text": "洛陽道觀\n# 流程\n洛陽左上郊外。遇俠客張客，結伴闖道觀 → 二樓把圓珠、太極圖、天扇放到銅鼎後方的壁畫上，打開通往三樓的柵門 → 三樓地上的太極圖可互相傳送 → 四樓抽籤拿控屍符，控制兩台機關人移到太極圖上，打開通往頂樓的柵門 → 頂樓打敗被控制的王思月（前幾回合無敵，等張客破解法術再清掉周圍的鬼魂），再打敗雨丹子，收進煉妖壺 → 送王思月回長安。\n# 一樓\n- 寶箱：太皇刀─閻天（進門左側）、神津珍譜─肆（左側）、圓珠（右側）。\n# 二樓\n- 寶箱：竹葉符衣（下面）、太極圖（左下）、多魔遊戲軟體（左上）DOMO、天扇（右上）。\n- 寶箱：嫦娥（右下，給她破元仙露，嫦娥加入）DOMO。\n- 隱藏：歌唱的胡桃（左上半透明的門後）、密茹之水（右上半透明的門後）。\n# 三樓\n- 寶箱：夜叉肩帶（左上，冥想指令）、金創藥、青電臂。\n# 四樓\n- 先踩踏板，再調查機關人，然後到籤筒抽籤、到解籤架解籤，不滿意可以不解直接重抽：\n- 「陳王……」：得 100 銀幣。\n- 「有兔……」：和戰死屍鬼戰鬥；封印蚩尤之後會接著打牛魔王，見«牛魔王與DOMO神打功»。\n- 「錢財乃身外之物……」：損失 100 銀幣。\n- 「山中何所有……」：得藥草。\n- 控屍符一次只能拿一張，用完要再抽。\n# 頂樓\n- 寶箱：輪迴盤。\n- 封印之光：封印之劍（15）。\n# 偷竊\n- 教眾長老可偷鹿茸膏，妖燈鬼可偷羅剎食日鈸。\n# 提示\n這時去長安，是安史之亂前最後的機會。", "html": "<h3>流程</h3><p>洛陽左上郊外。遇俠客張客，結伴闖道觀 → 二樓把圓珠、太極圖、天扇放到銅鼎後方的壁畫上，打開通往三樓的柵門 → 三樓地上的太極圖可互相傳送 → 四樓抽籤拿<span class=\"jump items\" data-view=\"items\" data-detail=\"控屍符@798\" title=\"在物品大全中打開\">控屍符</span>，控制兩台機關人移到太極圖上，打開通往頂樓的柵門 → 頂樓打敗被控制的<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"王思月@39\" title=\"在神魔異事錄中打開\">王思月</span>（前幾回合無敵，等張客破解法術再清掉周圍的鬼魂），再打敗<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"雨丹子@32\" title=\"在神魔異事錄中打開\">雨丹子</span>，收進煉妖壺 → 送王思月回長安。</p><h3>一樓</h3><ul><li>寶箱：<span class=\"jump items\" data-view=\"items\" data-detail=\"太皇刀─閻天@545\" title=\"在物品大全中打開\">太皇刀─閻天</span>（進門左側）、<span class=\"jump items\" data-view=\"items\" data-detail=\"神津珍譜─肆@785\" title=\"在物品大全中打開\">神津珍譜─肆</span>（左側）、<span class=\"jump items\" data-view=\"items\" data-detail=\"圓珠@795\" title=\"在物品大全中打開\">圓珠</span>（右側）。</li></ul><h3>二樓</h3><ul><li>寶箱：<span class=\"jump items\" data-view=\"items\" data-detail=\"竹葉符衣@1013\" title=\"在物品大全中打開\">竹葉符衣</span>（下面）、<span class=\"jump items\" data-view=\"items\" data-detail=\"太極圖@796\" title=\"在物品大全中打開\">太極圖</span>（左下）、<span class=\"jump items\" data-view=\"items\" data-detail=\"多魔遊戲軟體@823\" title=\"在物品大全中打開\">多魔遊戲軟體</span>（左上）<span class=\"tag domo\">DOMO</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"天扇@797\" title=\"在物品大全中打開\">天扇</span>（右上）。</li><li>寶箱：<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"嫦娥@150\" title=\"在神魔異事錄中打開\">嫦娥</span>（右下，給她<span class=\"jump items\" data-view=\"items\" data-detail=\"破元仙露@658\" title=\"在物品大全中打開\">破元仙露</span>，嫦娥加入）<span class=\"tag domo\">DOMO</span>。</li><li>隱藏：<span class=\"jump items\" data-view=\"items\" data-detail=\"歌唱的胡桃@676\" title=\"在物品大全中打開\">歌唱的胡桃</span>（左上半透明的門後）、<span class=\"jump items\" data-view=\"items\" data-detail=\"密茹之水@685\" title=\"在物品大全中打開\">密茹之水</span>（右上半透明的門後）。</li></ul><h3>三樓</h3><ul><li>寶箱：<span class=\"jump items\" data-view=\"items\" data-detail=\"夜叉肩帶@941\" title=\"在物品大全中打開\">夜叉肩帶</span>（左上，冥想指令）、<span class=\"jump items\" data-view=\"items\" data-detail=\"金創藥@628\" title=\"在物品大全中打開\">金創藥</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"青電臂@881\" title=\"在物品大全中打開\">青電臂</span>。</li></ul><h3>四樓</h3><ul><li>先踩踏板，再調查機關人，然後到籤筒抽籤、到解籤架解籤，不滿意可以不解直接重抽：</li><li>「陳王……」：得 100 銀幣。</li><li>「有兔……」：和<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"戰死屍鬼@167\" title=\"在神魔異事錄中打開\">戰死屍鬼</span>戰鬥；封印蚩尤之後會接著打<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"牛魔王@59\" title=\"在神魔異事錄中打開\">牛魔王</span>，見<span class=\"goto\" data-title=\"牛魔王與DOMO神打功\">牛魔王與DOMO神打功</span>。</li><li>「錢財乃身外之物……」：損失 100
