jump items\" data-view=\"items\" data-detail=\"機關設計圖３@778\" title=\"在物品大全中打開\">機關設計圖３</span>：黃八後面左上第二間屋子的桌子（隱藏）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"神津珍譜─伍@786\" title=\"在物品大全中打開\">神津珍譜─伍</span>：豐饒之角上面那間屋子，右側櫃子（隱藏）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"名歌星ＣＤ@819\" title=\"在物品大全中打開\">名歌星ＣＤ</span>：寶箱，總入口一直往右 <span class=\"tag domo\">DOMO</span></li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"炭粉@814\" title=\"在物品大全中打開\">炭粉</span>：寶箱，總入口上行右邊</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"硝石@812\" title=\"在物品大全中打開\">硝石</span>：寶箱，右行往上的屋子</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"金創藥@628\" title=\"在物品大全中打開\">金創藥</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"還魄丹@644\" title=\"在物品大全中打開\">還魄丹</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"豐饒之角@671\" title=\"在物品大全中打開\">豐饒之角</span>：寶箱（體力 +50）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"聖石榴@623\" title=\"在物品大全中打開\">聖石榴</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"七葉蓮@661\" title=\"在物品大全中打開\">七葉蓮</span>：地上</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"柴胡乾葛草@650\" title=\"在物品大全中打開\">柴胡乾葛草</span>：地上</li></ul><h3>第二區</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"姜公膽@940\" title=\"在物品大全中打開\">姜公膽</span>：進去後左邊很大的白色破罈子（隱藏，連擊指令）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"鬼眼法刀@540\" title=\"在物品大全中打開\">鬼眼法刀</span>：入口左上屋子，右邊瓶子（隱藏）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"星君眼@939\" title=\"在物品大全中打開\">星君眼</span>：入口右上屋子，左邊罈子（隱藏，攻擊加 50%）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"俱樂部會員卡@821\" title=\"在物品大全中打開\">俱樂部會員卡</span>：賽特和悟緣說話的屋子（隱藏）<span class=\"tag domo\">DOMO</span></li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"竹筒@816\" title=\"在物品大全中打開\">竹筒</span>：寶箱，賽特和悟緣說話的屋子外</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"機關設計圖６@781\" title=\"在物品大全中打開\">機關設計圖６</span>：再往右上的屋子，右邊桌子（隱藏）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"乾坤袋@943\" title=\"在物品大全中打開\">乾坤袋</span>：同一間屋子門前的破櫃子（隱藏，偷竊指令）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"硫磺@813\" title=\"在物品大全中打開\">硫磺</span>：寶箱，入口正中往上的屋子</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"金創藥@628\" title=\"在物品大全中打開\">金創藥</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"海檬果@721\" title=\"在物品大全中打開\">海檬果</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"啻浪奇甲@859\" title=\"在物品大全中打開\">啻浪奇甲</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"土地神符@696\" title=\"在物品大全中打開\">土地神符</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"香柏葉@670\" title=\"在物品大全中打開\">香柏葉</span>：地上</li></ul><h3>炸開的山壁</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"靈虛扇@930\" title=\"在物品大全中打開\">靈虛扇</span>：淨化所有異常狀態</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"封印之劍@793\" title=\"在物品大全中打開\">封印之劍</span>（13）：封印之光</li></ul><h3>偷竊</h3><ul><li><span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"冥府獄卒@267\" title=\"在神魔異事錄中打開\">冥府獄卒</span>可偷<span class=\"jump items\" data-view=\"items\" data-detail=\"河車丸@662\" title=\"在物品大全中打開\">河車丸</span>。</li><li><span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"瘟鬼@273\" title=\"在神魔異事錄中打開\">瘟鬼</span>可偷<span class=\"jump items\" data-view=\"items\" data-detail=\"七葉蓮@661\" title=\"在物品大全中打開\">七葉蓮</span>。</li><li>救下食屍鬼，會出現<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"白無常@194\" title=\"在神魔異事錄中打開\">白無常</span>。</li></ul>"}, {"chapter": "大唐", "title": "王大善人家", "text": "王大善人家\n# 流程\n1. 王大善人家在長安城內第二排右側。慧榮治好悟緣。\n2. 和王善人說話。\n3. 夜裡和王思月賞月，她送賽特白玉飛天珮。\n4. 打敗黃雷的羯羊妖機，得機關設計圖５。\n5. 黃雷炸毀王家，王思月逃出，把她送到白連儀家。\n6. 次日和白連儀進宮，皇上去了驪山。\n# 偷竊\n- 羯羊妖機可偷活靈芝（體力 +100）。\n# DOMO工作室\n- 王家被炸毀後，廢墟右下角的涼亭就是 DOMO 工作室，見«DOMO工作室»。", "html": "<h3>流程</h3><ol><li>王大善人家在長安城內第二排右側。慧榮治好悟緣。</li><li>和王善人說話。</li><li>夜裡和王思月賞月，她送賽特<span class=\"jump items\" data-view=\"items\" data-detail=\"白玉飛天珮@992\" title=\"在物品大全中打開\">白玉飛天珮</span>。</li><li>打敗黃雷的<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"羯羊妖機@51\" title=\"在神魔異事錄中打開\">羯羊妖機</span>，得<span class=\"jump items\" data-view=\"items\" data-detail=\"機關設計圖５@780\" title=\"在物品大全中打開\">機關設計圖５</span>。</li><li>黃雷炸毀王家，王思月逃出，把她送到白連儀家。</li><li>次日和白連儀進宮，皇上去了驪山。</li></ol><h3>偷竊</h3><ul><li><span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"羯羊妖機@51\" title=\"在神魔異事錄中打開\">羯羊妖機</span>可偷<span class=\"jump items\" data-view=\"items\" data-detail=\"活靈芝@689\" title=\"在物品大全中打開\">活靈芝</span>（體力 +100）。</li></ul><h3>DOMO工作室</h3><ul><li>王家被炸毀後，廢墟右下角的涼亭就是 DOMO 工作室，見<span class=\"goto\" data-title=\"DOMO工作室\">DOMO工作室</span>。</li></ul>"}, {"chapter": "大唐", "title": "驪山", "text": "驪山\n# 流程\n1. 驪山在長安城東南。白連儀先去參加宴會。\n2. 上台階後從左側進入驪山樹林。\n3. 在祭壇打敗雨丹子五鬼，得天山通行符、暗黑魔樽（抗暗 80%）。白連儀家的天山壁畫從此成為傳送點。\n4. 闖入皇帝的宴會，結識林明。\n5. 回白府，和林明密議夜探東平郡王府。\n6. 悟緣傳話白府出事，王思月被黑壇教抓走。\n7. 趕往洛陽道觀。\n# 驪山樹林\n- 人像圖冊：寶箱，下面 DOMO\n- 鉤鐮槍：寶箱\n- 金創藥：江采蘋詩碑下方的樹叢（隱藏）\n- 神祕果：左下樹叢（隱藏）\n- 象綿盔：封印之劍右側空地，下方樹叢（隱藏）\n- 還靈丹：右上過道中間右側（隱藏）\n- 封印之劍（14）：封印之光\n# 偷竊與靈契\n- 靈契蠶女DOMO，可偷嘉果。\n- 雪芙可偷還靈丹。\n- 雨丹子五鬼可偷暗黑修羅砧。\n- 迷魂霧妖只吃光系和火系攻擊，可用來練封印之劍的熟練度。\n# 這時順便\n- 去洛陽回春堂買破元仙露（救嫦娥用）和新藥材。\n- «魔晶礦»、«機關設計圖»、«神津珍譜»的交換，最晚要在洛陽道觀之後、夜探安祿山府之前做完。", "html": "<h3>流程</h3><ol><li>驪山在長安城東南。白連儀先去參加宴會。</li><li>上台階後從左側進入驪山樹林。</li><li>在祭壇打敗<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"雨丹子五鬼@53\" title=\"在神魔異事錄中打開\">雨丹子五鬼</span>，得<span class=\"jump items\" data-view=\"items\" data-detail=\"天山通行符@807\" title=\"在物品大全中打開\">天山通行符</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"暗黑魔樽@949\" title=\"在物品大全中打開\">暗黑魔樽</span>（抗暗 80%）。白連儀家的天山壁畫從此成為傳送點。</li><li>闖入皇帝的宴會，結識林明。</li><li>回白府，和林明密議夜探東平郡王府。</li><li>悟緣傳話白府出事，王思月被黑壇教抓走。</li><li>趕往洛陽道觀。</li></ol><h3>驪山樹林</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"人像圖冊@827\" title=\"在物品大全中打開\">人像圖冊</span>：寶箱，下面 <span class=\"tag domo\">DOMO</span></li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"鉤鐮槍@558\" title=\"在物品大全中打開\">鉤鐮槍</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"金創藥@628\" title=\"在物品大全中打開\">金創藥</span>：江采蘋詩碑下方的樹叢（隱藏）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"神祕果@729\" title=\"在物品大全中打開\">神祕果</span>：左下樹叢（隱藏）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"象綿盔@897\" title=\"在物品大全中打開\">象綿盔</span>：封印之劍右側空地，下方樹叢（隱藏）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"還靈丹@639\" title=\"在物品大全中打開\">還靈丹</span>：右上過道中間右側（隱藏）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"封印之劍@793\" title=\"在物品大全中打開\">封印之劍</span>（14）：封印之光</li></ul><h3>偷竊與靈契</h3><ul><li>靈契<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"蠶女@155\" title=\"在神魔異事錄中打開\">蠶女</span><span class=\"tag domo\">DOMO</span>，可偷<span class=\"jump items\" data-view=\"items\" data-detail=\"嘉果@630\" title=\"在物品大全中打開\">嘉果</span>。</li><li><span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"雪芙@253\" title=\"在神魔異事錄中打開\">雪芙</span>可偷<span class=\"jump items\" data-view=\"items\" data-detail=\"還靈丹@639\" title=\"在物品大全中打開\">還靈丹</span>。</li><li><span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"雨丹子五鬼@53\" title=\"在神魔異事錄中打開\">雨丹子五鬼</span>可偷<span class=\"jump items\" data-view=\"items\" data-detail=\"暗黑修羅砧@717\" title=\"在物品大全中打開\">暗黑修羅砧</span>。</li><li><span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"迷魂霧妖@317\" title=\"在神魔異事錄中打開\">迷魂霧妖</span>只吃光系和火系攻擊，可用來練封印之劍的熟練度。</li></ul><h3>這時順便</h3><ul><li>去洛陽回春堂買<span class=\"jump items\" data-view=\"items\" data-detail=\"破元仙露@658\" title=\"在物品大全中打開\">破元仙露</span>（救嫦娥用）和新藥材。</li><li><span class=\"goto\" data-title=\"魔晶礦\">魔晶礦</span>、<span class=\"goto\" data-title=\"機關設計圖\">機關設計圖</span>、<span class=\"goto\" data-title=\"神津珍譜\">神津珍譜</span>的交換，最晚要在洛陽道觀之後、夜探安祿山府之前做完。</li></ul>"}, {"chapter": "大唐", "title": "洛陽道觀", "text": "洛陽道觀\n# 流程\n1. 道觀在洛陽左上郊外。遇到俠客張客，結伴闖道觀。\n2. 二樓：把圓珠、太極圖、天扇放到銅鼎後方的壁畫上，打開通往三樓的柵門。\n3. 三樓：地上的太極圖可以互相傳送。\n4. 四樓：抽籤拿控屍符，控制兩台機關人移到太極圖上，打開通往頂樓的柵門。\n5. 頂樓：打敗被控制的王思月。前幾回合她無敵，等張客破解法術，再清掉周圍的鬼魂。\n6. 打敗雨丹子，收進煉妖壺。\n7. 送王思月回長安。\n# 一樓\n- 太皇刀─閻天：寶箱，進門左側\n- 神津珍譜─肆：寶箱，左側\n- 圓珠：寶箱，右側\n# 二樓\n- 竹葉符衣：寶箱，下面\n- 太極圖：寶箱，左下\n- 多魔遊戲軟體：寶箱，左上 DOMO\n- 天扇：寶箱，右上\n- 嫦娥：寶箱，右下；給她破元仙露，嫦娥加入 DOMO\n- 歌唱的胡桃：左上半透明的門後（隱藏）\n- 密茹之水：右上半透明的門後（隱藏）\n# 三樓\n- 夜叉肩帶：寶箱，左上（冥想指令）\n- 金創藥：寶箱\n- 青電臂：寶箱\n# 四樓\n1. 先踩踏板，再調查機關人。沒調查過機關人，籤桶不讓抽。\n2. 到籤桶抽籤，再到解籤架解籤。不滿意可以不解，直接重抽。\n3. 拿到控屍符後，要先把一台機關人移到太極圖上，才能再抽。\n# 四樓的籤\n六支平均隨機。\n- 「青春受謝……」：得控屍符；拿過一次後變成「錢財乃身外之物」\n- 「薔上露……」：得控屍符；拿過一次後變成「有兔爰爰」\n- 「有兔爰爰……」：和戰死屍鬼戰鬥；打過蚩尤後換成牛魔王，見«牛魔王與DOMO神打功»\n- 「山中何所有……」：得藥草\n- 「陳王昔時宴平樂……」：得 100 銀幣\n- 「錢財乃身外之物……」：損失 100 銀幣\n# 頂樓\n- 輪迴盤：寶箱\n- 封印之劍（15）：封印之光\n# 偷竊\n- 教眾長老可偷鹿茸膏。\n- 妖燈鬼可偷羅剎食日鈸。\n# 提示\n- 這時去長安，是安史之亂前最後的機會。", "html": "<h3>流程</h3><ol><li>道觀在洛陽左上郊外。遇到俠客張客，結伴闖道觀。</li><li>二樓：把圓珠、太極圖、天扇放到銅鼎後方的壁畫上，打開通往三樓的柵門。</li><li>三樓：地上的太極圖可以互相傳送。</li><li>四樓：抽籤拿<span class=\"jump items\" data-view=\"items\" data-detail=\"控屍符@798\" title=\"在物品大全中打開\">控屍符</span>，控制兩台機關人移到太極圖上，打開通往頂樓的柵門。</li><li>頂樓：打敗被控制的<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"王思月@39\" title=\"在神魔異事錄中打開\">王思月</span>。前幾回合她無敵，等張客破解法術，再清掉周圍的鬼魂。</li><li>打敗<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"雨丹子@32\" title=\"在神魔異事錄中打開\">雨丹子</span>，收進煉妖壺。</li><li>送王思月回長安。</li></ol><h3>一樓</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"太皇刀─閻天@545\" title=\"在物品大全中打開\">太皇刀─閻天</span>：寶箱，進門左側</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"神津珍譜─肆@785\" title=\"在物品大全中打開\">神津珍譜─肆</span>：寶箱，左側</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"圓珠@795\" title=\"在物品大全中打開\">圓珠</span>：寶箱，右側</li></ul><h3>二樓</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"竹葉符衣@1013\" title=\"在物品大全中打開\">竹葉符衣</span>：寶箱，下面</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"太極圖@796\" title=\"在物品大全中打開\">太極圖</span>：寶箱，左下</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"多魔遊戲軟體@823\" title=\"在物品大全中打開\">多魔遊戲軟體</span>：寶箱，左上 <span class=\"tag domo\">DOMO</span></li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"天扇@797\" title=\"在物品大全中打開\">天扇</span>：寶箱，右上</li><li><span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"嫦娥@150\" title=\"在神魔異事錄中打開\">嫦娥</span>：寶箱，右下；給她<span class=\"jump items\" data-view=\"items\" data-detail=\"破元仙露@658\" title=\"在物品大全中打開\">破元仙露</span>，嫦娥加入 <span class=\"tag domo\">DOMO</span></li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"歌唱的胡桃@676\" title=\"在物品大全中打開\">歌唱的胡桃</span>：左上半透明的門後（隱藏）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"密茹之水@685\" title=\"在物品大全中打開\">密茹之水</span>：右上半透明的門後（隱藏）</li></ul><h3>三樓</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"夜叉肩帶@941\" title=\"在物品大全中打開\">夜叉肩帶</span>：寶箱，左上（冥想指令）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"金創藥@628\" title=\"在物品大全中打開\">金創藥</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"青電臂@881\" title=\"在物品大全中打開\">青電臂</span>：寶箱</li></ul><h3>四樓</h3><ol><li>先踩踏板，再調查機關人。沒調查過機關人，籤桶不讓抽。</li><li>到籤桶抽籤，再到解籤架解籤。不滿意可以不解，直接重抽。</li><li>拿到<span class=\"jump items\" data-view=\"items\" data-detail=\"控屍符@798\" title=\"在物品大全中打開\">控屍符</span>後，要先把一台機關人移到太極圖上，才能再抽。</li></ol><h3>四樓的籤</h3><p>六支平均隨機。</p><ul><li>「青春受謝……」：得<span class=\"jump items\" data-view=\"items\" data-detail=\"控屍符@798\" title=\"在物品大全中打開\">控屍符</span>；拿過一次後變成「錢財乃身外之物」</li><li>「薔上露……」：得<span class=\"jump items\" data-view=\"items\" data-detail=\"控屍符@798\" title=\"在物品大全中打開\">控屍符</span>；拿過一次後變成「有兔爰爰」</li><li>「有兔爰爰……」：和<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"戰死屍鬼@167\" title=\"在神魔異事錄中打開\">戰死屍鬼</span>戰鬥；打過蚩尤後換成<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"牛魔王@59\" title=\"在神魔異事錄中打開\">牛魔王</span>，見<span class=\"goto\" data-title=\"牛魔王與DOMO神打功\">牛魔王與DOMO神打功</span></li><li>「山中何所有……」：得<span class=\"jump items\" data-view=\"items\" data-detail=\"藥草@621\" title=\"在物品大全中打開\">藥草</span></li><li>「陳王昔時宴平樂……」：得 100 銀幣</li><li>「錢財乃身外之物……」：損失 100 銀幣</li></ul><h3>頂樓</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"輪迴盤@645\" title=\"在物品大全中打開\">輪迴盤</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"封印之劍@793\" title=\"在物品大全中打開\">封印之劍</span>（15）：封印之光</li></ul><h3>偷竊</h3><ul><li><span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"教眾長老@380\" title=\"在神魔異事錄中打開\">教眾長老</span>可偷<span class=\"jump items\" data-view=\"items\" data-detail=\"鹿茸膏@631\" title=\"在物品大全中打開\">鹿茸膏</span>。</li><li><span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"妖燈鬼@316\" title=\"在神魔異事錄中打開\">妖燈鬼</span>可偷<span class=\"jump items\" data-view=\"items\" data-detail=\"羅剎食日鈸@712\" title=\"在物品大全中打開\">羅剎食日鈸</span>。</li></ul><h3>提示</h3><ul><li>這時去長安，是安史之亂前最後的機會。</li></ul>"}, {"chapter": "大唐", "title": "安祿山府", "text": "安祿山府\n# 流程\n1. 在白府大廳和林明密謀，夜裡潛入東平郡王府。\n2. 大廳左側遇到榮義郡主，和她說話可補滿體力。\n3. 東廂房打敗變成莉蓮的美杜莎。\n4. 西廂房發現被石化的慧榮、張客，賽特耗盡靈力和體力使用解石化符。\n5. 打敗偷襲的康那里士。\n6. 四樓拿安祿山軍令。\n7. 到內院黃雷的房間，調查右邊的櫃子，出現密道。\n8. 王思月潛入殺了黃雷。\n9. 見到唐玄宗，慧榮自殺殉國。\n10. 賽特單挑打敗麥爾斯，毀了他的肉身。\n11. 最後被撒旦所殺。\n# 注意\n- 在撒旦第二次攻擊前就把它打死，遊戲會卡住，武器別改得太強。\n- 進府前把妮可身上的重要法寶卸下，她之後會離隊。\n- 除了密道，王府裡的東西全部是隱藏的，要逐一調查。\n# 入口\n- 青龍水珠：二門左側石龍腹中，做完長安的「老郭的寶物」才有\n# 大廳\n- 活骨靈藥：榮義郡主上方的書架\n- 活靈芝：右側櫃子左側的金礦\n- 硃砂辟魔玉：最右邊的珠寶堆（隱形指令）\n# 廂房\n- 狂獅戰腕：東廂房，中間的櫃子\n- 金塊：西廂房，左上箱子處\n- 蜜乳樹汁：西廂房，最右邊的罐子\n- 天珠武鎧：北廂房，左側箱子\n- 太皇刀─綠痕：北廂房，右側櫃子\n- 起兵計劃書：南廂房，左下箱子\n- 蒼蟒錦衣：南廂房，右上珠寶堆\n# 樓上\n- 純鈞：二樓，入口左側的大油燈\n- 光紗天衣：二樓，左側珠寶堆\n- 二樓的雨師向你要雷公鎚。\n- 朱雀火羽：三樓，右側桌子（抗火 100%）\n- 安祿山軍令：四樓，右下屏風\n# 內院\n- 碧英之腕：珠寶堆\n- 封印之劍（16）：封印之光\n# 王府密道\n- 如意金箍棒：寶箱，打敗鬥戰聖佛後得到\n- 靈蛇手套：寶箱\n- 紫金冠：寶箱\n- 雷公鎚：寶箱（抗電 80%）\n# 支線：風伯\n1. 密道裡有一個箱子關著風伯，他要乾坤袋。\n2. 給他後，卡瑪學會「風伯見日」。\n3. 要等卡瑪學會「元極四方」之後再給，否則學不到元極四方。\n# 支線：雨師\n1. 把雷公鎚拿回二樓給雨師。\n2. 李靖學會「雨師興浪」。\n3. 要等李靖學會「真武神威」之後再給。雷公鎚打蚩尤時也用得上。\n# 偷竊與靈契\n- 靈契七仙女DOMO，可偷靈樞玉液。\n- 娥皇可偷蟠桃（全體回復生命 100%）。\n- 女英可偷金元五體丹。\n- 雪女可偷紫玉冰晶。\n- 美杜莎可偷溶石藥劑。", "html": "<h3>流程</h3><ol><li>在白府大廳和林明密謀，夜裡潛入東平郡王府。</li><li>大廳左側遇到榮義郡主，和她說話可補滿體力。</li><li>東廂房打敗變成莉蓮的<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"美杜莎@135\" title=\"在神魔異事錄中打開\">美杜莎</span>。</li><li>西廂房發現被石化的慧榮、張客，賽特耗盡靈力和體力使用<span class=\"jump items\" data-view=\"items\" data-detail=\"解石化符@809\" title=\"在物品大全中打開\">解石化符</span>。</li><li>打敗偷襲的<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"康那里士@7\" title=\"在神魔異事錄中打開\">康那里士</span>。</li><li>四樓拿<span class=\"jump items\" data-view=\"items\" data-detail=\"安祿山軍令@811\" title=\"在物品大全中打開\">安祿山軍令</span>。</li><li>到內院黃雷的房間，調查右邊的櫃子，出現密道。</li><li>王思月潛入殺了黃雷。</li><li>見到唐玄宗，慧榮自殺殉國。</li><li>賽特單挑打敗<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"麥爾斯@4\" title=\"在神魔異事錄中打開\">麥爾斯</span>，毀了他的肉身。</li><li>最後被<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"撒旦@28\" title=\"在神魔異事錄中打開\">撒旦</span>所殺。</li></ol><h3>注意</h3><ul><li>在撒旦第二次攻擊前就把它打死，遊戲會卡住，武器別改得太強。</li><li>進府前把妮可身上的重要法寶卸下，她之後會離隊。</li><li>除了密道，王府裡的東西全部是隱藏的，要逐一調查。</li></ul><h3>入口</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"青龍水珠@944\" title=\"在物品大全中打開\">青龍水珠</span>：二門左側石龍腹中，做完長安的「老郭的寶物」才有</li></ul><h3>大廳</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"活骨靈藥@691\" title=\"在物品大全中打開\">活骨靈藥</span>：榮義郡主上方的書架</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"活靈芝@689\" title=\"在物品大全中打開\">活靈芝</span>：右側櫃子左側的金礦</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"硃砂辟魔玉@951\" title=\"在物品大全中打開\">硃砂辟魔玉</span>：最右邊的珠寶堆（隱形指令）</li></ul><h3>廂房</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"狂獅戰腕@888\" title=\"在物品大全中打開\">狂獅戰腕</span>：東廂房，中間的櫃子</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"金塊@817\" title=\"在物品大全中打開\">金塊</span>：西廂房，左上箱子處</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"蜜乳樹汁@673\" title=\"在物品大全中打開\">蜜乳樹汁</span>：西廂房，最右邊的罐子</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"天珠武鎧@861\" title=\"在物品大全中打開\">天珠武鎧</span>：北廂房，左側箱子</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"太皇刀─綠痕@543\" title=\"在物品大全中打開\">太皇刀─綠痕</span>：北廂房，右側櫃子</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"起兵計劃書@810\" title=\"在物品大全中打開\">起兵計劃書</span>：南廂房，左下箱子</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"蒼蟒錦衣@867\" title=\"在物品大全中打開\">蒼蟒錦衣</span>：南廂房，右上珠寶堆</li></ul><h3>樓上</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"純鈞@512\" title=\"在物品大全中打開\">純鈞</span>：二樓，入口左側的大油燈</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"光紗天衣@1012\" title=\"在物品大全中打開\">光紗天衣</span>：二樓，左側珠寶堆</li><li>二樓的雨師向你要<span class=\"jump items\" data-view=\"items\" data-detail=\"雷公鎚@947\" title=\"在物品大全中打開\">雷公鎚</span>。</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"朱雀火羽@935\" title=\"在物品大全中打開\">朱雀火羽</span>：三樓，右側桌子（抗火 100%）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"安祿山軍令@811\" title=\"在物品大全中打開\">安祿山軍令</span>：四樓，右下屏風</li></ul><h3>內院</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"碧英之腕@1050\" title=\"在物品大全中打開\">碧英之腕</span>：珠寶堆</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"封印之劍@793\" title=\"在物品大全中打開\">封印之劍</span>（16）：封印之光</li></ul><h3>王府密道</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"如意金箍棒@556\" title=\"在物品大全中打開\">如意金箍棒</span>：寶箱，打敗<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"鬥戰聖佛@368\" title=\"在神魔異事錄中打開\">鬥戰聖佛</span>後得到</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"靈蛇手套@884\" title=\"在物品大全中打開\">靈蛇手套</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"紫金冠@902\" title=\"在物品大全中打開\">紫金冠</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"雷公鎚@947\" title=\"在物品大全中打開\">雷公鎚</span>：寶箱（抗電 80%）</li></ul><h3>支線：風伯</h3><ol><li>密道裡有一個箱子關著風伯，他要<span class=\"jump items\" data-view=\"items\" data-detail=\"乾坤袋@943\" title=\"在物品大全中打開\">乾坤袋</span>。</li><li>給他後，卡瑪學會「風伯見日」。</li><li>要等卡瑪學會「元極四方」之後再給，否則學不到元極四方。</li></ol><h3>支線：雨師</h3><ol><li>把<span class=\"jump items\" data-view=\"items\" data-detail=\"雷公鎚@947\" title=\"在物品大全中打開\">雷公鎚</span>拿回二樓給雨師。</li><li>李靖學會「雨師興浪」。</li><li>要等李靖學會「真武神威」之後再給。雷公鎚打蚩尤時也用得上。</li></ol><h3>偷竊與靈契</h3><ul><li>靈契<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"七仙女@148\" title=\"在神魔異事錄中打開\">七仙女</span><span class=\"tag domo\">DOMO</span>，可偷<span class=\"jump items\" data-view=\"items\" data-detail=\"靈樞玉液@703\" title=\"在物品大全中打開\">靈樞玉液</span>。</li><li><span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"娥皇@158\" title=\"在神魔異事錄中打開\">娥皇</span>可偷<span class=\"jump items\" data-view=\"items\" data-detail=\"蟠桃@632\" title=\"在物品大全中打開\">蟠桃</span>（全體回復生命 100%）。</li><li><span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"女英@159\" title=\"在神魔異事錄中打開\">女英</span>可偷<span class=\"jump items\" data-view=\"items\" data-detail=\"金元五體丹@702\" title=\"在物品大全中打開\">金元五體丹</span>。</li><li><span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"雪女@277\" title=\"在神魔異事錄中打開\">雪女</span>可偷<span class=\"jump items\" data-view=\"items\" data-detail=\"紫玉冰晶@709\" title=\"在物品大全中打開\">紫玉冰晶</span>。</li><li><span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"美杜莎@135\" title=\"在神魔異事錄中打開\">美杜莎</span>可偷<span class=\"jump items\" data-view=\"items\" data-detail=\"溶石藥劑@651\" title=\"在物品大全中打開\">溶石藥劑</span>。</li></ul>"}, {"chapter": "安史之亂後", "title": "長江之畔與天山", "text": "長江之畔與天山\n# 流程\n1. 五年後，賽特的魂魄來到長江之畔。\n2. 聽見江邊有人唱歌，進屋見到李白，李白贈送軒轅劍。\n3. 被召喚到天山石窟，和軒轅劍仙、米迦勒說話，得知撒旦和康那里士在佈反曼陀羅陣。\n4. 劍仙為賽特重塑肉身。\n5. 出洞和卡瑪、安卡說話，卡瑪歸隊。\n6. 回白府，得知白連儀已過世。\n# 提示\n- 軒轅劍暫時不能裝備，戰鬥中可在「物品」裡使用，消耗 400 體力。\n- 長安西市雜貨鋪的老古開始賣大量高級裝備，可給卡瑪買蓮腕釧。\n- 安史之亂後，魔晶礦、機關設計圖、神津珍譜都不能再交換，薩爾達也不再交易。", "html": "<h3>流程</h3><ol><li>五年後，賽特的魂魄來到長江之畔。</li><li>聽見江邊有人唱歌，進屋見到李白，李白贈送<span class=\"jump items\" data-view=\"items\" data-detail=\"軒轅劍@580\" title=\"在物品大全中打開\">軒轅劍</span>。</li><li>被召喚到天山石窟，和軒轅劍仙、米迦勒說話，得知撒旦和康那里士在佈反曼陀羅陣。</li><li>劍仙為賽特重塑肉身。</li><li>出洞和卡瑪、安卡說話，卡瑪歸隊。</li><li>回白府，得知白連儀已過世。</li></ol><h3>提示</h3><ul><li>軒轅劍暫時不能裝備，戰鬥中可在「物品」裡使用，消耗 400 體力。</li><li>長安西市雜貨鋪的老古開始賣大量高級裝備，可給卡瑪買<span class=\"jump items\" data-view=\"items\" data-detail=\"蓮腕釧@1051\" title=\"在物品大全中打開\">蓮腕釧</span>。</li><li>安史之亂後，魔晶礦、機關設計圖、神津珍譜都不能再交換，薩爾達也不再交易。</li></ul>"}, {"chapter": "安史之亂後", "title": "漢長安廢墟（二）", "text": "漢長安廢墟（二）\n# 流程\n1. 回到漢長安廢墟，搜完整個廢墟。\n2. 遇到康那里士。\n3. 遇到另一個「賽特」：利用賽特屍體重生的撒旦，妮可跟著他。\n4. 打敗撒旦的肉身，妮可歸隊，得封印之劍（17）。\n5. 軒轅劍仙將軒轅劍開封，可以直接裝備了。\n6. 先不要進人骨佛堂，去把«決戰前»的事做完。\n# 寶箱\n- 太皇刀─紅葉：總入口右側\n- 琵琶DOMO\n- 干將\n- 鏡舞\n- 鈦銧奇鞋\n- 地湧\n- 金鐘罩秘笈（護罩指令）\n- 五雷神機\n- 藍堂光套\n- 麟火吞月刀\n- 空白符紙\n- 龍族盔\n- 縛閻指套\n- 千佛鐲\n- 冥妖戰甲\n- 天仙神衣\n- 繡花葉鞋\n- 九龍雲生冑：封印之光下面\n# 地上\n- 五色石南葉\n- 憾天神槍：封印之光附近\n# 隱藏\n- 改裝車：原黃八身後那間屋子的罈子附近 DOMO\n- 聖獸玲瓏冠：再往左上的屋子，左上罈子附近\n- 帶火風輪：空白符紙左側的屋子\n- 巨闕：再往右上的屋子，左側櫃子\n- 詛咒魔戒：太皇刀─紅葉再往右上的屋子，右側\n- 白狐披風：鈦銧奇鞋上面那間屋子，倒了的櫃子左側\n# 三選一\n人骨佛堂外的水上有一個移動寶箱，三把劍只能選一把：\n- 龍泉：攻擊 +250，光傷 30\n- 泰阿：攻擊 +240，土傷 30\n- 工布：攻擊 +233，冰傷 30\n# 偷竊與靈契\n- 靈契九天玄女DOMO，非常好的護駕；可偷九龍神火罩。\n- 白無常可偷輪迴盤。\n- 太白金星可偷仙蓮子。", "html": "<h3>流程</h3><ol><li>回到漢長安廢墟，搜完整個廢墟。</li><li>遇到<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"康那里士@7\" title=\"在神魔異事錄中打開\">康那里士</span>。</li><li>遇到另一個「賽特」：利用賽特屍體重生的撒旦，妮可跟著他。</li><li>打敗<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"撒旦@28\" title=\"在神魔異事錄中打開\">撒旦</span>的肉身，妮可歸隊，得<span class=\"jump items\" data-view=\"items\" data-detail=\"封印之劍@793\" title=\"在物品大全中打開\">封印之劍</span>（17）。</li><li>軒轅劍仙將<span class=\"jump items\" data-view=\"items\" data-detail=\"軒轅劍@580\" title=\"在物品大全中打開\">軒轅劍</span>開封，可以直接裝備了。</li><li>先不要進人骨佛堂，去把<span class=\"goto\" data-title=\"決戰前\">決戰前</span>的事做完。</li></ol><h3>寶箱</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"太皇刀─紅葉@546\" title=\"在物品大全中打開\">太皇刀─紅葉</span>：總入口右側</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"琵琶@831\" title=\"在物品大全中打開\">琵琶</span><span class=\"tag domo\">DOMO</span></li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"干將@516\" title=\"在物品大全中打開\">干將</span></li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"鏡舞@1030\" title=\"在物品大全中打開\">鏡舞</span></li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"鈦銧奇鞋@919\" title=\"在物品大全中打開\">鈦銧奇鞋</span></li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"地湧@531\" title=\"在物品大全中打開\">地湧</span></li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"金鐘罩秘笈@952\" title=\"在物品大全中打開\">金鐘罩秘笈</span>（護罩指令）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"五雷神機@576\" title=\"在物品大全中打開\">五雷神機</span></li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"藍堂光套@887\" title=\"在物品大全中打開\">藍堂光套</span></li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"麟火吞月刀@541\" title=\"在物品大全中打開\">麟火吞月刀</span></li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"空白符紙@768\" title=\"在物品大全中打開\">空白符紙</span></li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"龍族盔@898\" title=\"在物品大全中打開\">龍族盔</span></li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"縛閻指套@886\" title=\"在物品大全中打開\">縛閻指套</span></li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"千佛鐲@1053\" title=\"在物品大全中打開\">千佛鐲</span></li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"冥妖戰甲@869\" title=\"在物品大全中打開\">冥妖戰甲</span></li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"天仙神衣@1017\" title=\"在物品大全中打開\">天仙神衣</span></li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"繡花葉鞋@1039\" title=\"在物品大全中打開\">繡花葉鞋</span></li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"九龍雲生冑@871\" title=\"在物品大全中打開\">九龍雲生冑</span>：封印之光下面</li></ul><h3>地上</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"五色石南葉@652\" title=\"在物品大全中打開\">五色石南葉</span></li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"憾天神槍@562\" title=\"在物品大全中打開\">憾天神槍</span>：封印之光附近</li></ul><h3>隱藏</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"改裝車@822\" title=\"在物品大全中打開\">改裝車</span>：原黃八身後那間屋子的罈子附近 <span class=\"tag domo\">DOMO</span></li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"聖獸玲瓏冠@905\" title=\"在物品大全中打開\">聖獸玲瓏冠</span>：再往左上的屋子，左上罈子附近</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"帶火風輪@915\" title=\"在物品大全中打開\">帶火風輪</span>：空白符紙左側的屋子</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"巨闕@515\" title=\"在物品大全中打開\">巨闕</span>：再往右上的屋子，左側櫃子</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"詛咒魔戒@982\" title=\"在物品大全中打開\">詛咒魔戒</span>：太皇刀─紅葉再往右上的屋子，右側</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"白狐披風@1015\" title=\"在物品大全中打開\">白狐披風</span>：鈦銧奇鞋上面那間屋子，倒了的櫃子左側</li></ul><h3>三選一</h3><p>人骨佛堂外的水上有一個移動寶箱，三把劍只能選一把：</p><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"龍泉@518\" title=\"在物品大全中打開\">龍泉</span>：攻擊 +250，光傷 30</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"泰阿@519\" title=\"在物品大全中打開\">泰阿</span>：攻擊 +240，土傷 30</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"工布@520\" title=\"在物品大全中打開\">工布</span>：攻擊 +233，冰傷 30</li></ul><h3>偷竊與靈契</h3><ul><li>靈契<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"九天玄女@149\" title=\"在神魔異事錄中打開\">九天玄女</span><span class=\"tag domo\">DOMO</span>，非常好的護駕；可偷<span class=\"jump items\" data-view=\"items\" data-detail=\"九龍神火罩@714\" title=\"在物品大全中打開\">九龍神火罩</span>。</li><li><span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"白無常@194\" title=\"在神魔異事錄中打開\">白無常</span>可偷<span class=\"jump items\" data-view=\"items\" data-detail=\"輪迴盤@645\" title=\"在物品大全中打開\">輪迴盤</span>。</li><li><span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"太白金星@198\" title=\"在神魔異事錄中打開\">太白金星</span>可偷<span class=\"jump items\" data-view=\"items\" data-detail=\"仙蓮子@646\" title=\"在物品大全中打開\">仙蓮子</span>。</li></ul>"}, {"chapter": "安史之亂後", "title": "決戰前", "text": "決戰前\n# 這時可以做的事\n- «DOMO工作室»：交齊東西，領娃娃。\n- «太皇刀»：四把交給洛陽王老五，之後買萬鈞神弩。\n- «流浪鑄劍師» 典藏版：交五把劍和干將、莫邪。\n- «封印之劍»：17 把交給軒轅劍僮，打蚩尤。\n- «牛魔王與DOMO神打功»：打過蚩尤後去洛陽道觀四樓抽籤。\n- 法蘭克關隘：調查士兵右側的木桶，看遊戲最後修改的日期。\n# 支線：軒轅劍僮與蚩尤\n1. 帶 17 把封印之劍，到天山山頂找軒轅劍僮。\n2. 打贏蚩尤（生命 120000，可偷蟠桃）。\n3. 得五彩石項鍊，軒轅劍僮加入。\n# 對付蚩尤\n盡量提高電、暗抗性，避免使用電、暗系奇術。參考配置：\n- 每人：子雷手套（抗電 60%）\n- 每人：惡魔風笛（抗暗 40%、毒 20%）\n- 賽特：冥妖戰甲、五行鞋、星君眼\n- 妮可：千葉、閰氣靴、吸血鬼指環\n- 卡瑪：天仙神衣、雷公鎚\n- 李靖：泥蚣袍、暗黑魔樽、薩登荊環", "html": "<h3>這時可以做的事</h3><ul><li><span class=\"goto\" data-title=\"DOMO工作室\">DOMO工作室</span>：交齊東西，領娃娃。</li><li><span class=\"goto\" data-title=\"太皇刀\">太皇刀</span>：四把交給洛陽王老五，之後買萬鈞神弩。</li><li><span class=\"goto\" data-title=\"流浪鑄劍師\">流浪鑄劍師</span> <span class=\"tag edition\">典藏版</span>：交五把劍和干將、莫邪。</li><li><span class=\"goto\" data-title=\"封印之劍\">封印之劍</span>：17 把交給軒轅劍僮，打蚩尤。</li><li><span class=\"goto\" data-title=\"牛魔王與DOMO神打功\">牛魔王與DOMO神打功</span>：打過蚩尤後去洛陽道觀四樓抽籤。</li><li>法蘭克關隘：調查士兵右側的木桶，看遊戲最後修改的日期。</li></ul><h3>支線：軒轅劍僮與蚩尤</h3><ol><li>帶 17 把封印之劍，到天山山頂找軒轅劍僮。</li><li>打贏<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"蚩尤@46\" title=\"在神魔異事錄中打開\">蚩尤</span>（生命 120000，可偷<span class=\"jump items\" data-view=\"items\" data-detail=\"蟠桃@632\" title=\"在物品大全中打開\">蟠桃</span>）。</li><li>得<span class=\"jump items\" data-view=\"items\" data-detail=\"五彩石項鍊@994\" title=\"在物品大全中打開\">五彩石項鍊</span>，軒轅劍僮加入。</li></ol><h3>對付蚩尤</h3><p>盡量提高電、暗抗性，避免使用電、暗系奇術。參考配置：</p><ul><li>每人：<span class=\"jump items\" data-view=\"items\" data-detail=\"子雷手套@889\" title=\"在物品大全中打開\">子雷手套</span>（抗電 60%）</li><li>每人：<span class=\"jump items\" data-view=\"items\" data-detail=\"惡魔風笛@986\" title=\"在物品大全中打開\">惡魔風笛</span>（抗暗 40%、毒 20%）</li><li>賽特：<span class=\"jump items\" data-view=\"items\" data-detail=\"冥妖戰甲@869\" title=\"在物品大全中打開\">冥妖戰甲</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"五行鞋@920\" title=\"在物品大全中打開\">五行鞋</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"星君眼@939\" title=\"在物品大全中打開\">星君眼</span></li><li>妮可：<span class=\"jump items\" data-view=\"items\" data-detail=\"千葉@1031\" title=\"在物品大全中打開\">千葉</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"閰氣靴@1041\" title=\"在物品大全中打開\">閰氣靴</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"吸血鬼指環@934\" title=\"在物品大全中打開\">吸血鬼指環</span></li><li>卡瑪：<span class=\"jump items\" data-view=\"items\" data-detail=\"天仙神衣@1017\" title=\"在物品大全中打開\">天仙神衣</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"雷公鎚@947\" title=\"在物品大全中打開\">雷公鎚</span></li><li>李靖：<span class=\"jump items\" data-view=\"items\" data-detail=\"泥蚣袍@868\" title=\"在物品大全中打開\">泥蚣袍</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"暗黑魔樽@949\" title=\"在物品大全中打開\">暗黑魔樽</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"薩登荊環@931\" title=\"在物品大全中打開\">薩登荊環</span></li></ul>"}, {"chapter": "安史之亂後", "title": "最終戰", "text": "最終戰\n# 人骨佛堂\n- 和撒旦決戰，生命 41000。\n- 盡量提高暗、電抗性。\n# 打法\n- 賽特 57 級學會「借物代形」，可替隊友擋五次攻擊。先給自己，再給李靖、卡瑪、妮可。\n- 李靖的「五朝歸元」可全體復活，李靖一定不能倒。\n- 卡瑪的風沙甘霖術全體回復 1000 生命，要常用。\n- 妮可會給撒旦補血的那招別用。\n- 全體回復 1000 生命的道具準備二三十個。\n# 結局\n1. 賽特用煉妖壺將撒旦封印九十九年。\n2. 妮可轉世，賽特回到薇達身邊，卡瑪與安卡守護著他們。\n3. 薇達過世後，卡瑪回到天界。\n4. 賽特找到轉世的妮可，共度後半生。", "html": "<h3>人骨佛堂</h3><ul><li>和<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"撒旦@28\" title=\"在神魔異事錄中打開\">撒旦</span>決戰，生命 41000。</li><li>盡量提高暗、電抗性。</li></ul><h3>打法</h3><ul><li>賽特 57 級學會「借物代形」，可替隊友擋五次攻擊。先給自己，再給李靖、卡瑪、妮可。</li><li>李靖的「五朝歸元」可全體復活，李靖一定不能倒。</li><li>卡瑪的風沙甘霖術全體回復 1000 生命，要常用。</li><li>妮可會給撒旦補血的那招別用。</li><li>全體回復 1000 生命的道具準備二三十個。</li></ul><h3>結局</h3><ol><li>賽特用煉妖壺將撒旦封印九十九年。</li><li>妮可轉世，賽特回到薇達身邊，卡瑪與安卡守護著他們。</li><li>薇達過世後，卡瑪回到天界。</li><li>賽特找到轉世的妮可，共度後半生。</li></ol>"}, {"chapter": "系列任務", "title": "DOMO工作室", "text": "DOMO工作室\n# 位置\n長安王大善人家被黃雷炸毀之後，進入廢墟右下角的涼亭。\n# 做法\n1. 和最裡面的郭炳宏說話，接下任務。\n2. 十六名組員各要一樣東西，給了就送一塊簽名板。\n3. 集齊十六塊簽名板，再找郭炳宏，得三個阿貓阿狗娃娃。\n# 組員要的東西\n- 蔡明宏：山蛇莓\n- 吳欣叡：魯特琴、坦普拉琴、琵琶\n- 楊淵升：增肥劑\n- 楊進財：俱樂部會員卡\n- 林克敏：改裝車\n- 王福生：名歌星ＣＤ\n- 劉馨韓：水果、味仙認可證\n- 羅國成：神祕果\n- 鮑弘修：不要東西\n- 黃志榮：不要東西\n- 陳盈君（小貓）：魚酥\n- 吳東興：多魔遊戲軟體\n- 張孝全：9000 銀幣\n- 朱榮敏：人像圖冊\n- 高玉玫：玫瑰、薰衣草、茉莉花\n- 郭炳宏：七種仙女（靈契收服）\n# 物品哪裡拿\n- 山蛇莓：威尼斯住宅區地上；長安長生藥房（隱藏）；各地也有賣\n- 魯特琴：威尼斯河邊民房一樓（隱藏）\n- 坦普拉琴：巴格達雜貨商買，500 銀幣\n- 琵琶：復活後的漢長安廢墟寶箱\n- 增肥劑：長安悅來客棧一樓房間（隱藏）\n- 俱樂部會員卡：第一次漢長安廢墟（隱藏）安史之亂前\n- 改裝車：復活後的漢長安廢墟（隱藏）安史之亂後\n- 名歌星ＣＤ：第一次漢長安廢墟寶箱 安史之亂前\n- 水果：長安悅來客棧二樓（隱藏）\n- 味仙認可證：五本神津珍譜在洛陽麵攤換，見«神津珍譜» 安史之亂前\n- 神祕果：長安悅來客棧一樓（隱藏）；驪山樹林（隱藏）；也可以煉化\n- 魚酥：長安悅來客棧一樓房間（隱藏）\n- 多魔遊戲軟體：洛陽道觀二樓寶箱\n- 人像圖冊：驪山樹林寶箱\n- 玫瑰：威尼斯墓園，解數學家年齡題\n- 薰衣草：大馬士革珠寶商家，分珍珠\n- 茉莉花：長安朱雀門右側\n# 七種仙女\n- 瓊霜：巴格達東北山洞\n- 水仙：天山山洞；也可用 藥草＋藥草 煉出\n- 上元夫人：天山山洞\n- 蠶女：驪山\n- 嫦娥：洛陽道觀二樓寶箱，給她破元仙露\n- 七仙女：安祿山府\n- 九天玄女：復活後的漢長安廢墟 安史之亂後\n# 特別的組員\n- 鮑弘修：身上銀幣達到 3000 萬，會被認定改過遊戲而不給。\n- 黃志榮：起初不給，連續和他說四次話就給。\n- 高玉玫：三種花交齊，另送修羅膀腕。\n# 娃娃\n從六種組合中隨機給一種，機會相同。領之前先存檔，不滿意可以讀檔重來。\n- 大米、樂樂、貓王\n- 樂樂、貓王、真夢\n- 貓王、紅珊瑚、真夢\n- 樂樂、真夢、紅珊瑚\n- 真夢、紅珊瑚、大米\n- 紅珊瑚、大米、樂樂\n# 娃娃效果\n- 真夢娃娃：光屬性，全體回復生命 4000，防禦加 30%\n- 紅珊瑚娃娃：風屬性，全體攻擊\n- 樂樂娃娃：物理，單體攻擊，最高約 5000\n- 貓王娃娃：物理，單體攻擊，最高約 4000\n- 大米娃娃：毒屬性，單體攻擊，最高約 3000\n# 工作室裡的物品\n- 空白符紙：寶箱\n- 地痞手套：水中寶箱\n- 歌神之靴：入口右側箱子（隱藏）\n- 毛獸大衣：亭子左邊的小瀑布（隱藏）", "html": "<h3>位置</h3><p>長安王大善人家被黃雷炸毀之後，進入廢墟右下角的涼亭。</p><h3>做法</h3><ol><li>和最裡面的郭炳宏說話，接下任務。</li><li>十六名組員各要一樣東西，給了就送一塊<span class=\"jump items\" data-view=\"items\" data-detail=\"簽名板@833\" title=\"在物品大全中打開\">簽名板</span>。</li><li>集齊十六塊簽名板，再找郭炳宏，得三個阿貓阿狗娃娃。</li></ol><h3>組員要的東西</h3><ul><li>蔡明宏：<span class=\"jump items\" data-view=\"items\" data-detail=\"山蛇莓@722\" title=\"在物品大全中打開\">山蛇莓</span></li><li>吳欣叡：<span class=\"jump items\" data-view=\"items\" data-detail=\"魯特琴@829\" title=\"在物品大全中打開\">魯特琴</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"坦普拉琴@830\" title=\"在物品大全中打開\">坦普拉琴</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"琵琶@831\" title=\"在物品大全中打 ss=\"jump items\" data-view=\"items\" data-detail=\"空白符紙@768\" title=\"在物品大全中打開\">空白符紙</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"地痞手套@879\" title=\"在物品大全中打開\">地痞手套</span>：水中寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"歌神之靴@910\" title=\"在物品大全中打開\">歌神之靴</span>：入口右側箱子（隱藏）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"毛獸大衣@1018\" title=\"在物品大全中打開\">毛獸大衣</span>：亭子左邊的小瀑布（隱藏）</li></ul>"}, {"chapter": "系列任務", "title": "超級商人薩爾達", "text": "超級商人薩爾達\n# 位置\n長安西市。\n# 規則\n- 賣加屬性上限的靈藥，數量不限。\n- 只交易一次。\n- 安史之亂前才交易。\n- 條件全部達成之前，不要和他說話。\n# 條件\n1. 大馬士革：向安薩里拉齊買中國劍。之後不賣回，也不開封成魚腸。\n2. 大馬士革：幫阿里看家，不碰寶箱，選最左邊的聖皇盔。\n3. 敘利亞森林：給祖旺回復劑。\n4. 大馬士革：讓祖旺買下辜露公主，得到祖旺的酬勞。\n5. 大馬士革奧斯曼家：和葉塔一直說話到奧斯曼進來，在煉妖壺中打敗他。\n6. 巴格達：答應幫士兵艾革利找彎刀，撿到或買一把都行。\n7. 石國：去天山途中，在第一間民房和宇文大地一家說話。\n8. 天山：見軒轅劍仙之前，和第二個洞窟的楊通幽說話。\n9. 天山：回到現實後，再和楊通幽說話。\n10. 石國：回去再見宇文天夫婦，幫他們的兒子取名。\n# 商品（價錢，上限加多少）\n- 耶穌聖血：200，生命 +10\n- 香柏葉：1500，力量 +10\n- 豐饒之角：800，體力 +50\n- 神奇麵包：500，生命 +30\n- 蜜乳樹汁：400，體力 +20\n- 妖精麥粉：400，靈力 +20\n- 巴丹杏仁：800，敏捷 +2\n- 歌唱的胡桃：2000，耐力 +10\n- 瑰麗之梨：800，智慧 +5\n- 魔法精羽：1000，敏捷 +3\n- 飛翔魔油：1800，敏捷 +5\n- 不老之泉水：1000，耐力 +5\n- 人馬獸之血：800，力量 +5\n- 黃金蘋果：1000，靈力 +50\n- 密茹之水：1500，智慧 +10\n- 里納種子：500，敏捷 +1\n- 三葉雪桑果：1200，生命 +100\n- 蜂王露：1500，力量 +10\n- 活靈芝：1200，體力 +100\n- 活骨靈藥：1800，生命、體力、靈力 +30\n- 神木之精：1500，耐力 +10\n- 玉山佛甲草：1200，智慧 +10\n# 注意\n生命、靈力、體力超過 9999 的部分，進戰鬥時會被截掉，吃到 9999 就夠了。", "html": "<h3>位置</h3><p>長安西市。</p><h3>規則</h3><ul><li>賣加屬性上限的靈藥，數量不限。</li><li>只交易一次。</li><li><span class=\"tag time\">安史之亂前</span>才交易。</li><li>條件全部達成之前，不要和他說話。</li></ul><h3>條件</h3><ol><li>大馬士革：向安薩里拉齊買<span class=\"jump items\" data-view=\"items\" data-detail=\"中國劍@578\" title=\"在物品大全中打開\">中國劍</span>。之後不賣回，也不開封成<span class=\"jump items\" data-view=\"items\" data-detail=\"魚腸@514\" title=\"在物品大全中打開\">魚腸</span>。</li><li>大馬士革：幫阿里看家，不碰寶箱，選最左邊的<span class=\"jump items\" data-view=\"items\" data-detail=\"聖皇盔@896\" title=\"在物品大全中打開\">聖皇盔</span>。</li><li>敘利亞森林：給祖旺<span class=\"jump items\" data-view=\"items\" data-detail=\"回復劑@625\" title=\"在物品大全中打開\">回復劑</span>。</li><li>大馬士革：讓祖旺買下辜露公主，得到祖旺的酬勞。</li><li>大馬士革奧斯曼家：和葉塔一直說話到奧斯曼進來，在煉妖壺中打敗他。</li><li>巴格達：答應幫士兵艾革利找<span class=\"jump items\" data-view=\"items\" data-detail=\"彎刀@537\" title=\"在物品大全中打開\">彎刀</span>，撿到或買一把都行。</li><li>石國：去天山途中，在第一間民房和宇文大地一家說話。</li><li>天山：見軒轅劍仙之前，和第二個洞窟的楊通幽說話。</li><li>天山：回到現實後，再和楊通幽說話。</li><li>石國：回去再見宇文天夫婦，幫他們的兒子取名。</li></ol><h3>商品（價錢，上限加多少）</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"耶穌聖血@669\" title=\"在物品大全中打開\">耶穌聖血</span>：200，生命 +10</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"香柏葉@670\" title=\"在物品大全中打開\">香柏葉</span>：1500，力量 +10</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"豐饒之角@671\" title=\"在物品大全中打開\">豐饒之角</span>：800，體力 +50</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"神奇麵包@672\" title=\"在物品大全中打開\">神奇麵包</span>：500，生命 +30</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"蜜乳樹汁@673\" title=\"在物品大全中打開\">蜜乳樹汁</span>：400，體力 +20</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"妖精麥粉@674\" title=\"在物品大全中打開\">妖精麥粉</span>：400，靈力 +20</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"巴丹杏仁@675\" title=\"在物品大全中打開\">巴丹杏仁</span>：800，敏捷 +2</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"歌唱的胡桃@676\" title=\"在物品大全中打開\">歌唱的胡桃</span>：2000，耐力 +10</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"瑰麗之梨@677\" title=\"在物品大全中打開\">瑰麗之梨</span>：800，智慧 +5</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"魔法精羽@678\" title=\"在物品大全中打開\">魔法精羽</span>：1000，敏捷 +3</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"飛翔魔油@679\" title=\"在物品大全中打開\">飛翔魔油</span>：1800，敏捷 +5</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"不老之泉水@681\" title=\"在物品大全中打開\">不老之泉水</span>：1000，耐力 +5</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"人馬獸之血@683\" title=\"在物品大全中打開\">人馬獸之血</span>：800，力量 +5</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"黃金蘋果@684\" title=\"在物品大全中打開\">黃金蘋果</span>：1000，靈力 +50</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"密茹之水@685\" title=\"在物品大全中打開\">密茹之水</span>：1500，智慧 +10</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"里納種子@686\" title=\"在物品大全中打開\">里納種子</span>：500，敏捷 +1</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"三葉雪桑果@687\" title=\"在物品大全中打開\">三葉雪桑果</span>：1200，生命 +100</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"蜂王露@688\" title=\"在物品大全中打開\">蜂王露</span>：1500，力量 +10</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"活靈芝@689\" title=\"在物品大全中打開\">活靈芝</span>：1200，體力 +100</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"活骨靈藥@691\" title=\"在物品大全中打開\">活骨靈藥</span>：1800，生命、體力、靈力 +30</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"神木之精@692\" title=\"在物品大全中打開\">神木之精</span>：1500，耐力 +10</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"玉山佛甲草@693\" title=\"在物品大全中打開\">玉山佛甲草</span>：1200，智慧 +10</li></ul><h3>注意</h3><p>生命、靈力、體力超過 9999 的部分，進戰鬥時會被截掉，吃到 9999 就夠了。</p>"}, {"chapter": "系列任務", "title": "封印之劍", "text": "封印之劍\n# 用途\n- 每把封印之劍攻擊 20，每回合回復 1% 生命、體力、靈力。\n- 集齊 17 把，交給天山山頂的軒轅劍僮。\n- 打贏蚩尤後得五彩石項鍊，軒轅劍僮加入。\n# 提示\n- 裝備著一把封印之劍去和軒轅劍僮說話，交出 17 把後還會留下一把。\n- 不要把封印之劍交給大馬士革的列拉，否則湊不滿 17 把。\n# 地點\n各處「封印之光」第一次調查時給一把。\n1. 威尼斯墓園地道\n2. 修道院地道\n3. 移動島城堡大廳\n4. 移動島城堡二樓\n5. 移動島城堡四樓\n6. 塔德莫爾墓室出口\n7. 血腥地獄地府商店街\n8. 大馬士革皇宮通道\n9. 石國地下水路\n10. 怛羅斯\n11. 天山山道\n12. 少林寺木人巷\n13. 第一次漢長安廢墟，炸開山壁後\n14. 驪山樹林\n15. 洛陽道觀頂樓\n16. 安祿山府內院\n17. 復活後的漢長安廢墟，打敗有賽特身體的撒旦後", "html": "<h3>用途</h3><ul><li>每把<span class=\"jump items\" data-view=\"items\" data-detail=\"封印之劍@793\" title=\"在物品大全中打開\">封印之劍</span>攻擊 20，每回合回復 1% 生命、體力、靈力。</li><li>集齊 17 把，交給天山山頂的<span class=\"jump items\" data-view=\"items\" data-detail=\"軒轅劍僮@35\" title=\"在物品大全中打開\">軒轅劍僮</span>。</li><li>打贏<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"蚩尤@46\" title=\"在神魔異事錄中打開\">蚩尤</span>後得<span class=\"jump items\" data-view=\"items\" data-detail=\"五彩石項鍊@994\" title=\"在物品大全中打開\">五彩石項鍊</span>，軒轅劍僮加入。</li></ul><h3>提示</h3><ul><li>裝備著一把封印之劍去和軒轅劍僮說話，交出 17 把後還會留下一把。</li><li>不要把封印之劍交給大馬士革的列拉，否則湊不滿 17 把。</li></ul><h3>地點</h3><p>各處「封印之光」第一次調查時給一把。</p><ol><li>威尼斯墓園地道</li><li>修道院地道</li><li>移動島城堡大廳</li><li>移動島城堡二樓</li><li>移動島城堡四樓</li><li>塔德莫爾墓室出口</li><li>血腥地獄地府商店街</li><li>大馬士革皇宮通道</li><li>石國地下水路</li><li>怛羅斯</li><li>天山山道</li><li>少林寺木人巷</li><li>第一次漢長安廢墟，炸開山壁後</li><li>驪山樹林</li><li>洛陽道觀頂樓</li><li>安祿山府內院</li><li>復活後的漢長安廢墟，打敗有賽特身體的<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"撒旦@28\" title=\"在神魔異事錄中打開\">撒旦</span>後</li></ol>"}, {"chapter": "系列任務", "title": "魔晶礦", "text": "魔晶礦\n# 收集\n- 魔晶礦Ａ：敘利亞森林，給祖旺回復劑\n- 魔晶礦Ｂ：大馬士革皇宮通道寶箱\n- 魔晶礦Ｃ：石國地下水路，漂在水上的箱子\n- 魔晶礦Ｄ：天山山洞寶箱\n# 兌換\n- 長安蘭律閣：換莫邪\n- 洛陽松韻居：換泥蚣袍\n- 典藏版建議在長安換莫邪，之後連同干將交給«流浪鑄劍師»，可換 10 件泥蚣袍。\n# 注意\n- 和«機關設計圖»必須在同一家換，換了一家，另一家就不再交換。\n- 要安史之亂前換：救回王思月之後，夜探安祿山府之前。", "html": "<h3>收集</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"魔晶礦Ａ@772\" title=\"在物品大全中打開\">魔晶礦Ａ</span>：敘利亞森林，給祖旺<span class=\"jump items\" data-view=\"items\" data-detail=\"回復劑@625\" title=\"在物品大全中打開\">回復劑</span></li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"魔晶礦Ｂ@773\" title=\"在物品大全中打開\">魔晶礦Ｂ</span>：大馬士革皇宮通道寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"魔晶礦Ｃ@774\" title=\"在物品大全中打開\">魔晶礦Ｃ</span>：石國地下水路，漂在水上的箱子</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"魔晶礦Ｄ@775\" title=\"在物品大全中打開\">魔晶礦Ｄ</span>：天山山洞寶箱</li></ul><h3>兌換</h3><ul><li>長安蘭律閣：換<span class=\"jump items\" data-view=\"items\" data-detail=\"莫邪@517\" title=\"在物品大全中打開\">莫邪</span></li><li>洛陽松韻居：換<span class=\"jump items\" data-view=\"items\" data-detail=\"泥蚣袍@868\" title=\"在物品大全中打開\">泥蚣袍</span></li><li>典藏版建議在長安換莫邪，之後連同<span class=\"jump items\" data-view=\"items\" data-detail=\"干將@516\" title=\"在物品大全中打開\">干將</span>交給<span class=\"goto\" data-title=\"流浪鑄劍師\">流浪鑄劍師</span>，可換 10 件泥蚣袍。</li></ul><h3>注意</h3><ul><li>和<span class=\"goto\" data-title=\"機關設計圖\">機關設計圖</span>必須在同一家換，換了一家，另一家就不再交換。</li><li>要<span class=\"tag time\">安史之亂前</span>換：救回王思月之後，夜探安祿山府之前。</li></ul>"}, {"chapter": "系列任務", "title": "機關設計圖", "text": "機關設計圖\n# 收集\n- 機關設計圖１：天山山洞寶箱，出洞前左側\n- 機關設計圖２：長安西市蘭律閣寶箱\n- 機關設計圖３：第一次漢長安廢墟（隱藏）\n- 機關設計圖４：少林寺木人巷寶箱\n- 機關設計圖５：王大善人家，打敗羯羊妖機後得到\n- 機關設計圖６：第一次漢長安廢墟（隱藏）\n# 兌換\n- 長安蘭律閣：換蟹精魔機\n- 洛陽松韻居：換羯忍幻機\n- 交出後約等一分鐘才拿到。\n# 注意\n- 和«魔晶礦»必須在同一家換，換了一家，另一家就不再交換。\n- 要安史之亂前換：救回王思月之後，夜探安祿山府之前。", "html": "<h3>收集</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"機關設計圖１@776\" title=\"在物品大全中打開\">機關設計圖１</span>：天山山洞寶箱，出洞前左側</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"機關設計圖２@777\" title=\"在物品大全中打開\">機關設計圖２</span>：長安西市蘭律閣寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"機關設計圖３@778\" title=\"在物品大全中打開\">機關設計圖３</span>：第一次漢長安廢墟（隱藏）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"機關設計圖４@779\" title=\"在物品大全中打開\">機關設計圖４</span>：少林寺木人巷寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"機關設計圖５@780\" title=\"在物品大全中打開\">機關設計圖５</span>：王大善人家，打敗<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"羯羊妖機@51\" title=\"在神魔異事錄中打開\">羯羊妖機</span>後得到</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"機關設計圖６@781\" title=\"在物品大全中打開\">機關設計圖６</span>：第一次漢長安廢墟（隱藏）</li></ul><h3>兌換</h3><ul><li>長安蘭律閣：換<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"蟹精魔機@47\" title=\"在神魔異事錄中打開\">蟹精魔機</span></li><li>洛陽松韻居：換<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"羯忍幻機@49\" title=\"在神魔異事錄中打開\">羯忍幻機</span></li><li>交出後約等一分鐘才拿到。</li></ul><h3>注意</h3><ul><li>和<span class=\"goto\" data-title=\"魔晶礦\">魔晶礦</span>必須在同一家換，換了一家，另一家就不再交換。</li><li>要<span class=\"tag time\">安史之亂前</span>換：救回王思月之後，夜探安祿山府之前。</li></ul>"}, {"chapter": "系列任務", "title": "神津珍譜", "text": "神津珍譜\n# 收集\n- 神津珍譜─壹：洛陽乞丐小狗子右側，兩房子夾縫的水缸（隱藏）\n- 神津珍譜─貳：洛陽上御客棧二樓，樓梯上方的罈子（隱藏）\n- 神津珍譜─參：洛陽麵攤旁的罈子（隱藏）\n- 神津珍譜─肆：洛陽道觀一樓寶箱\n- 神津珍譜─伍：第一次漢長安廢墟（隱藏）\n# 兌換\n- 集齊後找洛陽麵攤潘老闆，換味仙認可證DOMO\n- 要安史之亂前換。", "html": "<h3>收集</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"神津珍譜─壹@782\" title=\"在物品大全中打開\">神津珍譜─壹</span>：洛陽乞丐小狗子右側，兩房子夾縫的水缸（隱藏）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"神津珍譜─貳@783\" title=\"在物品大全中打開\">神津珍譜─貳</span>：洛陽上御客棧二樓，樓梯上方的罈子（隱藏）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"神津珍譜─參@784\" title=\"在物品大全中打開\">神津珍譜─參</span>：洛陽麵攤旁的罈子（隱藏）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"神津珍譜─肆@785\" title=\"在物品大全中打開\">神津珍譜─肆</span>：洛陽道觀一樓寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"神津珍譜─伍@786\" title=\"在物品大全中打開\">神津珍譜─伍</span>：第一次漢長安廢墟（隱藏）</li></ul><h3>兌換</h3><ul><li>集齊後找洛陽麵攤潘老闆，換<span class=\"jump items\" data-view=\"items\" data-detail=\"味仙認可證@832\" title=\"在物品大全中打開\">味仙認可證</span><span class=\"tag domo\">DOMO</span></li><li>要<span class=\"tag time\">安史之亂前</span>換。</li></ul>"}, {"chapter": "系列任務", "title": "太皇刀", "text": "太皇刀\n# 收集\n- 太皇刀─藍牙：天山山腳，山門下（隱藏）\n- 太皇刀─閻天：洛陽道觀一樓寶箱\n- 太皇刀─綠痕：安祿山府北廂房（隱藏）\n- 太皇刀─紅葉：復活後的漢長安廢墟寶箱\n# 兌換\n1. 讓卡瑪裝備其中一把，換完那把會留下來。\n2. 找洛陽武器販王老五，得四極皇霸刀（卡瑪用）。\n3. 之後向王老五買武器，可買到萬鈞神弩（妮可最強）。", "html": "<h3>收集</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"太皇刀─藍牙@544\" title=\"在物品大全中打開\">太皇刀─藍牙</span>：天山山腳，山門下（隱藏）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"太皇刀─閻天@545\" title=\"在物品大全中打開\">太皇刀─閻天</span>：洛陽道觀一樓寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"太皇刀─綠痕@543\" title=\"在物品大全中打開\">太皇刀─綠痕</span>：安祿山府北廂房（隱藏）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"太皇刀─紅葉@546\" title=\"在物品大全中打開\">太皇刀─紅葉</span>：復活後的漢長安廢墟寶箱</li></ul><h3>兌換</h3><ol><li>讓卡瑪裝備其中一把，換完那把會留下來。</li><li>找洛陽武器販王老五，得<span class=\"jump items\" data-view=\"items\" data-detail=\"四極皇霸刀@553\" title=\"在物品大全中打開\">四極皇霸刀</span>（卡瑪用）。</li><li>之後向王老五買武器，可買到<span class=\"jump items\" data-view=\"items\" data-detail=\"萬鈞神弩@536\" title=\"在物品大全中打開\">萬鈞神弩</span>（妮可最強）。</li></ol>"}, {"chapter": "系列任務", "title": "聖皇裝備", "text": "聖皇裝備\n# 收集 資料片\n- 聖皇靴：威尼斯酒屋後面的一堆桶裡（隱藏），從修道院回來後\n- 聖皇手套：潔西卡家地窖寶箱\n- 聖皇之鎧：移動島城堡四樓寶箱\n- 聖皇盔：大馬士革阿里看家，選最左邊的寶箱\n# 兌換\n四件交給洛陽雜貨鋪的大食商人阿穆，得麒麟緞帶（卡瑪用）。", "html": "<h3>收集 <span class=\"tag edition\">資料片</span></h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"聖皇靴@908\" title=\"在物品大全中打開\">聖皇靴</span>：威尼斯酒屋後面的一堆桶裡（隱藏），從修道院回來後</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"聖皇手套@876\" title=\"在物品大全中打開\">聖皇手套</span>：潔西卡家地窖寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"聖皇之鎧@853\" title=\"在物品大全中打開\">聖皇之鎧</span>：移動島城堡四樓寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"聖皇盔@896\" title=\"在物品大全中打開\">聖皇盔</span>：大馬士革阿里看家，選最左邊的寶箱</li></ul><h3>兌換</h3><p>四件交給洛陽雜貨鋪的大食商人阿穆，得<span class=\"jump items\" data-view=\"items\" data-detail=\"麒麟緞帶@1027\" title=\"在物品大全中打開\">麒麟緞帶</span>（卡瑪用）。</p>"}, {"chapter": "系列任務", "title": "宗楚客的玉器", "text": "宗楚客的玉器\n# 位置 資料片\n洛陽怡春院外的宗楚客。\n# 兌換\n- 六件玉器交齊，得紅寶石耳環。\n- 玉器先裝備在身上，交換後仍會留下。\n# 收集\n- 玉鐲：移動島城堡雜貨店買\n- 綠玉耳環：洛陽或長安雜貨鋪買\n- 白玉飛天珮：王思月所贈，或洛陽雜貨鋪買\n- 玉戒指：貝魯特艾德的問題 典藏版\n- 玉戒指：或 闊劍＋闊劍＝神燈巨人，神燈巨人＋神燈巨人＝玉戒指\n- 隴金玉劍：巴格達武器商買\n- 翠玉金釵：塔德莫爾寶箱\n- 翠玉金釵：或天山王子喬的問題 典藏版", "html": "<h3>位置 <span class=\"tag edition\">資料片</span></h3><p>洛陽怡春院外的宗楚客。</p><h3>兌換</h3><ul><li>六件玉器交齊，得<span class=\"jump items\" data-view=\"items\" data-detail=\"紅寶石耳環@1002\" title=\"在物品大全中打開\">紅寶石耳環</span>。</li><li>玉器先裝備在身上，交換後仍會留下。</li></ul><h3>收集</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"玉鐲@1043\" title=\"在物品大全中打開\">玉鐲</span>：移動島城堡雜貨店買</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"綠玉耳環@1001\" title=\"在物品大全中打開\">綠玉耳環</span>：洛陽或長安雜貨鋪買</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"白玉飛天珮@992\" title=\"在物品大全中打開\">白玉飛天珮</span>：王思月所贈，或洛陽雜貨鋪買</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"玉戒指@975\" title=\"在物品大全中打開\">玉戒指</span>：貝魯特艾德的問題 <span class=\"tag edition\">典藏版</span></li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"玉戒指@975\" title=\"在物品大全中打開\">玉戒指</span>：或 闊劍＋闊劍＝<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"神燈巨人@164\" title=\"在神魔異事錄中打開\">神燈巨人</span>，神燈巨人＋神燈巨人＝玉戒指</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"隴金玉劍@507\" title=\"在物品大全中打開\">隴金玉劍</span>：巴格達武器商買</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"翠玉金釵@1023\" title=\"在物品大全中打開\">翠玉金釵</span>：塔德莫爾寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"翠玉金釵@1023\" title=\"在物品大全中打開\">翠玉金釵</span>：或天山王子喬的問題 <span class=\"tag edition\">典藏版</span></li></ul>"}, {"chapter": "系列任務", "title": "流浪鑄劍師", "text": "流浪鑄劍師\n# 位置 典藏版\n長安明德門內左邊。\n# 兌換\n1. 給湛盧、純鈞、勝邪、魚腸、巨闕，得金塊×10。\n2. 再給干將、莫邪，得泥蚣袍×10。\n# 收集\n- 湛盧：長安西市武器攤買\n- 純鈞：安祿山府二樓（隱藏）\n- 勝邪：洛陽王老五買\n- 魚腸：長安西市把中國劍開封；薩爾達的條件之一是不開封中國劍\n- 巨闕：復活後的漢長安廢墟（隱藏）\n- 干將：復活後的漢長安廢墟寶箱\n- 莫邪：集齊«魔晶礦»，在長安蘭律閣換", "html": "<h3>位置 <span class=\"tag edition\">典藏版</span></h3><p>長安明德門內左邊。</p><h3>兌換</h3><ol><li>給<span class=\"jump items\" data-view=\"items\" data-detail=\"湛盧@511\" title=\"在物品大全中打開\">湛盧</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"純鈞@512\" title=\"在物品大全中打開\">純鈞</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"勝邪@513\" title=\"在物品大全中打開\">勝邪</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"魚腸@514\" title=\"在物品大全中打開\">魚腸</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"巨闕@515\" title=\"在物品大全中打開\">巨闕</span>，得<span class=\"jump items\" data-view=\"items\" data-detail=\"金塊@817\" title=\"在物品大全中打開\">金塊</span>×10。</li><li>再給<span class=\"jump items\" data-view=\"items\" data-detail=\"干將@516\" title=\"在物品大全中打開\">干將</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"莫邪@517\" title=\"在物品大全中打開\">莫邪</span>，得<span class=\"jump items\" data-view=\"items\" data-detail=\"泥蚣袍@868\" title=\"在物品大全中打開\">泥蚣袍</span>×10。</li></ol><h3>收集</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"湛盧@511\" title=\"在物品大全中打開\">湛盧</span>：長安西市武器攤買</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"純鈞@512\" title=\"在物品大全中打開\">純鈞</span>：安祿山府二樓（隱藏）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"勝邪@513\" title=\"在物品大全中打開\">勝邪</span>：洛陽王老五買</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"魚腸@514\" title=\"在物品大全中打開\">魚腸</span>：長安西市把<span class=\"jump items\" data-view=\"items\" data-detail=\"中國劍@578\" title=\"在物品大全中打開\">中國劍</span>開封；薩爾達的條件之一是不開封中國劍</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"巨闕@515\" title=\"在物品大全中打開\">巨闕</span>：復活後的漢長安廢墟（隱藏）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"干將@516\" title=\"在物品大全中打開\">干將</span>：復活後的漢長安廢墟寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"莫邪@517\" title=\"在物品大全中打開\">莫邪</span>：集齊<span class=\"goto\" data-title=\"魔晶礦\">魔晶礦</span>，在長安蘭律閣換</li></ul>"}, {"chapter": "系列任務", "title": "中國劍", "text": "中國劍\n# 取得\n大馬士革街上的安薩里拉齊，1500 銀幣買中國劍。\n# 去向\n- 巴格達的安薩里拉齊出 3000 銀幣買回。\n- 長安西市武器攤花錢開封成魚腸，只問一次。\n- 做«超級商人薩爾達»就不賣，也不開封。", "html": "<h3>取得</h3><p>大馬士革街上的安薩里拉齊，1500 銀幣買<span class=\"jump items\" data-view=\"items\" data-detail=\"中國劍@578\" title=\"在物品大全中打開\">中國劍</span>。</p><h3>去向</h3><ul><li>巴格達的安薩里拉齊出 3000 銀幣買回。</li><li>長安西市武器攤花錢開封成<span class=\"jump items\" data-view=\"items\" data-detail=\"魚腸@514\" title=\"在物品大全中打開\">魚腸</span>，只問一次。</li><li>做<span class=\"goto\" data-title=\"超級商人薩爾達\">超級商人薩爾達</span>就不賣，也不開封。</li></ul>"}, {"chapter": "系列任務", "title": "牛魔王與DOMO神打功", "text": "牛魔王與DOMO神打功\n# 條件\n- 打過天山軒轅劍僮的蚩尤戰（交出 17 把封印之劍後的那一場）。\n- 身上沒有DOMO神打功。\n# 做法\n1. 到洛陽道觀四樓的籤桶抽籤，抽到「有兔爰爰」。\n2. 到解籤架解籤（解作「活不如死掉的好」），和牛魔王戰鬥。\n3. 打贏得DOMO神打功。\n# 抽籤\n- 六支籤平均隨機。劇情裡兩支給控屍符的籤都抽過，之後「薔上露」那支也會變成「有兔爰爰」，所以每次有 1/3 的機會。\n- 沒抽到就再抽，重抽會洗掉上一支籤。籤詩列表見«洛陽道觀»。\n# 只打一次\n- 抽到「有兔爰爰」去解籤時，身上已有DOMO神打功就不打，只看到籤文。\n- DOMO神打功不能丟、不能賣，用了也不會消耗，所以牛魔王只會打一次。\n# 打蚩尤之前\n- 解「有兔爰爰」只會和戰死屍鬼戰鬥。\n- 打過蚩尤後，這一場整場換成牛魔王，不會先打戰死屍鬼。\n# 塔前的河南官員\n- 打過蚩尤後才出現，提示牛頭妖魔躲在籤桶裡。\n- 不和他說話也能打。和籤桶這一場戰鬥結束後他就離開。\n# 提示\n- DOMO神打功：召喚 DOMO 小組攻擊，消耗靈力 1 點，傷害 9999。\n- 牛魔王的青焰纏捲每次 2000 以上，不管抗性多少。\n- 生命要夠高，暗抗性盡量提高。", "html": "<h3>條件</h3><ul><li>打過天山軒轅劍僮的<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"蚩尤@46\" title=\"在神魔異事錄中打開\">蚩尤</span>戰（交出 17 把封印之劍後的那一場）。</li><li>身上沒有<span class=\"jump items\" data-view=\"items\" data-detail=\"DOMO神打功@835\" title=\"在物品大全中打開\">DOMO神打功</span>。</li></ul><h3>做法</h3><ol><li>到洛陽道觀四樓的籤桶抽籤，抽到「有兔爰爰」。</li><li>到解籤架解籤（解作「活不如死掉的好」），和<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"牛魔王@59\" title=\"在神魔異事錄中打開\">牛魔王</span>戰鬥。</li><li>打贏得<span class=\"jump items\" data-view=\"items\" data-detail=\"DOMO神打功@835\" title=\"在物品大全中打開\">DOMO神打功</span>。</li></ol><h3>抽籤</h3><ul><li>六支籤平均隨機。劇情裡兩支給<span class=\"jump items\" data-view=\"items\" data-detail=\"控屍符@798\" title=\"在物品大全中打開\">控屍符</span>的籤都抽過，之後「薔上露」那支也會變成「有兔爰爰」，所以每次有 1/3 的機會。</li><li>沒抽到就再抽，重抽會洗掉上一支籤。籤詩列表見<span class=\"goto\" data-title=\"洛陽道觀\">洛陽道觀</span>。</li></ul><h3>只打一次</h3><ul><li>抽到「有兔爰爰」去解籤時，身上已有<span class=\"jump items\" data-view=\"items\" data-detail=\"DOMO神打功@835\" title=\"在物品大全中打開\">DOMO神打功</span>就不打，只看到籤文。</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"DOMO神打功@835\" title=\"在物品大全中打開\">DOMO神打功</span>不能丟、不能賣，用了也不會消耗，所以牛魔王只會打一次。</li></ul><h3>打蚩尤之前</h3><ul><li>解「有兔爰爰」只會和<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"戰死屍鬼@167\" title=\"在神魔異事錄中打開\">戰死屍鬼</span>戰鬥。</li><li>打過蚩尤後，這一場整場換成牛魔王，不會先打戰死屍鬼。</li></ul><h3>塔前的河南官員</h3><ul><li>打過蚩尤後才出現，提示牛頭妖魔躲在籤桶裡。</li><li>不和他說話也能打。和籤桶這一場戰鬥結束後他就離開。</li></ul><h3>提示</h3><ul><li>DOMO神打功：召喚 DOMO 小組攻擊，消耗靈力 1 點，傷害 9999。</li><li>牛魔王的青焰纏捲每次 2000 以上，不管抗性多少。</li><li>生命要夠高，暗抗性盡量提高。</li></ul>"}]};
const CHAPTERS = DATA.chapters;
const SECTIONS = DATA.sections;

let chapter = 0;
let chosen = 0;
let shown = [];

const $ = id => document.getElementById(id);

function escape(text) {
  return text.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
}

function query() {
  return $('search').value.trim().toLowerCase().split(/\s+/).filter(word => word);
}

function drawTabs() {
  $('tabs').innerHTML = CHAPTERS.map((name, at) =>
    `<div class="tab${at === chapter ? ' chosen' : ''}" data-at="${at}">${escape(name)}</div>`).join('');
}

function list() {
  const words = query();
  shown = words.length ? SECTIONS.filter(section => words.every(word => section.text.toLowerCase().includes(word))) :
    SECTIONS.filter(section => section.chapter === CHAPTERS[chapter]);
  chosen = Math.min(chosen, Math.max(shown.length - 1, 0));
  $('list').innerHTML = shown.length ? shown.map((section, at) =>
    `<div class="row${at === chosen ? ' chosen' : ''}" data-at="${at}">${escape(section.title)}</div>`).join('') :
    '<div class="empty">找不到</div>';
  show();
}

// The words searched marked in the text of the page (not inside its tags).
function highlight(root, words) {
  if (!words.length) {
    return;
  }

  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = [];

  while (walker.nextNode()) {
    nodes.push(walker.currentNode);
  }

  const pattern = new RegExp(words.map(word => word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|'), 'gi');

  for (const node of nodes) {
    if (!pattern.test(node.data)) {
      continue;
    }

    pattern.lastIndex = 0;
    const span = document.createElement('span');
    span.innerHTML = escape(node.data).replace(pattern, found => `<mark>${found}</mark>`);
    node.replaceWith(...span.childNodes);
  }
}

function show() {
  document.querySelectorAll('.row').forEach((row, at) => row.classList.toggle('chosen', at === chosen));
  const row = document.querySelector('.row.chosen');

  if (row) {
    row.scrollIntoView({ block: 'nearest' });
  }

  const section = shown[chosen];
  const words = query();
  document.querySelectorAll('.tab').forEach((tab, at) => {
    tab.classList.toggle('chosen', !words.length && at === chapter);
    tab.classList.toggle('found', words.length > 0 && section !== undefined && CHAPTERS[at] === section.chapter);
  });

  if (!section) {
    $('title').innerHTML = '';
    $('body').innerHTML = '';
    return;
  }

  keepPlace(section.title);
  $('title').innerHTML = `${escape(section.title)}<small>${escape(section.chapter)}</small>`;
  $('body').innerHTML = section.html;
  highlight($('body'), words);
  const mark = $('body').querySelector('mark');
  $('body').scrollTop = mark ? mark.offsetTop - $('body').offsetTop - 60 : 0;
}

function move(by) {
  if (!shown.length) {
    return;
  }

  chosen = Math.max(0, Math.min(shown.length - 1, chosen + by));
  show();
}

function turn(by) {
  chapter = (chapter + by + CHAPTERS.length) % CHAPTERS.length;
  chosen = 0;
  $('search').value = '';
  drawTabs();
  list();
}

$('search').addEventListener('input', () => {
  chosen = 0;
  list();
});

$('tabs').addEventListener('click', event => {
  const tab = event.target.closest('.tab');

  if (tab) {
    turn(Number(tab.dataset.at) - chapter);
  }
});

$('list').addEventListener('click', event => {
  const row = event.target.closest('.row');

  if (row) {
    chosen = Number(row.dataset.at);
    show();
  }
});

// A name opens the items page or the bestiary on it: the home page shows it beside its menu, alone the page itself.
$('body').addEventListener('click', event => {
  const goto = event.target.closest('.goto');

  if (goto) {
    chooseNamed(goto.dataset.title);
    return;
  }

  const jump = event.target.closest('.jump');

  if (!jump) {
    return;
  }

  const { view, detail } = jump.dataset;

  if (window.parent !== window) {
    window.parent.postMessage({ open: view, detail }, '*');
    return;
  }

  location.href = `${view}.html#${encodeURIComponent(detail)}`;
});

document.addEventListener('keydown', event => {
  const typing = event.target === $('search');

  if (typing && event.key === 'Escape') {
    $('search').value = '';
    $('search').dispatchEvent(new Event('input'));
    return;
  }

  if (typing && (event.key === 'ArrowLeft' || event.key === 'ArrowRight')) {
    return;
  }

  const keys = { ArrowUp: () => move(-1), ArrowDown: () => move(1), ArrowLeft: () => turn(-1),
    ArrowRight: () => turn(1), PageUp: () => { $('body').scrollTop -= $('body').clientHeight - 40; },
    PageDown: () => { $('body').scrollTop += $('body').clientHeight - 40; } };

  if (keys[event.key]) {
    keys[event.key]();
    event.preventDefault();
  }
});

// The book keeps its size: scaled whole to fit the window, centred.
function fit() {
  const book = document.querySelector('.book');
  const scale = Math.min(innerWidth / book.offsetWidth, innerHeight / book.offsetHeight);
  const left = (innerWidth - book.offsetWidth * scale) / 2;
  const top = (innerHeight - book.offsetHeight * scale) / 2;
  book.style.transform = `translate(${left}px, ${top}px) scale(${scale})`;
}

// The section shown kept in the address (and in the home page's) in place, so that going back returns here.
function keepPlace(detail) {
  history.replaceState(null, '', `#${encodeURIComponent(detail)}`);

  if (window.parent !== window) {
    window.parent.postMessage({ shown: 'walkthrough', detail }, '*');
  }
}

function addressed() {
  try {
    return decodeURIComponent(location.hash.slice(1));
  } catch {
    return '';
  }
}

// A section named in the address (walkthrough.html#威尼斯) is chosen in its chapter.
function chooseNamed(text = addressed()) {
  const section = SECTIONS.find(each => each.title === text);

  if (!section) {
    return;
  }

  chapter = CHAPTERS.indexOf(section.chapter);
  $('search').value = '';
  drawTabs();
  list();
  chosen = shown.indexOf(section);
  show();
}

addEventListener('resize', fit);
addEventListener('hashchange', () => chooseNamed());
const place = addressed();
fit();
drawTabs();
list();
chooseNamed(place);
</script>
