<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>流程攻略</title>
<style>
:root {
  --gold: #c9a24a;
  --gold-dark: #7a5a1c;
  --gold-light: #f2d27a;
  --text: #e9dcb8;
  --dim: #b9a67a;
  --panel: rgba(14, 10, 4, 0.94);
  --ink: #7a1f12;
  --jade-light: #9fd4bb;
  --kai: "BiauKai", "DFKai-SB", "標楷體", "KaiTi", "STKaiti", "Kaiti TC", serif;
  --ming: "PMingLiU", "MingLiU", "新細明體", "Songti TC", "Noto Serif TC", "Noto Serif CJK TC", serif;
}

* { box-sizing: border-box; }

html, body { margin: 0; height: 100%; overflow: hidden; }

body {
  font-family: var(--ming);
  color: var(--text);
  background:
    radial-gradient(ellipse at 20% 10%, rgba(255, 250, 230, 0.55), transparent 55%),
    radial-gradient(ellipse at 80% 85%, rgba(120, 90, 50, 0.35), transparent 60%),
    radial-gradient(ellipse at 60% 40%, rgba(90, 70, 40, 0.25), transparent 50%),
    repeating-linear-gradient(90deg, rgba(110, 60, 20, 0.08) 0 1px, transparent 1px 72px),
    linear-gradient(160deg, #e8dcc0 0%, #d6c39c 45%, #c4ab7d 100%);
}

.book {
  position: absolute;
  left: 0;
  top: 0;
  width: 1180px;
  height: 870px;
  padding: 12px 12px 8px;
  display: flex;
  flex-direction: column;
  transform-origin: 0 0;
}

.top {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  border-top: 2px solid rgba(122, 60, 20, 0.45);
  background: repeating-linear-gradient(90deg, rgba(122, 60, 20, 0.35) 0 1px, transparent 1px 54px);
  height: 64px;
  flex: none;
  padding: 0 12px 4px 6px;
}

h1 {
  margin: 0;
  font-family: var(--kai);
  font-size: 44px;
  letter-spacing: 6px;
  color: var(--ink);
  text-shadow: 2px 2px 0 rgba(255, 240, 210, 0.6), 0 0 6px rgba(122, 31, 18, 0.25);
  font-weight: bold;
}

.search {
  width: 360px;
  height: 34px;
  margin: 0 0 6px 6px;
  padding: 0 10px;
  font: inherit;
  font-size: 18px;
  color: #3b2a12;
  background: rgba(255, 248, 228, 0.8);
  border: 1px solid rgba(122, 60, 20, 0.6);
  border-radius: 3px;
  outline: none;
}

.search:focus { border-color: var(--ink); background: #fffaf0; }

.layout {
  display: grid;
  grid-template-columns: 110px 250px 1fr;
  gap: 0 14px;
  margin-top: 8px;
  flex: 1;
  min-height: 0;
}

.frame {
  background: var(--panel);
  border: 3px double var(--gold);
  box-shadow: inset 0 0 0 1px var(--gold-dark), 0 0 0 1px #3a2a10, 2px 3px 8px rgba(40, 25, 5, 0.55);
}

.tabs {
  display: flex;
  flex-direction: column;
  gap: 3px;
  padding-top: 10px;
  margin-right: -14px;
  overflow-y: auto;
  scrollbar-width: none;
  z-index: 1;
}

.tab {
  font-family: var(--kai);
  font-size: 19px;
  padding: 5px 12px 5px 10px;
  color: #6d5a3c;
  background: linear-gradient(90deg, #b8a27a, #d9c9a3);
  border: 1px solid #8a6d3b;
  border-right: none;
  border-radius: 6px 0 0 6px;
  cursor: pointer;
  user-select: none;
  text-align: center;
  white-space: nowrap;
}

.tab.chosen { color: #1e1406; background: linear-gradient(90deg, #d6b45e, #f6e3a6); border-color: var(--gold-dark);
  font-weight: bold; }
.tab.found { color: #3a2a10; background: linear-gradient(90deg, #cdb88a, #eadcb6); border-color: var(--gold-dark);
  box-shadow: inset 4px 0 0 var(--gold-dark); }

.list {
  min-height: 0;
  overflow-x: hidden;
  overflow-y: auto;
  scrollbar-gutter: stable;
  padding: 12px 6px 12px 10px;
  scrollbar-color: var(--gold-dark) #120e06;
}

.row {
  font-family: var(--kai);
  font-size: 22px;
  line-height: 36px;
  padding: 0 8px 0 6px;
  cursor: pointer;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  text-shadow: 1px 1px 0 #000;
}

.row.chosen { color: #fff6d6;
  background: linear-gradient(90deg, rgba(232, 168, 56, 0.95), rgba(170, 110, 20, 0.75) 45%, rgba(90, 55, 5, 0.1)); }
.empty { font-family: var(--kai); font-size: 20px; color: var(--dim); padding: 8px 6px; }

.page {
  display: flex;
  flex-direction: column;
  min-height: 0;
  padding: 14px 8px 12px 24px;
}

.page .title { flex: none; font-family: var(--kai); font-size: 32px; line-height: 44px; color: #fff2c8;
  border-bottom: 1px solid var(--gold-dark); margin-right: 16px; padding-bottom: 4px; }
.page .title small { font-size: 18px; color: var(--dim); margin-left: 14px; }
.page .body { flex: 1; min-height: 0; overflow-y: auto; scrollbar-gutter: stable; padding: 4px 14px 10px 0;
  scrollbar-color: var(--gold-dark) #120e06; font-size: 18px; line-height: 31px; }
.page h3 { font-family: var(--kai); font-size: 23px; font-weight: normal; color: var(--gold-light); margin: 14px 0 2px; }
.page p { margin: 2px 0 6px; }
.page ul, .page ol { margin: 0 0 6px; padding-left: 26px; }
.page ol li::marker { font-family: var(--ming); font-size: 16px; }
.page li { margin: 0; }
.page li::marker { color: var(--gold); }

.jump { color: #fff2c8; cursor: pointer; border-bottom: 1px dotted rgba(242, 210, 122, 0.55); }
.jump.bestiary { color: #f6d9a8; }
.jump:hover { color: var(--gold-light); border-bottom-style: solid; }
.goto { color: var(--jade-light); cursor: pointer; border-bottom: 1px dotted rgba(159, 212, 187, 0.6); }
.goto:hover { border-bottom-style: solid; }
.out { color: var(--gold-light); }
.out:hover { color: #fff2c8; }

.tag { display: inline-block; font-family: var(--kai); font-size: 15px; line-height: 21px; padding: 0 7px;
  margin: 0 3px; border-radius: 9px; vertical-align: 1px; white-space: nowrap; }
.tag.domo { color: #fff2c8; background: linear-gradient(180deg, #3e7a63, #1f3d33); border: 1px solid var(--jade-light); }
.tag.sarda { color: #fff2c8; background: linear-gradient(180deg, #8a5a1c, #4a2e08); border: 1px solid var(--gold); }
.tag.edition { color: #e9dcb8; background: #3a3020; border: 1px solid #8a7550; }
.tag.time { color: #ffd6c8; background: #4a1e14; border: 1px solid #a05a40; }

mark { background: rgba(232, 168, 56, 0.45); color: inherit; }

.hint { flex: none; margin-top: 6px; font-size: 13px; color: #5a4524; text-align: right; }
</style>
</head>
<body>
<div class="book">
  <div class="top">
    <input class="search" id="search" type="search" placeholder="搜尋地點、物品、支線" autocomplete="off">
    <h1>流程攻略</h1>
  </div>
  <div class="layout">
    <div class="tabs" id="tabs"></div>
    <div class="frame list" id="list"></div>
    <div class="frame page"><div class="title" id="title"></div><div class="body" id="body"></div></div>
  </div>
  <div class="hint">↑↓ 選擇　←→ 切換篇章　點物品或怪物的名字可打開物品大全、神魔異事錄，點綠色的項目可跳到該頁　搜尋可空格分隔多個關鍵字，Esc 清除</div>
</div>
<script>
const DATA = {"chapters": ["說明", "歐洲", "移動島", "阿拉伯", "西域", "大唐", "安史之亂後", "系列任務"], "sections": [{"chapter": "說明", "title": "攻略說明", "text": "攻略說明\n# 適用版本\n- 《軒轅劍參：雲和山的彼端》v1.02 DVD 版，也就是 OpenSWD3 對應的版本。\n- 原版 swd3.exe 和 OpenSWD3 的流程、物品完全一樣。\n# 攻略來源\n本攻略整合以下幾份舊攻略，按地圖重新排列：\n- 【青衫《軒轅劍3圖文攻略》｜https://chiuinan.github.io/game/game/intro/ch/c11/swd3/swd3/swd3.htm】：流程骨架、支線、寶箱。\n- Sanpphire（水木社區）《隱藏物品及要點攻略》：隱藏物品的位置、偷竊目標、封印之劍、薩爾達的條件與商品。\n- 【莫古大哥《全地圖、全任務、全物資詳細圖文攻略》｜https://steamcommunity.com/sharedfiles/filedetails/?id=3010003268】：轉載自【一鳴資源網｜https://www.yiming818.com/11583.html】，補了不少支線細節。\n- 【天幻網軒轅劍三專題｜http://swd3.ffsky.cn/walk_z.htm】：系列任務一覽，轉載自 HOPELEA 的軒轅劍三資料集。\n# 整合與核對\n- 由 OpenSWD3 整合。\n- 物品名、怪物名、偷竊目標都和遊戲資料核對過，舊攻略裡的錯字已改正。\n- DOMO 娃娃的組合、DOMO神打功的取得方法、典藏版與資料片支線，都查過遊戲的劇情腳本。\n- 隱藏物品的位置描述、木人巷三條路和隨機寶箱的內容，照攻略寫，沒有逐一在遊戲裡走過。\n# 物品的寫法\n每行一件，冒號後面是取得方式和位置。\n- 寶箱：打開寶箱得到。\n- 地上：地上看得到的東西，走過去調查就拿到。\n- 隱藏：看不見，要面對罈子、櫃子、草叢等按鍵調查才拿到。OpenSWD3 的「道具提示」設定會在這些地方顯示箭頭。\n- 銀幣直接寫數目，例如「300 銀幣：寶箱」。\n# 名詞\n- 封印之光：地圖上的光點，第一次調查給一把封印之劍，見«封印之劍»。\n- 靈契：用煉妖壺收服怪物。收服的怪物可以煉化，也可以裝備成護駕。\n- 煉化：在煉妖壺裡把兩樣東西煉成新的物品或怪物，例如 藥草＋藥草＝水仙。\n- 護駕：裝備在角色「護駕」欄的怪物，戰鬥中可以召喚出來幫忙作戰。\n- 偷竊：用偷竊指令從怪物身上拿東西，要先拿到神偷面具或乾坤袋。\n- 第一次漢長安廢墟：追黃八時去的漢長安廢墟。\n- 復活後的漢長安廢墟：安史之亂後再去的漢長安廢墟。\n# 標籤\n- 安史之亂前：只有安史之亂前（夜探安祿山府之前）拿得到或換得到。\n- 安史之亂後：安史之亂後才拿得到。\n- DOMO：DOMO 工作室的組員要的東西，見«DOMO工作室»。\n- 薩爾達：超級商人薩爾達的條件之一，見«超級商人薩爾達»。\n- 典藏版：DVD 白金典藏版新增的支線。\n- 資料片：1.02 新春賀禮更新加入的支線。\n- 典藏版和資料片的支線在 v1.02 DVD 版裡都有，OpenSWD3 都能玩到。\n# 連結\n- 點物品名或怪物名，打開物品大全或神魔異事錄的那一項。\n- 點綠色的條目名，跳到攻略裡的那一頁。\n- 左邊的篇章照遊戲流程排列，最後的「系列任務」是貫穿全程的支線。", "html": "<h3>適用版本</h3><ul><li>《軒轅劍參：雲和山的彼端》v1.02 DVD 版，也就是 OpenSWD3 對應的版本。</li><li>原版 swd3.exe 和 OpenSWD3 的流程、物品完全一樣。</li></ul><h3>攻略來源</h3><p>本攻略整合以下幾份舊攻略，按地圖重新排列：</p><ul><li><a class=\"out\" href=\"https://chiuinan.github.io/game/game/intro/ch/c11/swd3/swd3/swd3.htm\" target=\"_blank\" rel=\"noopener\">青衫《軒轅劍3圖文攻略》</a>：流程骨架、支線、寶箱。</li><li>Sanpphire（水木社區）《隱藏物品及要點攻略》：隱藏物品的位置、偷竊目標、封印之劍、薩爾達的條件與商品。</li><li><a class=\"out\" href=\"https://steamcommunity.com/sharedfiles/filedetails/?id=3010003268\" target=\"_blank\" rel=\"noopener\">莫古大哥《全地圖、全任務、全物資詳細圖文攻略》</a>：轉載自<a class=\"out\" href=\"https://www.yiming818.com/11583.html\" target=\"_blank\" rel=\"noopener\">一鳴資源網</a>，補了不少支線細節。</li><li><a class=\"out\" href=\"http://swd3.ffsky.cn/walk_z.htm\" target=\"_blank\" rel=\"noopener\">天幻網軒轅劍三專題</a>：系列任務一覽，轉載自 HOPELEA 的軒轅劍三資料集。</li></ul><h3>整合與核對</h3><ul><li>由 OpenSWD3 整合。</li><li>物品名、怪物名、偷竊目標都和遊戲資料核對過，舊攻略裡的錯字已改正。</li><li>DOMO 娃娃的組合、DOMO神打功的取得方法、典藏版與資料片支線，都查過遊戲的劇情腳本。</li><li>隱藏物品的位置描述、木人巷三條路和隨機寶箱的內容，照攻略寫，沒有逐一在遊戲裡走過。</li></ul><h3>物品的寫法</h3><p>每行一件，冒號後面是取得方式和位置。</p><ul><li>寶箱：打開寶箱得到。</li><li>地上：地上看得到的東西，走過去調查就拿到。</li><li>隱藏：看不見，要面對罈子、櫃子、草叢等按鍵調查才拿到。OpenSWD3 的「道具提示」設定會在這些地方顯示箭頭。</li><li>銀幣直接寫數目，例如「300 銀幣：寶箱」。</li></ul><h3>名詞</h3><ul><li>封印之光：地圖上的光點，第一次調查給一把<span class=\"jump items\" data-view=\"items\" data-detail=\"封印之劍@793\" title=\"在物品大全中打開\">封印之劍</span>，見<span class=\"goto\" data-title=\"封印之劍\">封印之劍</span>。</li><li>靈契：用煉妖壺收服怪物。收服的怪物可以煉化，也可以裝備成護駕。</li><li>煉化：在煉妖壺裡把兩樣東西煉成新的物品或怪物，例如 藥草＋藥草＝<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"水仙@147\" title=\"在神魔異事錄中打開\">水仙</span>。</li><li>護駕：裝備在角色「護駕」欄的怪物，戰鬥中可以召喚出來幫忙作戰。</li><li>偷竊：用偷竊指令從怪物身上拿東西，要先拿到<span class=\"jump items\" data-view=\"items\" data-detail=\"神偷面具@937\" title=\"在物品大全中打開\">神偷面具</span>或<span class=\"jump items\" data-view=\"items\" data-detail=\"乾坤袋@943\" title=\"在物品大全中打開\">乾坤袋</span>。</li><li>第一次漢長安廢墟：追黃八時去的漢長安廢墟。</li><li>復活後的漢長安廢墟：安史之亂後再去的漢長安廢墟。</li></ul><h3>標籤</h3><ul><li><span class=\"tag time\">安史之亂前</span>：只有安史之亂前（夜探安祿山府之前）拿得到或換得到。</li><li><span class=\"tag time\">安史之亂後</span>：安史之亂後才拿得到。</li><li><span class=\"tag domo\">DOMO</span>：DOMO 工作室的組員要的東西，見<span class=\"goto\" data-title=\"DOMO工作室\">DOMO工作室</span>。</li><li><span class=\"tag sarda\">薩爾達</span>：超級商人薩爾達的條件之一，見<span class=\"goto\" data-title=\"超級商人薩爾達\">超級商人薩爾達</span>。</li><li><span class=\"tag edition\">典藏版</span>：DVD 白金典藏版新增的支線。</li><li><span class=\"tag edition\">資料片</span>：1.02 新春賀禮更新加入的支線。</li><li>典藏版和資料片的支線在 v1.02 DVD 版裡都有，OpenSWD3 都能玩到。</li></ul><h3>連結</h3><ul><li>點物品名或怪物名，打開物品大全或神魔異事錄的那一項。</li><li>點綠色的條目名，跳到攻略裡的那一頁。</li><li>左邊的篇章照遊戲流程排列，最後的「系列任務」是貫穿全程的支線。</li></ul>"}, {"chapter": "歐洲", "title": "威尼斯", "text": "威尼斯\n# 流程\n1. 酒館裡打倒兩名法蘭克騎士梅羅文加軍人。\n2. 得知阿拉伯商人被關在教堂。\n3. 教堂守衛森嚴進不去。教堂旁樹林的小路克說，墓園有通往教堂的地道。\n4. 到墓園，調查左上角的無字墓碑。接下來見«墓園與地道»。\n# 大廣場\n- 結纍葡萄：地上，去教堂的路左側\n- 解毒草：地上，左下路旁\n- 博落迴之根：地上，左下路旁\n- 頭巾：寶箱，武器店外\n- 無酵餅：寶箱，右上河邊\n- 絕情貓袖箭：連續敲廣場中央的鐘 20 下（攻擊 +70，妮可前期最強武器）\n# 護民官的家（廣場右上）\n- 頭巾：一樓寶箱\n- 魔法葉：一樓寶箱\n- 無酵餅：二樓樓梯對面罈子右側（隱藏）\n- 靈界指標：二樓床頭櫃（隱藏）\n- 還神果：二樓最右側圓桌上的瓶子\n# 河邊民房（派恩家左側）\n- 魯特琴：一樓進門左側箱子（隱藏）DOMO\n- 魔法葉：二樓白色罈子（隱藏）\n- 藥草：二樓最右側圓桌\n# 教堂前\n- 藥草×2：地上，過橋兩側\n- 銅戒指：井裡（隱藏）\n# 住宅區（左廣場）\n- 山蛇莓：地上，旅館左側樹叢 DOMO\n- 解毒草：左下過橋後，路左側的桶（隱藏）\n# 法蘭克關隘（威尼斯東北）\n- 魔法葉：地上，士兵右下\n- 最後軒轅劍開封後，調查士兵右側的木桶，可看到遊戲最後修改的日期。\n# 支線：花語\n1. 廣場西邊的尤金托你問蒙妮卡，黃色鬱金香是什麼意思。\n2. 到住宅區過橋找蒙妮卡。\n3. 回去告訴尤金，得結纍葡萄。\n# 支線：紅寶石戒指\n1. 廣場左下的珠寶商布爾諾缺紅寶石。\n2. 從護民官家右側的小巷進去，找阿拉伯商人西魯士（旁邊還有無酵餅）。\n3. 花 80 銀幣買紅寶石戒指。\n4. 交給布爾諾，退回 80 銀幣，另得棉布衣。\n# 支線：生日禮物\n1. 住宅區橋邊的陶德托你買珍珠。\n2. 和廣場下邊的漁夫派恩說話。\n3. 到河邊派恩家，向他妻子潘朵拉買珍珠。\n4. 交給陶德，得 50 銀幣和藥草。\n# 支線：賈西的姪子\n1. 運河邊屋中的賈西擔心姪子亨利。\n2. 到法蘭克關隘找亨利。\n3. 回來告訴賈西，得 100 銀幣。\n4. 再去找亨利，得無酵餅。\n# 支線：獵人的算術 典藏版\n1. 和住宅區左下橋頭的獵人亞雷說話。\n2. 答「1 分 15 秒」，得十果粉。", "html": "<h3>流程</h3><ol><li>酒館裡打倒兩名法蘭克騎士<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"梅羅文加軍人@400\" title=\"在神魔異事錄中打開\">梅羅文加軍人</span>。</li><li>得知阿拉伯商人被關在教堂。</li><li>教堂守衛森嚴進不去。教堂旁樹林的小路克說，墓園有通往教堂的地道。</li><li>到墓園，調查左上角的無字墓碑。接下來見<span class=\"goto\" data-title=\"墓園與地道\">墓園與地道</span>。</li></ol><h3>大廣場</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"結纍葡萄@622\" title=\"在物品大全中打開\">結纍葡萄</span>：地上，去教堂的路左側</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"解毒草@647\" title=\"在物品大全中打開\">解毒草</span>：地上，左下路旁</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"博落迴之根@719\" title=\"在物品大全中打開\">博落迴之根</span>：地上，左下路旁</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"頭巾@1019\" title=\"在物品大全中打開\">頭巾</span>：寶箱，武器店外</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"無酵餅@624\" title=\"在物品大全中打開\">無酵餅</span>：寶箱，右上河邊</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"絕情貓袖箭@533\" title=\"在物品大全中打開\">絕情貓袖箭</span>：連續敲廣場中央的鐘 20 下（攻擊 +70，妮可前期最強武器）</li></ul><h3>護民官的家（廣場右上）</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"頭巾@1019\" title=\"在物品大全中打開\">頭巾</span>：一樓寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"魔法葉@636\" title=\"在物品大全中打開\">魔法葉</span>：一樓寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"無酵餅@624\" title=\"在物品大全中打開\">無酵餅</span>：二樓樓梯對面罈子右側（隱藏）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"靈界指標@769\" title=\"在物品大全中打開\">靈界指標</span>：二樓床頭櫃（隱藏）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"還神果@653\" title=\"在物品大全中打開\">還神果</span>：二樓最右側圓桌上的瓶子</li></ul><h3>河邊民房（派恩家左側）</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"魯特琴@829\" title=\"在物品大全中打開\">魯特琴</span>：一樓進門左側箱子（隱藏）<span class=\"tag domo\">DOMO</span></li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"魔法葉@636\" title=\"在物品大全中打開\">魔法葉</span>：二樓白色罈子（隱藏）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"藥草@621\" title=\"在物品大全中打開\">藥草</span>：二樓最右側圓桌</li></ul><h3>教堂前</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"藥草@621\" title=\"在物品大全中打開\">藥草</span>×2：地上，過橋兩側</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"銅戒指@971\" title=\"在物品大全中打開\">銅戒指</span>：井裡（隱藏）</li></ul><h3>住宅區（左廣場）</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"山蛇莓@722\" title=\"在物品大全中打開\">山蛇莓</span>：地上，旅館左側樹叢 <span class=\"tag domo\">DOMO</span></li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"解毒草@647\" title=\"在物品大全中打開\">解毒草</span>：左下過橋後，路左側的桶（隱藏）</li></ul><h3>法蘭克關隘（威尼斯東北）</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"魔法葉@636\" title=\"在物品大全中打開\">魔法葉</span>：地上，士兵右下</li><li>最後軒轅劍開封後，調查士兵右側的木桶，可看到遊戲最後修改的日期。</li></ul><h3>支線：花語</h3><ol><li>廣場西邊的尤金托你問蒙妮卡，黃色鬱金香是什麼意思。</li><li>到住宅區過橋找蒙妮卡。</li><li>回去告訴尤金，得<span class=\"jump items\" data-view=\"items\" data-detail=\"結纍葡萄@622\" title=\"在物品大全中打開\">結纍葡萄</span>。</li></ol><h3>支線：紅寶石戒指</h3><ol><li>廣場左下的珠寶商布爾諾缺紅寶石。</li><li>從護民官家右側的小巷進去，找阿拉伯商人西魯士（旁邊還有<span class=\"jump items\" data-view=\"items\" data-detail=\"無酵餅@624\" title=\"在物品大全中打開\">無酵餅</span>）。</li><li>花 80 銀幣買<span class=\"jump items\" data-view=\"items\" data-detail=\"紅寶石戒指@766\" title=\"在物品大全中打開\">紅寶石戒指</span>。</li><li>交給布爾諾，退回 80 銀幣，另得<span class=\"jump items\" data-view=\"items\" data-detail=\"棉布衣@1003\" title=\"在物品大全中打開\">棉布衣</span>。</li></ol><h3>支線：生日禮物</h3><ol><li>住宅區橋邊的陶德托你買珍珠。</li><li>和廣場下邊的漁夫派恩說話。</li><li>到河邊派恩家，向他妻子潘朵拉買<span class=\"jump items\" data-view=\"items\" data-detail=\"珍珠@767\" title=\"在物品大全中打開\">珍珠</span>。</li><li>交給陶德，得 50 銀幣和<span class=\"jump items\" data-view=\"items\" data-detail=\"藥草@621\" title=\"在物品大全中打開\">藥草</span>。</li></ol><h3>支線：賈西的姪子</h3><ol><li>運河邊屋中的賈西擔心姪子亨利。</li><li>到法蘭克關隘找亨利。</li><li>回來告訴賈西，得 100 銀幣。</li><li>再去找亨利，得<span class=\"jump items\" data-view=\"items\" data-detail=\"無酵餅@624\" title=\"在物品大全中打開\">無酵餅</span>。</li></ol><h3>支線：獵人的算術 <span class=\"tag edition\">典藏版</span></h3><ol><li>和住宅區左下橋頭的獵人亞雷說話。</li><li>答「1 分 15 秒」，得<span class=\"jump items\" data-view=\"items\" data-detail=\"十果粉@626\" title=\"在物品大全中打開\">十果粉</span>。</li></ol>"}, {"chapter": "歐洲", "title": "墓園與地道", "text": "墓園與地道\n# 墓園\n- 調查左上角的無字墓碑，拉起拉環，進入地道。\n# 支線：財產分配\n1. 和墓園的婦人說話。\n2. 答「分 7 份：兒子 4、妻子 2、女兒 1」。\n3. 得藥草×2 和 100 銀幣。\n# 支線：數學家的年齡\n1. 調查上面數學家的墓碑。\n2. 答「84」，得知教堂壁畫裡有寶物（見«教堂»）。\n3. 再靠近墓碑一次，得玫瑰DOMO。\n# 支線：小狗開會（妮可加入後）\n1. 帶妮可到住宅區路燈下，和三隻狗說話。\n2. 妮可翻譯出墓園石頭上有寶物。\n3. 到墓園右上的石頭調查，得空白符紙。\n# 地道\n- 20 銀幣：寶箱\n- 藥草：寶箱\n- 諸方神石：寶箱\n- 結纍葡萄：寶箱\n- 藥草：地上，第八幕中間\n- 解毒草：第二幕下方小門裡，上面的草叢（隱藏）\n- 長劍：第五幕瀑布後面（隱藏）\n- 封印之劍（1）：封印之光\n# BOSS\n- 獢", "html": "<h3>墓園</h3><ul><li>調查左上角的無字墓碑，拉起拉環，進入地道。</li></ul><h3>支線：財產分配</h3><ol><li>和墓園的婦人說話。</li><li>答「分 7 份：兒子 4、妻子 2、女兒 1」。</li><li>得<span class=\"jump items\" data-view=\"items\" data-detail=\"藥草@621\" title=\"在物品大全中打開\">藥草</span>×2 和 100 銀幣。</li></ol><h3>支線：數學家的年齡</h3><ol><li>調查上面數學家的墓碑。</li><li>答「84」，得知教堂壁畫裡有寶物（見<span class=\"goto\" data-title=\"教堂\">教堂</span>）。</li><li>再靠近墓碑一次，得<span class=\"jump items\" data-view=\"items\" data-detail=\"玫瑰@824\" title=\"在物品大全中打開\">玫瑰</span><span class=\"tag domo\">DOMO</span>。</li></ol><h3>支線：小狗開會（妮可加入後）</h3><ol><li>帶妮可到住宅區路燈下，和三隻狗說話。</li><li>妮可翻譯出墓園石頭上有寶物。</li><li>到墓園右上的石頭調查，得<span class=\"jump items\" data-view=\"items\" data-detail=\"空白符紙@768\" title=\"在物品大全中打開\">空白符紙</span>。</li></ol><h3>地道</h3><ul><li>20 銀幣：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"藥草@621\" title=\"在物品大全中打開\">藥草</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"諸方神石@698\" title=\"在物品大全中打開\">諸方神石</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"結纍葡萄@622\" title=\"在物品大全中打開\">結纍葡萄</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"藥草@621\" title=\"在物品大全中打開\">藥草</span>：地上，第八幕中間</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"解毒草@647\" title=\"在物品大全中打開\">解毒草</span>：第二幕下方小門裡，上面的草叢（隱藏）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"長劍@502\" title=\"在物品大全中打開\">長劍</span>：第五幕瀑布後面（隱藏）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"封印之劍@793\" title=\"在物品大全中打開\">封印之劍</span>（1）：封印之光</li></ul><h3>BOSS</h3><ul><li><span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"獢@130\" title=\"在神魔異事錄中打開\">獢</span></li></ul>"}, {"chapter": "歐洲", "title": "教堂", "text": "教堂\n# 流程\n1. 出地道到教堂後院，和約瑟修士說話（可補滿體力）。\n2. 得知要先打開教堂左右兩座塔頂的開關。\n3. 兩個開關都打開後，祭壇下出現秘門。\n4. 到地牢救出囚犯。\n5. 給左側牢房的老人清水，他在祭壇畫六芒星，召喚出妮可。\n6. 到廣場救阿拉伯商人，打敗麥爾斯。\n7. 到威尼斯右下的海洞，得知航海圖被送到修道院。\n8. 中國瓷壺變成煉妖壺，學會靈契。\n# 教堂後院\n- 魔法葉：地上，地道口上方\n- 結纍葡萄：地上，左下\n- 解毒草：地上，右下\n- 藥草：地上，過橋右側\n- 銅戒指：約瑟修士右上的樹（隱藏）\n# 教堂內\n- 結纍葡萄：寶箱，右塔二樓\n- 回復劑：寶箱，左塔一樓\n- 魔法葉：寶箱，大廳右上\n# 教堂內（解出墓園數學題後）\n- 無酵餅：祭壇左側壁畫（隱藏）\n- 結纍葡萄：祭壇右側壁畫（隱藏）\n- 鐵鎖手套：中間燭台（隱藏）\n# 地牢\n- 50 銀幣：寶箱\n- 皮手套：寶箱\n- 無酵餅：桌上（隱藏）", "html": "<h3>流程</h3><ol><li>出地道到教堂後院，和約瑟修士說話（可補滿體力）。</li><li>得知要先打開教堂左右兩座塔頂的開關。</li><li>兩個開關都打開後，祭壇下出現秘門。</li><li>到地牢救出囚犯。</li><li>給左側牢房的老人<span class=\"jump items\" data-view=\"items\" data-detail=\"清水@732\" title=\"在物品大全中打開\">清水</span>，他在祭壇畫六芒星，召喚出妮可。</li><li>到廣場救阿拉伯商人，打敗<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"麥爾斯@4\" title=\"在神魔異事錄中打開\">麥爾斯</span>。</li><li>到威尼斯右下的海洞，得知航海圖被送到修道院。</li><li>中國瓷壺變成<span class=\"jump items\" data-view=\"items\" data-detail=\"煉妖壺@731\" title=\"在物品大全中打開\">煉妖壺</span>，學會靈契。</li></ol><h3>教堂後院</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"魔法葉@636\" title=\"在物品大全中打開\">魔法葉</span>：地上，地道口上方</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"結纍葡萄@622\" title=\"在物品大全中打開\">結纍葡萄</span>：地上，左下</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"解毒草@647\" title=\"在物品大全中打開\">解毒草</span>：地上，右下</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"藥草@621\" title=\"在物品大全中打開\">藥草</span>：地上，過橋右側</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"銅戒指@971\" title=\"在物品大全中打開\">銅戒指</span>：約瑟修士右上的樹（隱藏）</li></ul><h3>教堂內</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"結纍葡萄@622\" title=\"在物品大全中打開\">結纍葡萄</span>：寶箱，右塔二樓</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"回復劑@625\" title=\"在物品大全中打開\">回復劑</span>：寶箱，左塔一樓</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"魔法葉@636\" title=\"在物品大全中打開\">魔法葉</span>：寶箱，大廳右上</li></ul><h3>教堂內（解出墓園數學題後）</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"無酵餅@624\" title=\"在物品大全中打開\">無酵餅</span>：祭壇左側壁畫（隱藏）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"結纍葡萄@622\" title=\"在物品大全中打開\">結纍葡萄</span>：祭壇右側壁畫（隱藏）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"鐵鎖手套@873\" title=\"在物品大全中打開\">鐵鎖手套</span>：中間燭台（隱藏）</li></ul><h3>地牢</h3><ul><li>50 銀幣：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"皮手套@872\" title=\"在物品大全中打開\">皮手套</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"無酵餅@624\" title=\"在物品大全中打開\">無酵餅</span>：桌上（隱藏）</li></ul>"}, {"chapter": "歐洲", "title": "修道院", "text": "修道院\n# 流程\n1. 修道院在威尼斯左上方。從大廳右側門下地道。\n2. 和左側牢房的女犯人蓓姬說話。\n3. 回去調查右上的石獅，答「VI VI VI」（666），放出囚犯。\n4. 潔西卡給你密道鑰匙。\n5. 打敗修道院院長，得航海圖、六芒星陣，學會煉妖。\n6. 出門遇麥爾斯，妮可召喚姆斯比爾，眾人被打敗。\n# 院外\n- 龍舌蘭：地上，院子右側樹叢\n# 大廳\n- 左側地板是音階：左上到右下依次是 7 8／5 6／3 4／1 2。\n- 還魄丹：第一個寶箱，按 5334221234555（小蜜蜂）\n- 空白符紙：之後出現的第二個寶箱，按 11556654433221（小星星前兩句）\n# 地道\n- 靈界指標×5：左下的石獅是魔界商人，買過東西後送\n- 50 銀幣×2：寶箱\n- 20 銀幣：寶箱\n- 藥草×4：寶箱\n- 解毒草：寶箱\n- 回復劑：寶箱\n- 諸方神石：寶箱\n- 結纍葡萄：寶箱\n- 鋼靴：寶箱\n- 魔法葉：寶箱\n- 還魄丹：寶箱\n- 獵弓：密室寶箱，開箱要打一場\n- 羽翼劍、100 銀幣：封印之光下面小路盡頭\n- 封印之劍（2）：封印之光\n- 虎皮衣：地道上方打敗阿加希歐\n# 支線：小教士 典藏版\n1. 和院外右邊樹林裡的小教士說話。\n2. 答「猶大」，得回復劑×2。", "html": "<h3>流程</h3><ol><li>修道院在威尼斯左上方。從大廳右側門下地道。</li><li>和左側牢房的女犯人蓓姬說話。</li><li>回去調查右上的石獅，答「VI VI VI」（666），放出囚犯。</li><li>潔西卡給你<span class=\"jump items\" data-view=\"items\" data-detail=\"密道鑰匙@764\" title=\"在物品大全中打開\">密道鑰匙</span>。</li><li>打敗<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"修道院院長@399\" title=\"在神魔異事錄中打開\">修道院院長</span>，得<span class=\"jump items\" data-view=\"items\" data-detail=\"航海圖@765\" title=\"在物品大全中打開\">航海圖</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"六芒星陣@770\" title=\"在物品大全中打開\">六芒星陣</span>，學會煉妖。</li><li>出門遇麥爾斯，妮可召喚<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"姆斯比爾@6\" title=\"在神魔異事錄中打開\">姆斯比爾</span>，眾人被打敗。</li></ol><h3>院外</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"龍舌蘭@718\" title=\"在物品大全中打開\">龍舌蘭</span>：地上，院子右側樹叢</li></ul><h3>大廳</h3><ul><li>左側地板是音階：左上到右下依次是 7 8／5 6／3 4／1 2。</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"還魄丹@644\" title=\"在物品大全中打開\">還魄丹</span>：第一個寶箱，按 5334221234555（小蜜蜂）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"空白符紙@768\" title=\"在物品大全中打開\">空白符紙</span>：之後出現的第二個寶箱，按 11556654433221（小星星前兩句）</li></ul><h3>地道</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"靈界指標@769\" title=\"在物品大全中打開\">靈界指標</span>×5：左下的石獅是魔界商人，買過東西後送</li><li>50 銀幣×2：寶箱</li><li>20 銀幣：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"藥草@621\" title=\"在物品大全中打開\">藥草</span>×4：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"解毒草@647\" title=\"在物品大全中打開\">解毒草</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"回復劑@625\" title=\"在物品大全中打開\">回復劑</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"諸方神石@698\" title=\"在物品大全中打開\">諸方神石</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"結纍葡萄@622\" title=\"在物品大全中打開\">結纍葡萄</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"鋼靴@907\" title=\"在物品大全中打開\">鋼靴</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"魔法葉@636\" title=\"在物品大全中打開\">魔法葉</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"還魄丹@644\" title=\"在物品大全中打開\">還魄丹</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"獵弓@523\" title=\"在物品大全中打開\">獵弓</span>：密室寶箱，開箱要打一場</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"羽翼劍@503\" title=\"在物品大全中打開\">羽翼劍</span>、100 銀幣：封印之光下面小路盡頭</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"封印之劍@793\" title=\"在物品大全中打開\">封印之劍</span>（2）：封印之光</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"虎皮衣@1005\" title=\"在物品大全中打開\">虎皮衣</span>：地道上方打敗<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"阿加希歐@129\" title=\"在神魔異事錄中打開\">阿加希歐</span></li></ul><h3>支線：小教士 <span class=\"tag edition\">典藏版</span></h3><ol><li>和院外右邊樹林裡的小教士說話。</li><li>答「猶大」，得<span class=\"jump items\" data-view=\"items\" data-detail=\"回復劑@625\" title=\"在物品大全中打開\">回復劑</span>×2。</li></ol>"}, {"chapter": "歐洲", "title": "潔西卡家地窖", "text": "潔西卡家地窖\n# 位置\n從修道院出來後，回威尼斯住宅區下邊潔西卡與貝絲的家，用密道鑰匙開門。\n# 物品\n- 薩登荊環：寶箱（攻擊最多加五成）\n- 聖皇手套：寶箱\n- 靈界指標、空白符紙：寶箱\n- 回復劑：寶箱\n- 銀項鍊：寶箱\n# 這時順便\n- 聖皇靴：威尼斯酒屋後面的一堆桶裡（隱藏）資料片", "html": "<h3>位置</h3><p>從修道院出來後，回威尼斯住宅區下邊潔西卡與貝絲的家，用<span class=\"jump items\" data-view=\"items\" data-detail=\"密道鑰匙@764\" title=\"在物品大全中打開\">密道鑰匙</span>開門。</p><h3>物品</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"薩登荊環@931\" title=\"在物品大全中打開\">薩登荊環</span>：寶箱（攻擊最多加五成）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"聖皇手套@876\" title=\"在物品大全中打開\">聖皇手套</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"靈界指標@769\" title=\"在物品大全中打開\">靈界指標</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"空白符紙@768\" title=\"在物品大全中打開\">空白符紙</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"回復劑@625\" title=\"在物品大全中打開\">回復劑</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"銀項鍊@987\" title=\"在物品大全中打開\">銀項鍊</span>：寶箱</li></ul><h3>這時順便</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"聖皇靴@908\" title=\"在物品大全中打開\">聖皇靴</span>：威尼斯酒屋後面的一堆桶裡（隱藏）<span class=\"tag edition\">資料片</span></li></ul>"}, {"chapter": "歐洲", "title": "青苔石迷宮", "text": "青苔石迷宮\n# 流程\n1. 回海洞，得知兩個阿拉伯人去威尼斯西南的海盜秘密洞穴找食物和水。\n2. 在第二層找到他們。\n3. 打敗弒肉妖，得硃砂神筆（煉符指令）。\n# 第一層\n- 結纍葡萄：寶箱\n- 無酵餅：寶箱\n- 魔法葉：寶箱\n- 40 銀幣：寶箱\n- 地炎玉：寶箱（抗火 60%）\n# 第二層\n- 藥草：寶箱\n- 還魄丹：寶箱\n- 魔法葉：寶箱\n- 諸方神石：寶箱", "html": "<h3>流程</h3><ol><li>回海洞，得知兩個阿拉伯人去威尼斯西南的海盜秘密洞穴找食物和水。</li><li>在第二層找到他們。</li><li>打敗<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"弒肉妖@396\" title=\"在神魔異事錄中打開\">弒肉妖</span>，得<span class=\"jump items\" data-view=\"items\" data-detail=\"硃砂神筆@933\" title=\"在物品大全中打開\">硃砂神筆</span>（煉符指令）。</li></ol><h3>第一層</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"結纍葡萄@622\" title=\"在物品大全中打開\">結纍葡萄</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"無酵餅@624\" title=\"在物品大全中打開\">無酵餅</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"魔法葉@636\" title=\"在物品大全中打開\">魔法葉</span>：寶箱</li><li>40 銀幣：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"地炎玉@929\" title=\"在物品大全中打開\">地炎玉</span>：寶箱（抗火 60%）</li></ul><h3>第二層</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"藥草@621\" title=\"在物品大全中打開\">藥草</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"還魄丹@644\" title=\"在物品大全中打開\">還魄丹</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"魔法葉@636\" title=\"在物品大全中打開\">魔法葉</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"諸方神石@698\" title=\"在物品大全中打開\">諸方神石</span>：寶箱</li></ul>"}, {"chapter": "歐洲", "title": "海戰", "text": "海戰\n# 流程\n1. 出海後，遇法蘭克人與威尼斯水軍交戰。\n2. 往西和護民官說話。幫不幫都行，不幫的話船上的敵人會多一種。之後和他說話可補滿體力。\n3. 往東最左邊的船上遇康那里士，他召喚出一座島，法蘭克人逃上島。\n# 物品\n- 回復劑：寶箱", "html": "<h3>流程</h3><ol><li>出海後，遇法蘭克人與威尼斯水軍交戰。</li><li>往西和護民官說話。幫不幫都行，不幫的話船上的敵人會多一種。之後和他說話可補滿體力。</li><li>往東最左邊的船上遇<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"康那里士@7\" title=\"在神魔異事錄中打開\">康那里士</span>，他召喚出一座島，法蘭克人逃上島。</li></ol><h3>物品</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"回復劑@625\" title=\"在物品大全中打開\">回復劑</span>：寶箱</li></ul>"}, {"chapter": "移動島", "title": "擱淺船與東北密洞", "text": "擱淺船與東北密洞\n# 擱淺船（島右邊）\n- 鐵戒指：寶箱\n- 武聖手鐲：隱藏船艙裡，樓梯對面的罈子（隱藏，連擊指令）\n- 蛇鱗衣：櫃子（隱藏）\n# 東北密洞\n要在石像轟擊冰山之前去，之後洞口會被封住。\n- 諸方神石：寶箱\n- 300 銀幣：寶箱\n- 銀笛：寶箱\n# 支線：阿高司\n1. 在洞裡用靈契收服妖貓和牛頭魚。\n2. 帶著牠們打開最裡面的寶箱，換得阿高司（目前最好的護駕）。", "html": "<h3>擱淺船（島右邊）</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"鐵戒指@972\" title=\"在物品大全中打開\">鐵戒指</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"武聖手鐲@932\" title=\"在物品大全中打開\">武聖手鐲</span>：隱藏船艙裡，樓梯對面的罈子（隱藏，連擊指令）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"蛇鱗衣@1006\" title=\"在物品大全中打開\">蛇鱗衣</span>：櫃子（隱藏）</li></ul><h3>東北密洞</h3><p>要在石像轟擊冰山之前去，之後洞口會被封住。</p><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"諸方神石@698\" title=\"在物品大全中打開\">諸方神石</span>：寶箱</li><li>300 銀幣：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"銀笛@983\" title=\"在物品大全中打開\">銀笛</span>：寶箱</li></ul><h3>支線：阿高司</h3><ol><li>在洞裡用靈契收服<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"妖貓@140\" title=\"在神魔異事錄中打開\">妖貓</span>和<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"牛頭魚@141\" title=\"在神魔異事錄中打開\">牛頭魚</span>。</li><li>帶著牠們打開最裡面的寶箱，換得<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"阿高司@174\" title=\"在神魔異事錄中打開\">阿高司</span>（目前最好的護駕）。</li></ol>"}, {"chapter": "移動島", "title": "移動島城堡", "text": "移動島城堡\n# 流程\n1. 進城堡，大廳有旅館和商店。\n2. 二樓、三樓、四樓扳機關開橋。\n3. 頂樓打敗康那里士，得吸血鬼指環。\n4. 撿起地上的羽翼劍。\n5. 向門外的護民官報告，島開始移動。\n6. 庭院的石像出兩個考驗。\n7. 考驗一：到瞭望台中間的門裡，打敗高地骷髏妖，得冥海神石。\n8. 考驗二：回到過去打敗姆斯比爾。\n# 大廳\n- 封印之劍（3）：封印之光\n- 阿丹借你水晶鏡。多和他說幾次話，得知水晶鏡的另一個用法，再去瞭望台可看到一段動畫。\n# 城堡外圍\n- 魔貝粉：寶箱\n# 二樓\n- 安碧特麗之冠：寶箱\n- 結纍葡萄：寶箱\n- 藥草×4：地上\n- 延胡索之花：地上\n- 封印之劍（4）：封印之光\n# 三樓\n- 溶石藥劑：寶箱\n- 魔晶粉×2：寶箱\n- 還魄丹×2：寶箱\n- 魔貝粉：寶箱\n- 300 銀幣：寶箱\n- 回復劑：寶箱\n- 左上三個寶箱只能開一個，內容隨機：烏紋弓、聖石榴，或打一場邪靈。\n# 四樓（浮島機關）\n- 聖皇之鎧：寶箱\n- 諸方神石：寶箱\n- 300 銀幣：寶箱，右數第二列最上面的開關是拿它的關鍵\n- 封印之劍（5）：封印之光\n# 頂樓\n- 羽翼劍：地上\n# 提示\n- 和格萊艾的戰鬥中，可以用諸方神石換回復藥。", "html": "<h3>流程</h3><ol><li>進城堡，大廳有旅館和商店。</li><li>二樓、三樓、四樓扳機關開橋。</li><li>頂樓打敗<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"康那里士@7\" title=\"在神魔異事錄中打開\">康那里士</span>，得<span class=\"jump items\" data-view=\"items\" data-detail=\"吸血鬼指環@934\" title=\"在物品大全中打開\">吸血鬼指環</span>。</li><li>撿起地上的<span class=\"jump items\" data-view=\"items\" data-detail=\"羽翼劍@503\" title=\"在物品大全中打開\">羽翼劍</span>。</li><li>向門外的護民官報告，島開始移動。</li><li>庭院的石像出兩個考驗。</li><li>考驗一：到瞭望台中間的門裡，打敗<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"高地骷髏妖@395\" title=\"在神魔異事錄中打開\">高地骷髏妖</span>，得<span class=\"jump items\" data-view=\"items\" data-detail=\"冥海神石@787\" title=\"在物品大全中打開\">冥海神石</span>。</li><li>考驗二：回到過去打敗<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"姆斯比爾@6\" title=\"在神魔異事錄中打開\">姆斯比爾</span>。</li></ol><h3>大廳</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"封印之劍@793\" title=\"在物品大全中打開\">封印之劍</span>（3）：封印之光</li><li>阿丹借你<span class=\"jump items\" data-view=\"items\" data-detail=\"水晶鏡@788\" title=\"在物品大全中打開\">水晶鏡</span>。多和他說幾次話，得知水晶鏡的另一個用法，再去瞭望台可看到一段動畫。</li></ul><h3>城堡外圍</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"魔貝粉@627\" title=\"在物品大全中打開\">魔貝粉</span>：寶箱</li></ul><h3>二樓</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"安碧特麗之冠@1022\" title=\"在物品大全中打開\">安碧特麗之冠</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"結纍葡萄@622\" title=\"在物品大全中打開\">結纍葡萄</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"藥草@621\" title=\"在物品大全中打開\">藥草</span>×4：地上</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"延胡索之花@726\" title=\"在物品大全中打開\">延胡索之花</span>：地上</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"封印之劍@793\" title=\"在物品大全中打開\">封印之劍</span>（4）：封印之光</li></ul><h3>三樓</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"溶石藥劑@651\" title=\"在物品大全中打開\">溶石藥劑</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"魔晶粉@637\" title=\"在物品大全中打開\">魔晶粉</span>×2：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"還魄丹@644\" title=\"在物品大全中打開\">還魄丹</span>×2：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"魔貝粉@627\" title=\"在物品大全中打開\">魔貝粉</span>：寶箱</li><li>300 銀幣：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"回復劑@625\" title=\"在物品大全中打開\">回復劑</span>：寶箱</li><li>左上三個寶箱只能開一個，內容隨機：<span class=\"jump items\" data-view=\"items\" data-detail=\"烏紋弓@528\" title=\"在物品大全中打開\">烏紋弓</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"聖石榴@623\" title=\"在物品大全中打開\">聖石榴</span>，或打一場邪靈。</li></ul><h3>四樓（浮島機關）</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"聖皇之鎧@853\" title=\"在物品大全中打開\">聖皇之鎧</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"諸方神石@698\" title=\"在物品大全中打開\">諸方神石</span>：寶箱</li><li>300 銀幣：寶箱，右數第二列最上面的開關是拿它的關鍵</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"封印之劍@793\" title=\"在物品大全中打開\">封印之劍</span>（5）：封印之光</li></ul><h3>頂樓</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"羽翼劍@503\" title=\"在物品大全中打開\">羽翼劍</span>：地上</li></ul><h3>提示</h3><ul><li>和<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"格萊艾@136\" title=\"在神魔異事錄中打開\">格萊艾</span>的戰鬥中，可以用<span class=\"jump items\" data-view=\"items\" data-detail=\"諸方神石@698\" title=\"在物品大全中打開\">諸方神石</span>換回復藥。</li></ul>"}, {"chapter": "移動島", "title": "冰山島", "text": "冰山島\n# 流程\n1. 海上冰山撞上移動島，藍人凍住眾人。\n2. 跟去冰山島，在洞裡找到波希頓石像。\n3. 把石像帶回庭院，石像讓火山爆發，炸開冰山。\n4. 從炸開的門進去，打敗藍魔神，救出眾人和女船長薇達。\n5. 石像又轟了一塊熔岩，要在 5 分鐘內（含戰鬥）逃出冰山。\n6. 回庭院打敗冰魔薇達，再打敗藍魔神本體。\n7. 搭薇達的船到貝魯特。\n# 洞穴\n- 空白符紙：寶箱\n- 靈界指標：寶箱\n- 回復劑×2：寶箱\n- 藥草×10：寶箱\n- 諸方神石：寶箱\n- 神奇麵包：寶箱，要先投入 10 個藥草\n- 水靈珠：進洞後往右的場景，上方冰柱（隱藏，抗冰 60%）\n# 注意\n- 途中有瓶女假扮的莉蓮。\n- 選「救」：賽特陷入瀕死。\n- 選「不救」：和瓶女戰鬥。\n# 炸開之後\n- 魔貝粉：寶箱\n- 還魄丹：寶箱\n- 妖精麥粉：寶箱，要 300 銀幣\n- 紫藤葉：地上", "html": "<h3>流程</h3><ol><li>海上冰山撞上移動島，藍人凍住眾人。</li><li>跟去冰山島，在洞裡找到<span class=\"jump items\" data-view=\"items\" data-detail=\"波希頓石像@791\" title=\"在物品大全中打開\">波希頓石像</span>。</li><li>把石像帶回庭院，石像讓火山爆發，炸開冰山。</li><li>從炸開的門進去，打敗<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"藍魔神@13\" title=\"在神魔異事錄中打開\">藍魔神</span>，救出眾人和女船長薇達。</li><li>石像又轟了一塊熔岩，要在 5 分鐘內（含戰鬥）逃出冰山。</li><li>回庭院打敗<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"冰魔薇達@60\" title=\"在神魔異事錄中打開\">冰魔薇達</span>，再打敗<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"藍魔神@13\" title=\"在神魔異事錄中打開\">藍魔神</span>本體。</li><li>搭薇達的船到貝魯特。</li></ol><h3>洞穴</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"空白符紙@768\" title=\"在物品大全中打開\">空白符紙</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"靈界指標@769\" title=\"在物品大全中打開\">靈界指標</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"回復劑@625\" title=\"在物品大全中打開\">回復劑</span>×2：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"藥草@621\" title=\"在物品大全中打開\">藥草</span>×10：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"諸方神石@698\" title=\"在物品大全中打開\">諸方神石</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"神奇麵包@672\" title=\"在物品大全中打開\">神奇麵包</span>：寶箱，要先投入 10 個<span class=\"jump items\" data-view=\"items\" data-detail=\"藥草@621\" title=\"在物品大全中打開\">藥草</span></li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"水靈珠@936\" title=\"在物品大全中打開\">水靈珠</span>：進洞後往右的場景，上方冰柱（隱藏，抗冰 60%）</li></ul><h3>注意</h3><ul><li>途中有瓶女假扮的莉蓮。</li><li>選「救」：賽特陷入瀕死。</li><li>選「不救」：和<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"瓶女@139\" title=\"在神魔異事錄中打開\">瓶女</span>戰鬥。</li></ul><h3>炸開之後</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"魔貝粉@627\" title=\"在物品大全中打開\">魔貝粉</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"還魄丹@644\" title=\"在物品大全中打開\">還魄丹</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"妖精麥粉@674\" title=\"在物品大全中打開\">妖精麥粉</span>：寶箱，要 300 銀幣</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"紫藤葉@725\" title=\"在物品大全中打開\">紫藤葉</span>：地上</li></ul>"}, {"chapter": "阿拉伯", "title": "貝魯特", "text": "貝魯特\n# 物品\n- 魔法葉：穆南比家左上的罈子（隱藏）\n# 支線：艾德的問題 典藏版\n1. 和小商店的商人艾德說話。\n2. 答「兩天兩小時」，得玉戒指（«宗楚客的玉器»之一）。", "html": "<h3>物品</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"魔法葉@636\" title=\"在物品大全中打開\">魔法葉</span>：穆南比家左上的罈子（隱藏）</li></ul><h3>支線：艾德的問題 <span class=\"tag edition\">典藏版</span></h3><ol><li>和小商店的商人艾德說話。</li><li>答「兩天兩小時」，得<span class=\"jump items\" data-view=\"items\" data-detail=\"玉戒指@975\" title=\"在物品大全中打開\">玉戒指</span>（<span class=\"goto\" data-title=\"宗楚客的玉器\">宗楚客的玉器</span>之一）。</li></ol>"}, {"chapter": "阿拉伯", "title": "大馬士革", "text": "大馬士革\n# 流程\n1. 在占卜屋和洛克仙妮說話，得知肯迪大師住在城外。\n2. 穿過敘利亞森林，到肯迪之家。\n3. 建議先做完城裡的支線，再去森林。\n# 支線：中國劍 薩爾達\n1. 和街上走動的胖商人安薩里拉齊說話兩次。\n2. 花 1500 銀幣買中國劍。\n# 支線：奧斯曼的靈魂 薩爾達\n1. 在奧斯曼家不斷和葉塔說話，直到奧斯曼進來。\n2. 妮可把奧斯曼的靈魂收進煉妖壺。\n3. 進壺之前，趁他昏迷，可從他身上拿到魔法精羽。\n4. 進壺打敗奧斯曼，帶他回來。\n# 支線：辜露公主 薩爾達\n1. 在清真寺前和辜露說話，她被帶去拍賣。\n2. 去敘利亞森林，給祖旺回復劑，得魔晶礦Ａ。\n3. 回拍賣場，祖旺買下辜露。\n4. 和祖旺說話，得神駝靴。\n5. 不要讓列拉買下她，否則要用封印之劍換。\n# 支線：分珍珠 DOMO\n1. 到珠寶商家，三個女人在分珍珠。\n2. 答「9、6、2」，得薰衣草、山蛇莓。\n# 支線：阿里看家 薩爾達\n1. 答應幫阿里看家。\n2. 不碰寶箱，也不要中途離開。\n3. 阿里回來後任選一個寶箱。從左到右是聖皇盔、不老之泉水、精華藥水、神奇麵包、輪迴盤。\n4. 做薩爾達和«聖皇裝備»要選聖皇盔。\n# 支線：紅酒\n1. 對武器店老闆選「喝點小酒」。\n2. 進裡面房間的地下室，向老闆娘買紅酒，250 銀幣。", "html": "<h3>流程</h3><ol><li>在占卜屋和洛克仙妮說話，得知肯迪大師住在城外。</li><li>穿過敘利亞森林，到肯迪之家。</li><li>建議先做完城裡的支線，再去森林。</li></ol><h3>支線：中國劍 <span class=\"tag sarda\">薩爾達</span></h3><ol><li>和街上走動的胖商人安薩里拉齊說話兩次。</li><li>花 1500 銀幣買<span class=\"jump items\" data-view=\"items\" data-detail=\"中國劍@578\" title=\"在物品大全中打開\">中國劍</span>。</li></ol><h3>支線：奧斯曼的靈魂 <span class=\"tag sarda\">薩爾達</span></h3><ol><li>在奧斯曼家不斷和葉塔說話，直到奧斯曼進來。</li><li>妮可把奧斯曼的靈魂收進煉妖壺。</li><li>進壺之前，趁他昏迷，可從他身上拿到<span class=\"jump items\" data-view=\"items\" data-detail=\"魔法精羽@678\" title=\"在物品大全中打開\">魔法精羽</span>。</li><li>進壺打敗奧斯曼，帶他回來。</li></ol><h3>支線：辜露公主 <span class=\"tag sarda\">薩爾達</span></h3><ol><li>在清真寺前和辜露說話，她被帶去拍賣。</li><li>去敘利亞森林，給祖旺<span class=\"jump items\" data-view=\"items\" data-detail=\"回復劑@625\" title=\"在物品大全中打開\">回復劑</span>，得<span class=\"jump items\" data-view=\"items\" data-detail=\"魔晶礦Ａ@772\" title=\"在物品大全中打開\">魔晶礦Ａ</span>。</li><li>回拍賣場，祖旺買下辜露。</li><li>和祖旺說話，得<span class=\"jump items\" data-view=\"items\" data-detail=\"神駝靴@912\" title=\"在物品大全中打開\">神駝靴</span>。</li><li>不要讓列拉買下她，否則要用封印之劍換。</li></ol><h3>支線：分珍珠 <span class=\"tag domo\">DOMO</span></h3><ol><li>到珠寶商家，三個女人在分珍珠。</li><li>答「9、6、2」，得<span class=\"jump items\" data-view=\"items\" data-detail=\"薰衣草@826\" title=\"在物品大全中打開\">薰衣草</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"山蛇莓@722\" title=\"在物品大全中打開\">山蛇莓</span>。</li></ol><h3>支線：阿里看家 <span class=\"tag sarda\">薩爾達</span></h3><ol><li>答應幫阿里看家。</li><li>不碰寶箱，也不要中途離開。</li><li>阿里回來後任選一個寶箱。從左到右是<span class=\"jump items\" data-view=\"items\" data-detail=\"聖皇盔@896\" title=\"在物品大全中打開\">聖皇盔</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"不老之泉水@681\" title=\"在物品大全中打開\">不老之泉水</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"精華藥水@629\" title=\"在物品大全中打開\">精華藥水</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"神奇麵包@672\" title=\"在物品大全中打開\">神奇麵包</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"輪迴盤@645\" title=\"在物品大全中打開\">輪迴盤</span>。</li><li>做薩爾達和<span class=\"goto\" data-title=\"聖皇裝備\">聖皇裝備</span>要選聖皇盔。</li></ol><h3>支線：紅酒</h3><ol><li>對武器店老闆選「喝點小酒」。</li><li>進裡面房間的地下室，向老闆娘買<span class=\"jump items\" data-view=\"items\" data-detail=\"紅酒@794\" title=\"在物品大全中打開\">紅酒</span>，250 銀幣。</li></ol>"}, {"chapter": "阿拉伯", "title": "敘利亞森林與肯迪之家", "text": "敘利亞森林與肯迪之家\n# 敘利亞森林\n- 魔貝粉：寶箱\n- 空白符紙：寶箱，下方比較隱蔽的地方\n- 魔法葉：寶箱\n- 祖旺：給回復劑，得魔晶礦Ａ（見«大馬士革»）\n# 肯迪之家\n- 海檬果：院子左邊草叢（隱藏）\n# 流程\n1. 肯迪大師已過世，留下來向小肯迪學習。\n2. 執政官麥爾丹搶走記載魔鬼封印之地的地圖。\n3. 賽特和小肯迪追往塔德莫爾。", "html": "<h3>敘利亞森林</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"魔貝粉@627\" title=\"在物品大全中打開\">魔貝粉</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"空白符紙@768\" title=\"在物品大全中打開\">空白符紙</span>：寶箱，下方比較隱蔽的地方</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"魔法葉@636\" title=\"在物品大全中打開\">魔法葉</span>：寶箱</li><li>祖旺：給<span class=\"jump items\" data-view=\"items\" data-detail=\"回復劑@625\" title=\"在物品大全中打開\">回復劑</span>，得<span class=\"jump items\" data-view=\"items\" data-detail=\"魔晶礦Ａ@772\" title=\"在物品大全中打開\">魔晶礦Ａ</span>（見<span class=\"goto\" data-title=\"大馬士革\">大馬士革</span>）</li></ul><h3>肯迪之家</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"海檬果@721\" title=\"在物品大全中打開\">海檬果</span>：院子左邊草叢（隱藏）</li></ul><h3>流程</h3><ol><li>肯迪大師已過世，留下來向小肯迪學習。</li><li>執政官麥爾丹搶走記載魔鬼封印之地的地圖。</li><li>賽特和小肯迪追往塔德莫爾。</li></ol>"}, {"chapter": "阿拉伯", "title": "塔德莫爾", "text": "塔德莫爾\n# 流程\n1. 騎駱駝往東南。\n2. 用計讓守衛自相殘殺。\n3. 進古墓，扳右下的機關，遇到麥爾丹。\n4. 按牆上的黃磚，打開秘門。\n5. 十二宮機關：由右向左每三宮一組，分別打開水、火、地、風四門，按門內的黃磚。\n6. 天之門打開。\n7. 東邊門裡按三塊黃磚，打開下邊門路上的地板。\n8. 推開石棺，見到卡瑪與安卡。\n9. 出口打敗鬼猴，卡瑪加入。\n# 入口\n- 魔晶粉：古墓入口右後方的角落（隱藏）\n- 神祕果：入口通道（隱藏）\n# 四門\n- 精華藥水：水之門\n- 定心丸：水之門\n- 山蛇莓：火之門\n- 諸方神石：地之門\n- 飛去來器：風之門\n# 天之門後\n- 魔貝粉：東邊門\n- 神偷面具：東邊門（偷竊指令）\n- 翠玉金釵：東邊門（«宗楚客的玉器»之一）\n- 鷹矢盔：下邊門密室\n- 魔貝粉：左邊門\n- 400 銀幣：左邊門\n- 蜂王露：左邊門魔貝粉寶箱左側（西南牆）的隱藏通道盡頭\n# 墓室出口\n- 封印之劍（6）：封印之光\n- 不老之泉水：這一幕左上的隱藏通道\n- 還魄丹：寶箱\n# 偷竊與靈契\n- 亞坦可偷飛翔魔油（敏捷 +5）。等級高了牠會逃，可以卡瑪加入後再回來邊練邊偷。\n- 神燈巨人可偷瑰麗之梨。收服兩隻，可煉出玉戒指。\n- 蝠妖可偷瑪瑙戒指。\n- 朱蛤獸可偷角笛。", "html": "<h3>流程</h3><ol><li>騎駱駝往東南。</li><li>用計讓守衛自相殘殺。</li><li>進古墓，扳右下的機關，遇到麥爾丹。</li><li>按牆上的黃磚，打開秘門。</li><li>十二宮機關：由右向左每三宮一組，分別打開水、火、地、風四門，按門內的黃磚。</li><li>天之門打開。</li><li>東邊門裡按三塊黃磚，打開下邊門路上的地板。</li><li>推開石棺，見到卡瑪與安卡。</li><li>出口打敗<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"鬼猴@18\" title=\"在神魔異事錄中打開\">鬼猴</span>，卡瑪加入。</li></ol><h3>入口</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"魔晶粉@637\" title=\"在物品大全中打開\">魔晶粉</span>：古墓入口右後方的角落（隱藏）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"神祕果@729\" title=\"在物品大全中打開\">神祕果</span>：入口通道（隱藏）</li></ul><h3>四門</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"精華藥水@629\" title=\"在物品大全中打開\">精華藥水</span>：水之門</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"定心丸@655\" title=\"在物品大全中打開\">定心丸</span>：水之門</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"山蛇莓@722\" title=\"在物品大全中打開\">山蛇莓</span>：火之門</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"諸方神石@698\" title=\"在物品大全中打開\">諸方神石</span>：地之門</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"飛去來器@565\" title=\"在物品大全中打開\">飛去來器</span>：風之門</li></ul><h3>天之門後</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"魔貝粉@627\" title=\"在物品大全中打開\">魔貝粉</span>：東邊門</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"神偷面具@937\" title=\"在物品大全中打開\">神偷面具</span>：東邊門（偷竊指令）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"翠玉金釵@1023\" title=\"在物品大全中打開\">翠玉金釵</span>：東邊門（<span class=\"goto\" data-title=\"宗楚客的玉器\">宗楚客的玉器</span>之一）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"鷹矢盔@894\" title=\"在物品大全中打開\">鷹矢盔</span>：下邊門密室</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"魔貝粉@627\" title=\"在物品大全中打開\">魔貝粉</span>：左邊門</li><li>400 銀幣：左邊門</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"蜂王露@688\" title=\"在物品大全中打開\">蜂王露</span>：左邊門魔貝粉寶箱左側（西南牆）的隱藏通道盡頭</li></ul><h3>墓室出口</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"封印之劍@793\" title=\"在物品大全中打開\">封印之劍</span>（6）：封印之光</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"不老之泉水@681\" title=\"在物品大全中打開\">不老之泉水</span>：這一幕左上的隱藏通道</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"還魄丹@644\" title=\"在物品大全中打開\">還魄丹</span>：寶箱</li></ul><h3>偷竊與靈契</h3><ul><li><span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"亞坦@161\" title=\"在神魔異事錄中打開\">亞坦</span>可偷<span class=\"jump items\" data-view=\"items\" data-detail=\"飛翔魔油@679\" title=\"在物品大全中打開\">飛翔魔油</span>（敏捷 +5）。等級高了牠會逃，可以卡瑪加入後再回來邊練邊偷。</li><li><span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"神燈巨人@164\" title=\"在神魔異事錄中打開\">神燈巨人</span>可偷<span class=\"jump items\" data-view=\"items\" data-detail=\"瑰麗之梨@677\" title=\"在物品大全中打開\">瑰麗之梨</span>。收服兩隻，可煉出<span class=\"jump items\" data-view=\"items\" data-detail=\"玉戒指@975\" title=\"在物品大全中打開\">玉戒指</span>。</li><li><span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"蝠妖@162\" title=\"在神魔異事錄中打開\">蝠妖</span>可偷<span class=\"jump items\" data-view=\"items\" data-detail=\"瑪瑙戒指@978\" title=\"在物品大全中打開\">瑪瑙戒指</span>。</li><li><span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"朱蛤獸@163\" title=\"在神魔異事錄中打開\">朱蛤獸</span>可偷<span class=\"jump items\" data-view=\"items\" data-detail=\"角笛@984\" title=\"在物品大全中打開\">角笛</span>。</li></ul>"}, {"chapter": "阿拉伯", "title": "血腥地獄", "text": "血腥地獄\n# 流程\n1. 回程發現沙漠中央有血光。\n2. 和莫雷說話，從魔法陣進入地獄。\n3. 遇到康那里士（恐懼之王），被關進牢房。\n4. 和安卡說話後，回到過去見莉蓮。\n5. 薇達救出眾人。\n6. 打敗康那里士，再打敗恐懼之王。\n7. 傳送到大馬士革清真寺。\n# 地獄廣場\n- 血殷長袍：六角星左側的骷髏堆（隱藏）\n# 洞穴\n- 惡魔風笛：進入火堆後的門，一直往前的牙叢（隱藏）\n- 300 銀幣：寶箱\n- 魔晶粉：寶箱\n- 魔貝粉×2：寶箱\n- 菟絲魔子：寶箱\n- 象牙耳環：寶箱\n- 有一個陷阱寶箱，賽特損血 100。\n# 出獄後\n- 流雲針：寶箱\n- 魔力水：寶箱\n- 200 銀幣：寶箱\n- 還魄丹：寶箱\n# 地府商店街\n- 封印之劍（7）：封印之光\n- 可買閰氣靴備用。", "html": "<h3>流程</h3><ol><li>回程發現沙漠中央有血光。</li><li>和莫雷說話，從魔法陣進入地獄。</li><li>遇到<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"康那里士@7\" title=\"在神魔異事錄中打開\">康那里士</span>（恐懼之王），被關進牢房。</li><li>和安卡說話後，回到過去見莉蓮。</li><li>薇達救出眾人。</li><li>打敗康那里士，再打敗<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"恐懼之王@12\" title=\"在神魔異事錄中打開\">恐懼之王</span>。</li><li>傳送到大馬士革清真寺。</li></ol><h3>地獄廣場</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"血殷長袍@1016\" title=\"在物品大全中打開\">血殷長袍</span>：六角星左側的骷髏堆（隱藏）</li></ul><h3>洞穴</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"惡魔風笛@986\" title=\"在物品大全中打開\">惡魔風笛</span>：進入火堆後的門，一直往前的牙叢（隱藏）</li><li>300 銀幣：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"魔晶粉@637\" title=\"在物品大全中打開\">魔晶粉</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"魔貝粉@627\" title=\"在物品大全中打開\">魔貝粉</span>×2：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"菟絲魔子@728\" title=\"在物品大全中打開\">菟絲魔子</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"象牙耳環@1000\" title=\"在物品大全中打開\">象牙耳環</span>：寶箱</li><li>有一個陷阱寶箱，賽特損血 100。</li></ul><h3>出獄後</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"流雲針@566\" title=\"在物品大全中打開\">流雲針</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"魔力水@638\" title=\"在物品大全中打開\">魔力水</span>：寶箱</li><li>200 銀幣：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"還魄丹@644\" title=\"在物品大全中打開\">還魄丹</span>：寶箱</li></ul><h3>地府商店街</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"封印之劍@793\" title=\"在物品大全中打開\">封印之劍</span>（7）：封印之光</li><li>可買<span class=\"jump items\" data-view=\"items\" data-detail=\"閰氣靴@1041\" title=\"在物品大全中打開\">閰氣靴</span>備用。</li></ul>"}, {"chapter": "阿拉伯", "title": "大馬士革皇宮", "text": "大馬士革皇宮\n# 流程\n1. 清真寺遍地屍體，進王宮。\n2. 遇到唐國僧人慧彥，打不還手。\n3. 打敗影忍妖機。\n4. 大殿打敗機關三魔獸，黃雷逃走。\n5. 追進皇宮通道，在盡頭打敗黃雷。\n6. 向慧彥學武術與中文，學會御劍燎原。\n7. 和薇達比武，之後沿絲路往巴格達。\n# 皇宮通道\n- 魔貝粉：寶箱\n- 回復劑×3：寶箱\n- 魔晶礦Ｂ：寶箱\n- 300 銀幣：寶箱\n- 流雲針：寶箱\n- 魔力水：寶箱\n- 魔晶粉：寶箱\n- 500 銀幣：寶箱\n- 雨雲之腕：魔晶礦Ｂ所在處右面的牆，被牆擋住的寶箱\n- 吸魔壺：500 銀幣寶箱過道右上角附近，被牆擋住的寶箱\n- 封印之劍（8）：封印之光\n# 注意\n- 找到黃雷、跟慧彥學武術之前，賽特最好已練成「蛟龍翻身」。\n- 否則學不到最強絕技「天狼巽閃」，只能練到「霸王崩山勁」。", "html": "<h3>流程</h3><ol><li>清真寺遍地屍體，進王宮。</li><li>遇到唐國僧人慧彥，打不還手。</li><li>打敗<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"影忍妖機@50\" title=\"在神魔異事錄中打開\">影忍妖機</span>。</li><li>大殿打敗<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"機關三魔獸@48\" title=\"在神魔異事錄中打開\">機關三魔獸</span>，黃雷逃走。</li><li>追進皇宮通道，在盡頭打敗黃雷。</li><li>向慧彥學武術與中文，學會御劍燎原。</li><li>和薇達比武，之後沿絲路往巴格達。</li></ol><h3>皇宮通道</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"魔貝粉@627\" title=\"在物品大全中打開\">魔貝粉</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"回復劑@625\" title=\"在物品大全中打開\">回復劑</span>×3：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"魔晶礦Ｂ@773\" title=\"在物品大全中打開\">魔晶礦Ｂ</span>：寶箱</li><li>300 銀幣：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"流雲針@566\" title=\"在物品大全中打開\">流雲針</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"魔力水@638\" title=\"在物品大全中打開\">魔力水</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"魔晶粉@637\" title=\"在物品大全中打開\">魔晶粉</span>：寶箱</li><li>500 銀幣：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"雨雲之腕@1045\" title=\"在物品大全中打開\">雨雲之腕</span>：魔晶礦Ｂ所在處右面的牆，被牆擋住的寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"吸魔壺@954\" title=\"在物品大全中打開\">吸魔壺</span>：500 銀幣寶箱過道右上角附近，被牆擋住的寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"封印之劍@793\" title=\"在物品大全中打開\">封印之劍</span>（8）：封印之光</li></ul><h3>注意</h3><ul><li>找到黃雷、跟慧彥學武術之前，賽特最好已練成「蛟龍翻身」。</li><li>否則學不到最強絕技「天狼巽閃」，只能練到「霸王崩山勁」。</li></ul>"}, {"chapter": "阿拉伯", "title": "巴格達", "text": "巴格達\n# 流程\n1. 和城北商店內的陳瑞蓮說話。\n2. 和軍營帳外的士兵說話兩次。之後 5 分鐘內不能存檔，可以先做支線、去東北山洞。\n3. 衛兵要求去東北山洞拿暗黑修羅砧，證明你是勇士（見«美索不達米亞山區»）。\n4. 回來打贏四名黑衣大食兵。\n5. 見到石國王子遠恩和麥爾斯，賽特受傷。\n6. 慧彥挾持遠恩，逃到沙漠綠洲。\n# 物品\n- 彎刀：入口上方樹叢，小孩藏的（隱藏）\n- 月牙劍：右數第三個帳篷的兵器架（隱藏）\n- 彎刀：左數第二個帳篷（隱藏）\n# 購物\n- 坦普拉琴：雜貨商買，500 銀幣 DOMO\n- 隴金玉劍：武器商買（«宗楚客的玉器»之一）\n# 支線：士兵的彎刀 薩爾達\n1. 武器商左邊第一個帳篷的士兵艾革利丟了彎刀，給你 200 銀幣，托你買一把。\n2. 接下任務就算達成薩爾達的條件。\n3. 把撿到的彎刀交給他，再得 100 銀幣。\n# 支線：安薩里拉齊\n1. 他出 3000 銀幣要買回中國劍。\n2. 做薩爾達或想開封魚腸就選「否」。\n# 支線：旅店\n- 和老闆娘說話後，住宿從 200 銀幣降到 150。\n# 支線：老學究古伊 典藏版\n1. 和左數第四個帳篷的古伊說話。\n2. 答「恆河」，得鷹爪靴。", "html": "<h3>流程</h3><ol><li>和城北商店內的陳瑞蓮說話。</li><li>和軍營帳外的士兵說話兩次。之後 5 分鐘內不能存檔，可以先做支線、去東北山洞。</li><li>衛兵要求去東北山洞拿<span class=\"jump items\" data-view=\"items\" data-detail=\"暗黑修羅砧@717\" title=\"在物品大全中打開\">暗黑修羅砧</span>，證明你是勇士（見<span class=\"goto\" data-title=\"美索不達米亞山區\">美索不達米亞山區</span>）。</li><li>回來打贏四名<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"黑衣大食兵@411\" title=\"在神魔異事錄中打開\">黑衣大食兵</span>。</li><li>見到石國王子遠恩和麥爾斯，賽特受傷。</li><li>慧彥挾持遠恩，逃到沙漠綠洲。</li></ol><h3>物品</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"彎刀@537\" title=\"在物品大全中打開\">彎刀</span>：入口上方樹叢，小孩藏的（隱藏）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"月牙劍@508\" title=\"在物品大全中打開\">月牙劍</span>：右數第三個帳篷的兵器架（隱藏）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"彎刀@537\" title=\"在物品大全中打開\">彎刀</span>：左數第二個帳篷（隱藏）</li></ul><h3>購物</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"坦普拉琴@830\" title=\"在物品大全中打開\">坦普拉琴</span>：雜貨商買，500 銀幣 <span class=\"tag domo\">DOMO</span></li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"隴金玉劍@507\" title=\"在物品大全中打開\">隴金玉劍</span>：武器商買（<span class=\"goto\" data-title=\"宗楚客的玉器\">宗楚客的玉器</span>之一）</li></ul><h3>支線：士兵的彎刀 <span class=\"tag sarda\">薩爾達</span></h3><ol><li>武器商左邊第一個帳篷的士兵艾革利丟了彎刀，給你 200 銀幣，托你買一把。</li><li>接下任務就算達成薩爾達的條件。</li><li>把撿到的<span class=\"jump items\" data-view=\"items\" data-detail=\"彎刀@537\" title=\"在物品大全中打開\">彎刀</span>交給他，再得 100 銀幣。</li></ol><h3>支線：安薩里拉齊</h3><ol><li>他出 3000 銀幣要買回中國劍。</li><li>做薩爾達或想開封魚腸就選「否」。</li></ol><h3>支線：旅店</h3><ul><li>和老闆娘說話後，住宿從 200 銀幣降到 150。</li></ul><h3>支線：老學究古伊 <span class=\"tag edition\">典藏版</span></h3><ol><li>和左數第四個帳篷的古伊說話。</li><li>答「恆河」，得<span class=\"jump items\" data-view=\"items\" data-detail=\"鷹爪靴@1034\" title=\"在物品大全中打開\">鷹爪靴</span>。</li></ol>"}, {"chapter": "阿拉伯", "title": "美索不達米亞山區", "text": "美索不達米亞山區\n# 位置\n巴格達東北的山洞（火炎迷宮）。\n# 物品\n- 金創藥：寶箱\n- 魔力水：寶箱\n- 魔貝粉×2：寶箱\n- 十果粉×2：寶箱\n- 聖石榴：寶箱\n- 輪迴盤：寶箱\n- 嘉果：寶箱\n- 神奇麵包：暗黑修羅砧左上拐角，被牆擋住的寶箱\n# BOSS\n- 格特輪：打敗得暗黑修羅砧；可偷魔晶粉\n# 偷竊與靈契\n- 靈契瓊霜DOMO，也是很好的護駕。\n- 瓊霜可偷不老之泉水。", "html": "<h3>位置</h3><p>巴格達東北的山洞（火炎迷宮）。</p><h3>物品</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"金創藥@628\" title=\"在物品大全中打開\">金創藥</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"魔力水@638\" title=\"在物品大全中打開\">魔力水</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"魔貝粉@627\" title=\"在物品大全中打開\">魔貝粉</span>×2：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"十果粉@626\" title=\"在物品大全中打開\">十果粉</span>×2：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"聖石榴@623\" title=\"在物品大全中打開\">聖石榴</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"輪迴盤@645\" title=\"在物品大全中打開\">輪迴盤</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"嘉果@630\" title=\"在物品大全中打開\">嘉果</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"神奇麵包@672\" title=\"在物品大全中打開\">神奇麵包</span>：暗黑修羅砧左上拐角，被牆擋住的寶箱</li></ul><h3>BOSS</h3><ul><li><span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"格特輪@180\" title=\"在神魔異事錄中打開\">格特輪</span>：打敗得<span class=\"jump items\" data-view=\"items\" data-detail=\"暗黑修羅砧@717\" title=\"在物品大全中打開\">暗黑修羅砧</span>；可偷<span class=\"jump items\" data-view=\"items\" data-detail=\"魔晶粉@637\" title=\"在物品大全中打開\">魔晶粉</span></li></ul><h3>偷竊與靈契</h3><ul><li>靈契<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"瓊霜@151\" title=\"在神魔異事錄中打開\">瓊霜</span><span class=\"tag domo\">DOMO</span>，也是很好的護駕。</li><li><span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"瓊霜@151\" title=\"在神魔異事錄中打開\">瓊霜</span>可偷<span class=\"jump items\" data-view=\"items\" data-detail=\"不老之泉水@681\" title=\"在物品大全中打開\">不老之泉水</span>。</li></ul>"}, {"chapter": "阿拉伯", "title": "幻影石國", "text": "幻影石國\n# 流程\n1. 綠洲商人說東邊有怪物。\n2. 遠恩衝進幻影石國後失蹤。\n3. 遇到段秀實，一起從水井口進去。\n4. 在盡頭找到遠恩，打敗蜃樓王，幻影消失。\n5. 段秀實帶路去唐營。\n6. 這是劇情地圖，結束後不能再進。\n# 石國地下水路\n- 十果粉×2：寶箱\n- 魔力水：寶箱\n- 魔貝粉×2：寶箱\n- 金創藥×2：寶箱\n- 回復劑：寶箱\n- 神祕果：寶箱\n- 嘉果：漂在水上、隨水流移動的寶箱，看到先撿\n- 妖精麥粉：漂在水上的寶箱\n- 魔晶礦Ｃ：漂在水上的寶箱\n- 封印之劍（9）：封印之光\n# 陷阱\n- 兩處，賽特各損血 100、200。\n- 另有一處遇到三隻庫塔。", "html": "<h3>流程</h3><ol><li>綠洲商人說東邊有怪物。</li><li>遠恩衝進幻影石國後失蹤。</li><li>遇到段秀實，一起從水井口進去。</li><li>在盡頭找到遠恩，打敗<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"蜃樓王@16\" title=\"在神魔異事錄中打開\">蜃樓王</span>，幻影消失。</li><li>段秀實帶路去唐營。</li><li>這是劇情地圖，結束後不能再進。</li></ol><h3>石國地下水路</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"十果粉@626\" title=\"在物品大全中打開\">十果粉</span>×2：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"魔力水@638\" title=\"在物品大全中打開\">魔力水</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"魔貝粉@627\" title=\"在物品大全中打開\">魔貝粉</span>×2：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"金創藥@628\" title=\"在物品大全中打開\">金創藥</span>×2：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"回復劑@625\" title=\"在物品大全中打開\">回復劑</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"神祕果@729\" title=\"在物品大全中打開\">神祕果</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"嘉果@630\" title=\"在物品大全中打開\">嘉果</span>：漂在水上、隨水流移動的寶箱，看到先撿</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"妖精麥粉@674\" title=\"在物品大全中打開\">妖精麥粉</span>：漂在水上的寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"魔晶礦Ｃ@774\" title=\"在物品大全中打開\">魔晶礦Ｃ</span>：漂在水上的寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"封印之劍@793\" title=\"在物品大全中打開\">封印之劍</span>（9）：封印之光</li></ul><h3>陷阱</h3><ul><li>兩處，賽特各損血 100、200。</li><li>另有一處遇到三隻<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"庫塔@181\" title=\"在神魔異事錄中打開\">庫塔</span>。</li></ul>"}, {"chapter": "阿拉伯", "title": "怛羅斯", "text": "怛羅斯\n# 流程\n1. 峽谷裡遇到唐軍先行軍。\n2. 麥爾斯現身，原來是撒旦轉世。\n3. 勸黃雷不成，兩次打敗機關三魔獸。\n4. 唐軍與大食交戰，眾人上山避難。\n5. 扳機關放巨石開路。\n6. 慧彥下山阻止大食進兵，殉身。\n7. 薇達帶走賽特，賽特昏倒。\n# 下層\n- 封印之劍（10）：封印之光\n- 龍骨木：封印之光左側的草叢（隱藏）\n- 空白符紙：寶箱\n- 魔法葉：地上\n- 解毒草：地上\n- 嘉果×2：地上\n- 玉山佛甲草：地上（智慧 +10）\n- 香柏葉：地上（力量 +10）\n# 上層\n- 嘉果：地上\n- 藥草：地上\n- 龍骨木：地上\n- 魔法葉：地上\n# 提示\n- 各個角落用空格搜一搜，草藥不少。", "html": "<h3>流程</h3><ol><li>峽谷裡遇到唐軍先行軍。</li><li>麥爾斯現身，原來是撒旦轉世。</li><li>勸黃雷不成，兩次打敗<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"機關三魔獸@48\" title=\"在神魔異事錄中打開\">機關三魔獸</span>。</li><li>唐軍與大食交戰，眾人上山避難。</li><li>扳機關放巨石開路。</li><li>慧彥下山阻止大食進兵，殉身。</li><li>薇達帶走賽特，賽特昏倒。</li></ol><h3>下層</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"封印之劍@793\" title=\"在物品大全中打開\">封印之劍</span>（10）：封印之光</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"龍骨木@723\" title=\"在物品大全中打開\">龍骨木</span>：封印之光左側的草叢（隱藏）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"空白符紙@768\" title=\"在物品大全中打開\">空白符紙</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"魔法葉@636\" title=\"在物品大全中打開\">魔法葉</span>：地上</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"解毒草@647\" title=\"在物品大全中打開\">解毒草</span>：地上</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"嘉果@630\" title=\"在物品大全中打開\">嘉果</span>×2：地上</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"玉山佛甲草@693\" title=\"在物品大全中打開\">玉山佛甲草</span>：地上（智慧 +10）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"香柏葉@670\" title=\"在物品大全中打開\">香柏葉</span>：地上（力量 +10）</li></ul><h3>上層</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"嘉果@630\" title=\"在物品大全中打開\">嘉果</span>：地上</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"藥草@621\" title=\"在物品大全中打開\">藥草</span>：地上</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"龍骨木@723\" title=\"在物品大全中打開\">龍骨木</span>：地上</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"魔法葉@636\" title=\"在物品大全中打開\">魔法葉</span>：地上</li></ul><h3>提示</h3><ul><li>各個角落用空格搜一搜，草藥不少。</li></ul>"}, {"chapter": "阿拉伯", "title": "五年後（夢境）", "text": "五年後（夢境）\n# 流程\n1. 賽特醒來，已是波斯最高執政官，與薇達結婚（得藍魔神、姆斯比爾）。\n2. 在豪宅休息室左上的櫃子，找回原來的衣服換上。\n3. 到大廳見麥爾斯、妮可、黃雷、康那里士。\n4. 發兵東征，途經怛羅斯，見到慧彥的魂魄，軍隊潰散。\n5. 和慧彥上天山找仙人，往東進石國。\n# 偷竊\n- 中國西域的阿拔東可偷羅剎食日鈸。", "html": "<h3>流程</h3><ol><li>賽特醒來，已是波斯最高執政官，與薇達結婚（得<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"藍魔神@13\" title=\"在神魔異事錄中打開\">藍魔神</span>、<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"姆斯比爾@6\" title=\"在神魔異事錄中打開\">姆斯比爾</span>）。</li><li>在豪宅休息室左上的櫃子，找回原來的衣服換上。</li><li>到大廳見麥爾斯、妮可、黃雷、康那里士。</li><li>發兵東征，途經怛羅斯，見到慧彥的魂魄，軍隊潰散。</li><li>和慧彥上天山找仙人，往東進石國。</li></ol><h3>偷竊</h3><ul><li>中國西域的<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"阿拔東@173\" title=\"在神魔異事錄中打開\">阿拔東</span>可偷<span class=\"jump items\" data-view=\"items\" data-detail=\"羅剎食日鈸@712\" title=\"在物品大全中打開\">羅剎食日鈸</span>。</li></ul>"}, {"chapter": "西域", "title": "石國", "text": "石國\n# 支線：宇文家 薩爾達\n1. 去天山之前，進第一間民房，和宇文大地一家說話。\n2. 回到現實後再來一次，見到新婚的宇文天夫婦。\n3. 幫他們的兒子取名「宇文答滴」。\n# 建議\n- 買兩件千葉，給妮可和卡瑪。\n- 到天山拿到封神壇之後，就不能再用東方祭壇的煉化秘技。想煉神龍等，要在這之前煉。", "html": "<h3>支線：宇文家 <span class=\"tag sarda\">薩爾達</span></h3><ol><li>去天山之前，進第一間民房，和宇文大地一家說話。</li><li>回到現實後再來一次，見到新婚的宇文天夫婦。</li><li>幫他們的兒子取名「宇文答滴」。</li></ol><h3>建議</h3><ul><li>買兩件<span class=\"jump items\" data-view=\"items\" data-detail=\"千葉@1031\" title=\"在物品大全中打開\">千葉</span>，給妮可和卡瑪。</li><li>到天山拿到<span class=\"jump items\" data-view=\"items\" data-detail=\"封神壇@771\" title=\"在物品大全中打開\">封神壇</span>之後，就不能再用東方祭壇的煉化秘技。想煉神龍等，要在這之前煉。</li></ul>"}, {"chapter": "西域", "title": "天山山道與山洞", "text": "天山山道與山洞\n# 流程\n1. 出石國往南過木橋，再往東進天山。\n2. 山道上兩次打敗黃雷的機關三魔獸。\n3. 打敗康那里士。\n4. 存檔，進山洞。\n5. 出洞遇到妮可，她不忍動手，哭著離開。\n6. 卡瑪不願和薇達打，賽特單挑薇達。\n7. 到山頂。\n# 山腳\n- 太皇刀─藍牙：山門下（隱藏）\n# 山道\n- 嘉果：地上\n- 封印之劍（11）：封印之光\n# 山洞\n- 空白符紙：寶箱\n- 諸方神石：寶箱\n- 金創藥：寶箱\n- 暗殺寶錄：寶箱（投擲指令）\n- 溶石藥劑：寶箱\n- 聖言石：寶箱\n- 崙凰劍：寶箱\n- 翔羽葉：寶箱\n- 輪迴盤：寶箱\n- 魔晶礦Ｄ：寶箱\n- 金塊：寶箱\n- 機關設計圖１：寶箱，出洞前左側\n# 出洞後\n- 天山雪蓮：左側山崖下\n- 鬼雲：遇到妮可後，下一個場景最右邊上方的雲堆（隱藏）\n# 偷竊與靈契\n- 靈契水仙、上元夫人DOMO，各至少一隻。\n- 上元夫人可偷天山雪蓮。", "html": "<h3>流程</h3><ol><li>出石國往南過木橋，再往東進天山。</li><li>山道上兩次打敗黃雷的<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"機關三魔獸@48\" title=\"在神魔異事錄中打開\">機關三魔獸</span>。</li><li>打敗<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"康那里士@7\" title=\"在神魔異事錄中打開\">康那里士</span>。</li><li>存檔，進山洞。</li><li>出洞遇到妮可，她不忍動手，哭著離開。</li><li>卡瑪不願和薇達打，賽特單挑<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"薇達@3\" title=\"在神魔異事錄中打開\">薇達</span>。</li><li>到山頂。</li></ol><h3>山腳</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"太皇刀─藍牙@544\" title=\"在物品大全中打開\">太皇刀─藍牙</span>：山門下（隱藏）</li></ul><h3>山道</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"嘉果@630\" title=\"在物品大全中打開\">嘉果</span>：地上</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"封印之劍@793\" title=\"在物品大全中打開\">封印之劍</span>（11）：封印之光</li></ul><h3>山洞</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"空白符紙@768\" title=\"在物品大全中打開\">空白符紙</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"諸方神石@698\" title=\"在物品大全中打開\">諸方神石</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"金創藥@628\" title=\"在物品大全中打開\">金創藥</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"暗殺寶錄@950\" title=\"在物品大全中打開\">暗殺寶錄</span>：寶箱（投擲指令）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"溶石藥劑@651\" title=\"在物品大全中打開\">溶石藥劑</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"聖言石@657\" title=\"在物品大全中打開\">聖言石</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"崙凰劍@510\" title=\"在物品大全中打開\">崙凰劍</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"翔羽葉@568\" title=\"在物品大全中打開\">翔羽葉</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"輪迴盤@645\" title=\"在物品大全中打開\">輪迴盤</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"魔晶礦Ｄ@775\" title=\"在物品大全中打開\">魔晶礦Ｄ</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"金塊@817\" title=\"在物品大全中打開\">金塊</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"機關設計圖１@776\" title=\"在物品大全中打開\">機關設計圖１</span>：寶箱，出洞前左側</li></ul><h3>出洞後</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"天山雪蓮@643\" title=\"在物品大全中打開\">天山雪蓮</span>：左側山崖下</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"鬼雲@1028\" title=\"在物品大全中打開\">鬼雲</span>：遇到妮可後，下一個場景最右邊上方的雲堆（隱藏）</li></ul><h3>偷竊與靈契</h3><ul><li>靈契<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"水仙@147\" title=\"在神魔異事錄中打開\">水仙</span>、<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"上元夫人@154\" title=\"在神魔異事錄中打開\">上元夫人</span><span class=\"tag domo\">DOMO</span>，各至少一隻。</li><li><span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"上元夫人@154\" title=\"在神魔異事錄中打開\">上元夫人</span>可偷<span class=\"jump items\" data-view=\"items\" data-detail=\"天山雪蓮@643\" title=\"在物品大全中打開\">天山雪蓮</span>。</li></ul>"}, {"chapter": "西域", "title": "天山山頂", "text": "天山山頂\n# 流程\n1. 在石室見軒轅劍仙。\n2. 打敗撒旦麥爾斯。\n3. 劍仙破解蜃樓王的幻術，回到現實，原來這五年都是幻夢。\n4. 劍仙把蜃樓王收進煉妖壺。\n5. 再進軒轅劍石室，慧彥化為舍利子，以前世李靖的身分加入。\n6. 得舍利子、封神壇，開啟東方祭壇。\n7. 出洞和妮可說話，妮可歸隊。\n8. 洞口和軒轅劍僮說話，得知要 17 把封印之劍（見«封印之劍»）。\n9. 再和薇達說話，卡瑪與安卡歸隊。\n10. 下山去長安。\n# 物品\n- 仙蓮子：楊通幽所在山洞的左邊牆壁（隱藏）\n- 羅漢袈裟：笑和尚右側的櫥子（隱藏）\n# 支線：楊通幽 薩爾達\n1. 見軒轅劍仙之前，和楊通幽說話。\n2. 回到現實後馬上再來一次，他預言大唐將有兵變。\n3. 之後回石國，找宇文天夫婦（見«石國»）。\n# 支線：王子喬 典藏版\n1. 下山後，在迷宮出口的山道上和訪仙者王子喬說話。\n2. 答「太行山」，得翠玉金釵。", "html": "<h3>流程</h3><ol><li>在石室見軒轅劍仙。</li><li>打敗<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"撒旦麥爾斯@68\" title=\"在神魔異事錄中打開\">撒旦麥爾斯</span>。</li><li>劍仙破解蜃樓王的幻術，回到現實，原來這五年都是幻夢。</li><li>劍仙把<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"蜃樓王@16\" title=\"在神魔異事錄中打開\">蜃樓王</span>收進煉妖壺。</li><li>再進軒轅劍石室，慧彥化為舍利子，以前世李靖的身分加入。</li><li>得<span class=\"jump items\" data-view=\"items\" data-detail=\"舍利子@690\" title=\"在物品大全中打開\">舍利子</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"封神壇@771\" title=\"在物品大全中打開\">封神壇</span>，開啟東方祭壇。</li><li>出洞和妮可說話，妮可歸隊。</li><li>洞口和軒轅劍僮說話，得知要 17 把封印之劍（見<span class=\"goto\" data-title=\"封印之劍\">封印之劍</span>）。</li><li>再和薇達說話，卡瑪與安卡歸隊。</li><li>下山去長安。</li></ol><h3>物品</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"仙蓮子@646\" title=\"在物品大全中打開\">仙蓮子</span>：楊通幽所在山洞的左邊牆壁（隱藏）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"羅漢袈裟@708\" title=\"在物品大全中打開\">羅漢袈裟</span>：笑和尚右側的櫥子（隱藏）</li></ul><h3>支線：楊通幽 <span class=\"tag sarda\">薩爾達</span></h3><ol><li>見軒轅劍仙之前，和楊通幽說話。</li><li>回到現實後馬上再來一次，他預言大唐將有兵變。</li><li>之後回石國，找宇文天夫婦（見<span class=\"goto\" data-title=\"石國\">石國</span>）。</li></ol><h3>支線：王子喬 <span class=\"tag edition\">典藏版</span></h3><ol><li>下山後，在迷宮出口的山道上和訪仙者王子喬說話。</li><li>答「太行山」，得<span class=\"jump items\" data-view=\"items\" data-detail=\"翠玉金釵@1023\" title=\"在物品大全中打開\">翠玉金釵</span>。</li></ol>"}, {"chapter": "大唐", "title": "長安", "text": "長安\n# 流程\n1. 進西南的白連儀家暫住，學習大唐文化。\n2. 決定把慧彥的舍利子送回少林寺（見«少林寺»）。\n3. 之後追黃八時，會回來找老古做炸藥。\n# 白連儀家\n- 金創藥：大廳左上（隱藏）\n- 風神符：書房書架（隱藏）\n- 飛翔魔油：書房右上角院子的石燈（隱藏，需用滑鼠點）\n# 西市街道\n- 延胡索之花：地上，雜貨鋪門前左側\n- 珍珠戒指：何慧紋左側的罈子（隱藏）\n- 神奇麵包：從東數第三個雜貨攤（隱藏）\n- 茉莉花：朱雀門右側 DOMO\n# 悅來客棧\n- 神祕果：入口右側罈子（隱藏）DOMO\n- 增肥劑：一樓房間左側櫃子（隱藏）DOMO\n- 魚酥：一樓房間左側櫃子（隱藏）DOMO\n- 水果：二樓杜甫房間的櫃子（隱藏）DOMO\n# 雜貨鋪\n- 靈界指標：右邊幾層草墊（隱藏）\n# 長生藥房\n- 蜂王露：寶箱，左側\n- 山蛇莓：右上書架（隱藏）DOMO\n# 蘭律閣\n- 機關設計圖２：寶箱，左側\n- 諸方神石：寶箱\n- 炎陽靈珠：白老闆身後的櫃子（隱藏）\n- 交換見«魔晶礦»、«機關設計圖»。\n# 杜康居\n- 天仙酒：二樓王祥宇右側的酒罈（隱藏）\n# 支線：衙役的問題 典藏版\n1. 和白連儀府外右邊的官府衙役說話。\n2. 「不是節度使」答「嶺南」，「在京城」答「劍南」。\n3. 得金塊×3。\n# 支線：小官韋青 資料片\n1. 和比武場旁的小官韋青說話。\n2. 答「賈南風」「武則天」，得舍利子（靈力 +100）。\n# 支線：老郭的寶物 資料片\n1. 聽西市三姑六婆說話，得知老郭藏了寶物。\n2. 到比武場找到提示紙。\n3. 到東平郡王府大門前右側的石燈。\n4. 到白連儀家門前左側的石獅。\n5. 潛入東平郡王府時，在二門左側的石龍腹中得青龍水珠（抗冰 100%）。\n# 支線：小太監 典藏版\n1. 和悅來客棧樓梯上的小太監說話。\n2. 答「金城公主」「咸宜公主」，得金塊×3。\n# 支線：公孫鞅 資料片\n1. 和蘭律閣的老人公孫鞅說話，他問年號。\n2. 答「3」「14」，得雅典之靴。\n# 支線：杜康居少東 資料片\n1. 和杜康居二樓右下角的少東說話。\n2. 答「馬日行 780 里」，得流光鞋。\n# 支線：魚腸\n- 西市武器攤商人可以花錢把中國劍開封成魚腸，只有一次機會。\n- 做«超級商人薩爾達»不要開封。", "html": "<h3>流程</h3><ol><li>進西南的白連儀家暫住，學習大唐文化。</li><li>決定把慧彥的舍利子送回少林寺（見<span class=\"goto\" data-title=\"少林寺\">少林寺</span>）。</li><li>之後追黃八時，會回來找老古做炸藥。</li></ol><h3>白連儀家</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"金創藥@628\" title=\"在物品大全中打開\">金創藥</span>：大廳左上（隱藏）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"風神符@704\" title=\"在物品大全中打開\">風神符</span>：書房書架（隱藏）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"飛翔魔油@679\" title=\"在物品大全中打開\">飛翔魔油</span>：書房右上角院子的石燈（隱藏，需用滑鼠點）</li></ul><h3>西市街道</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"延胡索之花@726\" title=\"在物品大全中打開\">延胡索之花</span>：地上，雜貨鋪門前左側</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"珍珠戒指@976\" title=\"在物品大全中打開\">珍珠戒指</span>：何慧紋左側的罈子（隱藏）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"神奇麵包@672\" title=\"在物品大全中打開\">神奇麵包</span>：從東數第三個雜貨攤（隱藏）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"茉莉花@825\" title=\"在物品大全中打開\">茉莉花</span>：朱雀門右側 <span class=\"tag domo\">DOMO</span></li></ul><h3>悅來客棧</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"神祕果@729\" title=\"在物品大全中打開\">神祕果</span>：入口右側罈子（隱藏）<span class=\"tag domo\">DOMO</span></li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"增肥劑@820\" title=\"在物品大全中打開\">增肥劑</span>：一樓房間左側櫃子（隱藏）<span class=\"tag domo\">DOMO</span></li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"魚酥@818\" title=\"在物品大全中打開\">魚酥</span>：一樓房間左側櫃子（隱藏）<span class=\"tag domo\">DOMO</span></li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"水果@828\" title=\"在物品大全中打開\">水果</span>：二樓杜甫房間的櫃子（隱藏）<span class=\"tag domo\">DOMO</span></li></ul><h3>雜貨鋪</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"靈界指標@769\" title=\"在物品大全中打開\">靈界指標</span>：右邊幾層草墊（隱藏）</li></ul><h3>長生藥房</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"蜂王露@688\" title=\"在物品大全中打開\">蜂王露</span>：寶箱，左側</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"山蛇莓@722\" title=\"在物品大全中打開\">山蛇莓</span>：右上書架（隱藏）<span class=\"tag domo\">DOMO</span></li></ul><h3>蘭律閣</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"機關設計圖２@777\" title=\"在物品大全中打開\">機關設計圖２</span>：寶箱，左側</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"諸方神石@698\" title=\"在物品大全中打開\">諸方神石</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"炎陽靈珠@710\" title=\"在物品大全中打開\">炎陽靈珠</span>：白老闆身後的櫃子（隱藏）</li><li>交換見<span class=\"goto\" data-title=\"魔晶礦\">魔晶礦</span>、<span class=\"goto\" data-title=\"機關設計圖\">機關設計圖</span>。</li></ul><h3>杜康居</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"天仙酒@701\" title=\"在物品大全中打開\">天仙酒</span>：二樓王祥宇右側的酒罈（隱藏）</li></ul><h3>支線：衙役的問題 <span class=\"tag edition\">典藏版</span></h3><ol><li>和白連儀府外右邊的官府衙役說話。</li><li>「不是節度使」答「嶺南」，「在京城」答「劍南」。</li><li>得<span class=\"jump items\" data-view=\"items\" data-detail=\"金塊@817\" title=\"在物品大全中打開\">金塊</span>×3。</li></ol><h3>支線：小官韋青 <span class=\"tag edition\">資料片</span></h3><ol><li>和比武場旁的小官韋青說話。</li><li>答「賈南風」「武則天」，得<span class=\"jump items\" data-view=\"items\" data-detail=\"舍利子@690\" title=\"在物品大全中打開\">舍利子</span>（靈力 +100）。</li></ol><h3>支線：老郭的寶物 <span class=\"tag edition\">資料片</span></h3><ol><li>聽西市三姑六婆說話，得知老郭藏了寶物。</li><li>到比武場找到提示紙。</li><li>到東平郡王府大門前右側的石燈。</li><li>到白連儀家門前左側的石獅。</li><li>潛入東平郡王府時，在二門左側的石龍腹中得<span class=\"jump items\" data-view=\"items\" data-detail=\"青龍水珠@944\" title=\"在物品大全中打開\">青龍水珠</span>（抗冰 100%）。</li></ol><h3>支線：小太監 <span class=\"tag edition\">典藏版</span></h3><ol><li>和悅來客棧樓梯上的小太監說話。</li><li>答「金城公主」「咸宜公主」，得<span class=\"jump items\" data-view=\"items\" data-detail=\"金塊@817\" title=\"在物品大全中打開\">金塊</span>×3。</li></ol><h3>支線：公孫鞅 <span class=\"tag edition\">資料片</span></h3><ol><li>和蘭律閣的老人公孫鞅說話，他問年號。</li><li>答「3」「14」，得<span class=\"jump items\" data-view=\"items\" data-detail=\"雅典之靴@909\" title=\"在物品大全中打開\">雅典之靴</span>。</li></ol><h3>支線：杜康居少東 <span class=\"tag edition\">資料片</span></h3><ol><li>和杜康居二樓右下角的少東說話。</li><li>答「馬日行 780 里」，得<span class=\"jump items\" data-view=\"items\" data-detail=\"流光鞋@1040\" title=\"在物品大全中打開\">流光鞋</span>。</li></ol><h3>支線：魚腸</h3><ul><li>西市武器攤商人可以花錢把<span class=\"jump items\" data-view=\"items\" data-detail=\"中國劍@578\" title=\"在物品大全中打開\">中國劍</span>開封成<span class=\"jump items\" data-view=\"items\" data-detail=\"魚腸@514\" title=\"在物品大全中打開\">魚腸</span>，只有一次機會。</li><li>做<span class=\"goto\" data-title=\"超級商人薩爾達\">超級商人薩爾達</span>不要開封。</li></ul>"}, {"chapter": "大唐", "title": "少林寺", "text": "少林寺\n# 流程\n1. 少林寺在長安城外東南。門口和悟緣說話，被要求從木人巷上山。\n2. 搬動右邊的石塔，進入木人巷。\n3. 出巷後安放慧彥的舍利子。\n4. 悟緣提到洛陽有邪教，一起去洛陽抓黃八。\n# 木人巷\n- 一進門就和木鐵人戰鬥，可偷神木之精（耐力 +10）。\n- 仙爐灰：香爐（隱藏）\n- 輪迴盤：寶箱\n- 機關設計圖４：寶箱\n- 金創藥：寶箱\n- 還靈丹：寶箱\n- 還神果：寶箱\n- 封印之劍（12）：封印之光\n# 三條路（只能選一條）\n- 上：金剛斗笠、千年何首烏、玄武土器（抗土 80%）、還靈丹\n- 中：金創藥、白虎風牙（抗風 80%）、海神盔、千年何首烏\n- 下：神光寶塔（抗光 80%）、神木之精\n# 出口\n- 出口前有一大群機關和尚，直接走過去，是幻影，不會觸發戰鬥。", "html": "<h3>流程</h3><ol><li>少林寺在長安城外東南。門口和悟緣說話，被要求從木人巷上山。</li><li>搬動右邊的石塔，進入木人巷。</li><li>出巷後安放慧彥的舍利子。</li><li>悟緣提到洛陽有邪教，一起去洛陽抓黃八。</li></ol><h3>木人巷</h3><ul><li>一進門就和<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"木鐵人@71\" title=\"在神魔異事錄中打開\">木鐵人</span>戰鬥，可偷<span class=\"jump items\" data-view=\"items\" data-detail=\"神木之精@692\" title=\"在物品大全中打開\">神木之精</span>（耐力 +10）。</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"仙爐灰@641\" title=\"在物品大全中打開\">仙爐灰</span>：香爐（隱藏）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"輪迴盤@645\" title=\"在物品大全中打開\">輪迴盤</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"機關設計圖４@779\" title=\"在物品大全中打開\">機關設計圖４</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"金創藥@628\" title=\"在物品大全中打開\">金創藥</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"還靈丹@639\" title=\"在物品大全中打開\">還靈丹</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"還神果@653\" title=\"在物品大全中打開\">還神果</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"封印之劍@793\" title=\"在物品大全中打開\">封印之劍</span>（12）：封印之光</li></ul><h3>三條路（只能選一條）</h3><ul><li>上：<span class=\"jump items\" data-view=\"items\" data-detail=\"金剛斗笠@899\" title=\"在物品大全中打開\">金剛斗笠</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"千年何首烏@633\" title=\"在物品大全中打開\">千年何首烏</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"玄武土器@946\" title=\"在物品大全中打開\">玄武土器</span>（抗土 80%）、<span class=\"jump items\" data-view=\"items\" data-detail=\"還靈丹@639\" title=\"在物品大全中打開\">還靈丹</span></li><li>中：<span class=\"jump items\" data-view=\"items\" data-detail=\"金創藥@628\" title=\"在物品大全中打開\">金創藥</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"白虎風牙@945\" title=\"在物品大全中打開\">白虎風牙</span>（抗風 80%）、<span class=\"jump items\" data-view=\"items\" data-detail=\"海神盔@895\" title=\"在物品大全中打開\">海神盔</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"千年何首烏@633\" title=\"在物品大全中打開\">千年何首烏</span></li><li>下：<span class=\"jump items\" data-view=\"items\" data-detail=\"神光寶塔@948\" title=\"在物品大全中打開\">神光寶塔</span>（抗光 80%）、<span class=\"jump items\" data-view=\"items\" data-detail=\"神木之精@692\" title=\"在物品大全中打開\">神木之精</span></li></ul><h3>出口</h3><ul><li>出口前有一大群機關和尚，直接走過去，是幻影，不會觸發戰鬥。</li></ul>"}, {"chapter": "大唐", "title": "洛陽", "text": "洛陽\n# 流程\n1. 進怡春院，和龜公、老鴇說話，得知黃八逃到長安西市。\n2. 西市杜康居外發生命案。\n3. 黃八逃進漢長安廢墟（見«漢長安廢墟（一）»）。\n# 城內\n- 菟絲魔子：地上，城門外\n- 博落迴之根：地上，客棧外\n- 神津珍譜─壹：乞丐小狗子右側，兩房子夾縫的水缸（隱藏）\n- 神津珍譜─參：麵攤旁的罈子（隱藏）\n- 庖丁菜刀：松韻居和回春堂之間的筐（隱藏，分解指令）\n# 雜貨鋪\n- 神草結：木桶處（隱藏）\n- 三教霞光鏡：櫃子（隱藏）\n# 上御客棧\n- 紅酒：入口左側罈子（隱藏）\n- 神津珍譜─貳：二樓樓梯上方的罈子（隱藏）\n# 松韻居\n- 鼠槌：寶箱，左側（鼠槌指令）\n- 交換見«魔晶礦»、«機關設計圖»。\n# 回春堂\n- 河車丸：右側櫃子（隱藏）\n- 七葉蓮：左側櫃子（隱藏）\n# 麵攤與武器販\n- 麵攤潘老闆：見«神津珍譜»。\n- 武器販王老五：救出王思月之後出現，見«太皇刀»。\n# 支線：乞丐小狗子\n- 給 300 銀幣：告訴你黑壇總教的位置。\n- 給 600 銀幣：得三葉雪桑果（生命 +100）。\n# 支線：宗楚客 資料片\n- 怡春院外，見«宗楚客的玉器»。\n# 支線：阿穆 資料片\n- 雜貨鋪的大食商人，見«聖皇裝備»。\n# 支線：艾布 資料片\n1. 和上御客棧二樓的波斯商人艾布說話，幫他數明珠。\n2. 答「107」，得法藏。\n# 支線：孫思年 資料片\n1. 和回春堂的書生孫思年說話。\n2. 答「樂經」，得子雷手套。", "html": "<h3>流程</h3><ol><li>進怡春院，和龜公、老鴇說話，得知黃八逃到長安西市。</li><li>西市杜康居外發生命案。</li><li>黃八逃進漢長安廢墟（見<span class=\"goto\" data-title=\"漢長安廢墟（一）\">漢長安廢墟（一）</span>）。</li></ol><h3>城內</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"菟絲魔子@728\" title=\"在物品大全中打開\">菟絲魔子</span>：地上，城門外</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"博落迴之根@719\" title=\"在物品大全中打開\">博落迴之根</span>：地上，客棧外</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"神津珍譜─壹@782\" title=\"在物品大全中打開\">神津珍譜─壹</span>：乞丐小狗子右側，兩房子夾縫的水缸（隱藏）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"神津珍譜─參@784\" title=\"在物品大全中打開\">神津珍譜─參</span>：麵攤旁的罈子（隱藏）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"庖丁菜刀@953\" title=\"在物品大全中打開\">庖丁菜刀</span>：松韻居和回春堂之間的筐（隱藏，分解指令）</li></ul><h3>雜貨鋪</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"神草結@995\" title=\"在物品大全中打開\">神草結</span>：木桶處（隱藏）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"三教霞光鏡@713\" title=\"在物品大全中打開\">三教霞光鏡</span>：櫃子（隱藏）</li></ul><h3>上御客棧</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"紅酒@794\" title=\"在物品大全中打開\">紅酒</span>：入口左側罈子（隱藏）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"神津珍譜─貳@783\" title=\"在物品大全中打開\">神津珍譜─貳</span>：二樓樓梯上方的罈子（隱藏）</li></ul><h3>松韻居</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"鼠槌@938\" title=\"在物品大全中打開\">鼠槌</span>：寶箱，左側（鼠槌指令）</li><li>交換見<span class=\"goto\" data-title=\"魔晶礦\">魔晶礦</span>、<span class=\"goto\" data-title=\"機關設計圖\">機關設計圖</span>。</li></ul><h3>回春堂</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"河車丸@662\" title=\"在物品大全中打開\">河車丸</span>：右側櫃子（隱藏）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"七葉蓮@661\" title=\"在物品大全中打開\">七葉蓮</span>：左側櫃子（隱藏）</li></ul><h3>麵攤與武器販</h3><ul><li>麵攤潘老闆：見<span class=\"goto\" data-title=\"神津珍譜\">神津珍譜</span>。</li><li>武器販王老五：救出王思月之後出現，見<span class=\"goto\" data-title=\"太皇刀\">太皇刀</span>。</li></ul><h3>支線：乞丐小狗子</h3><ul><li>給 300 銀幣：告訴你黑壇總教的位置。</li><li>給 600 銀幣：得<span class=\"jump items\" data-view=\"items\" data-detail=\"三葉雪桑果@687\" title=\"在物品大全中打開\">三葉雪桑果</span>（生命 +100）。</li></ul><h3>支線：宗楚客 <span class=\"tag edition\">資料片</span></h3><ul><li>怡春院外，見<span class=\"goto\" data-title=\"宗楚客的玉器\">宗楚客的玉器</span>。</li></ul><h3>支線：阿穆 <span class=\"tag edition\">資料片</span></h3><ul><li>雜貨鋪的大食商人，見<span class=\"goto\" data-title=\"聖皇裝備\">聖皇裝備</span>。</li></ul><h3>支線：艾布 <span class=\"tag edition\">資料片</span></h3><ol><li>和上御客棧二樓的波斯商人艾布說話，幫他數明珠。</li><li>答「107」，得<span class=\"jump items\" data-view=\"items\" data-detail=\"法藏@1029\" title=\"在物品大全中打開\">法藏</span>。</li></ol><h3>支線：孫思年 <span class=\"tag edition\">資料片</span></h3><ol><li>和回春堂的書生孫思年說話。</li><li>答「樂經」，得<span class=\"jump items\" data-view=\"items\" data-detail=\"子雷手套@889\" title=\"在物品大全中打開\">子雷手套</span>。</li></ol>"}, {"chapter": "大唐", "title": "漢長安廢墟（一）", "text": "漢長安廢墟（一）\n# 流程\n1. 長安西南的山洞。進去後見一名女子往深處走，跟上去。\n2. 打敗黃八。\n3. 搜完整個廢墟，找到那名女子王思月。\n4. 回長安西市雜貨鋪找老古做炸藥，等三分鐘。\n5. 回來炸開山壁。\n6. 遇到康那里士，悟緣變成夜叉悟緣，打敗後恢復。\n7. 王思月邀眾人去她家。\n# 注意\n這一趟有三樣安史之亂前才拿得到：\n- 俱樂部會員卡\n- 名歌星ＣＤ\n- 神津珍譜─伍\n# 第一區\n- 靈界指標：入口左側草叢（隱藏）\n- 白皙葫蘆：黃八後面屋子的左側櫃子（隱藏）\n- 機關設計圖３：黃八後面左上第二間屋子的桌子（隱藏）\n- 神津珍譜─伍：豐饒之角上面那間屋子，右側櫃子（隱藏）\n- 名歌星ＣＤ：寶箱，總入口一直往右 DOMO\n- 炭粉：寶箱，總入口上行右邊\n- 硝石：寶箱，右行往上的屋子\n- 金創藥：寶箱\n- 還魄丹：寶箱\n- 豐饒之角：寶箱（體力 +50）\n- 聖石榴：寶箱\n- 七葉蓮：地上\n- 柴胡乾葛草：地上\n# 第二區\n- 姜公膽：進去後左邊很大的白色破罈子（隱藏，連擊指令）\n- 鬼眼法刀：入口左上屋子，右邊瓶子（隱藏）\n- 星君眼：入口右上屋子，左邊罈子（隱藏，攻擊加 50%）\n- 俱樂部會員卡：賽特和悟緣說話的屋子（隱藏）DOMO\n- 竹筒：寶箱，賽特和悟緣說話的屋子外\n- 機關設計圖６：再往右上的屋子，右邊桌子（隱藏）\n- 乾坤袋：同一間屋子門前的破櫃子（隱藏，偷竊指令）\n- 硫磺：寶箱，入口正中往上的屋子\n- 金創藥：寶箱\n- 海檬果：寶箱\n- 啻浪奇甲：寶箱\n- 土地神符：寶箱\n- 香柏葉：地上\n# 炸開的山壁\n- 靈虛扇：淨化所有異常狀態\n- 封印之劍（13）：封印之光\n# 偷竊\n- 冥府獄卒可偷河車丸。\n- 瘟鬼可偷七葉蓮。\n- 救下食屍鬼，會出現白無常。", "html": "<h3>流程</h3><ol><li>長安西南的山洞。進去後見一名女子往深處走，跟上去。</li><li>打敗<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"黃八@381\" title=\"在神魔異事錄中打開\">黃八</span>。</li><li>搜完整個廢墟，找到那名女子王思月。</li><li>回長安西市雜貨鋪找老古做炸藥，等三分鐘。</li><li>回來炸開山壁。</li><li>遇到<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"康那里士@7\" title=\"在神魔異事錄中打開\">康那里士</span>，悟緣變成<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"夜叉悟緣@52\" title=\"在神魔異事錄中打開\">夜叉悟緣</span>，打敗後恢復。</li><li>王思月邀眾人去她家。</li></ol><h3>注意</h3><p>這一趟有三樣<span class=\"tag time\">安史之亂前</span>才拿得到：</p><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"俱樂部會員卡@821\" title=\"在物品大全中打開\">俱樂部會員卡</span></li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"名歌星ＣＤ@819\" title=\"在物品大全中打開\">名歌星ＣＤ</span></li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"神津珍譜─伍@786\" title=\"在物品大全中打開\">神津珍譜─伍</span></li></ul><h3>第一區</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"靈界指標@769\" title=\"在物品大全中打開\">靈界指標</span>：入口左側草叢（隱藏）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"白皙葫蘆@711\" title=\"在物品大全中打開\">白皙葫蘆</span>：黃八後面屋子的左側櫃子（隱藏）</li><li><span class=\"
