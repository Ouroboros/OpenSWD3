[paths]

# Windows paths can use TOML literal strings, so backslashes need no escaping.
# data_dir = 'E:\Game\swd3'

# Linux and macOS example:
# data_dir = '/home/user/games/swd3'

[window]

# The game always renders internally at 640x480. These values only control
# the restored host window; game content keeps its aspect ratio.
width = 960
height = 720
maximized = false
