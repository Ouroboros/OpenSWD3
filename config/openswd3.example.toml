[paths]

# Windows paths can use TOML literal strings, so backslashes need no escaping.
# data_dir = 'E:\Game\swd3'

# Linux and macOS example:
# data_dir = '/home/user/games/swd3'

[window]

# The game always renders internally at 640x480. These values only control
# the restored host window; game content keeps its aspect ratio.
width = 960
height = 720
maximized = false

[battle]

# Original default: 11. The game menu uses 0 (slow) through 11 (fast).
# Configuration accepts the original stored byte range 0..255 without clamping.
speed = 11

[dialog]

# Optional test convenience: synthesize Space only for interactive dialog
# messages without choices. Does not select menu options or affect battle input.
# Disabled unless explicitly enabled.
auto_advance = false
# Delay before the first press and between subsequent presses (milliseconds).
interval_ms = 120

[display]

# 0 keeps presentation coupled to the original 35/70 ms game clock.
# A positive value enables the independent display refresh clock.
fps = 0

# Opt in to interpolated world camera/role motion when fps is positive.
# Other screens repeat the latest frame. Game state is never advanced here.
world_motion_interpolation = false
